var STIL_IMPLICIT='sticla';
function stilCurent(){
 if(!esteLogat())return STIL_IMPLICIT;
 try{return localStorage.getItem(cheieCont('stil'))||STIL_IMPLICIT}catch(e){return STIL_IMPLICIT}
}
function aplicaStil(nume,trimiteMaiDeparte){
 var st=STILURI[nume]||STILURI[STIL_IMPLICIT];
 var el=document.getElementById('mrf-stil-butoane');
 if(!el){
  el=document.createElement('style');
  el.id='mrf-stil-butoane';
  document.head.appendChild(el);
 }
 el.textContent=st.css||'';
 if(trimiteMaiDeparte!==false){
  var f=document.querySelectorAll('iframe');
  for(var i=0;i<f.length;i++){
   try{f[i].contentWindow.postMessage({type:'stil',css:st.css||''},'*')}catch(e){}
  }
 }
}
function alegeStil(){
 if(!esteLogat()){ ceruteCont('Forma butoanelor'); return }
 var acum=stilCurent();
 var corp='<div class="tema-lista">';
 Object.keys(STILURI).forEach(function(k){
  corp+='<button class="tema-op'+(k===acum?' aleasa':'')+'" data-stil="'+k+'">'+
    STILURI[k].nume+'</button>';
 });
 corp+='</div>';
 arataModal({titlu:'Forma butoanelor',corp:corp,
   butoane:[{text:'Gata',principal:true,valoare:true}]});
 setTimeout(function(){
  document.querySelectorAll('.tema-op[data-stil]').forEach(function(b){
   b.addEventListener('click',function(){
    var k=b.getAttribute('data-stil');
    try{localStorage.setItem(cheieCont('stil'),k)}catch(e){}
    aplicaStil(k);
    document.querySelectorAll('.tema-op[data-stil]').forEach(function(x){x.classList.remove('aleasa')});
    b.classList.add('aleasa');
   });
  });
 },50);
}
function temaCurenta(){
 if(!esteLogat())return TEMA_IMPLICITA;
 try{return localStorage.getItem(cheieCont('tema'))||TEMA_IMPLICITA}catch(e){return TEMA_IMPLICITA}
}
function toateTemele(){
 var t={};
 for(var k in TEME)t[k]=TEME[k];
 for(var k2 in TEME_ECHIPE)t['ec_'+k2]=TEME_ECHIPE[k2];
 return t;
}
function aplicaTema(nume,trimiteMaiDeparte){
 var t=toateTemele()[nume]||TEME[TEMA_IMPLICITA];
 var r=document.documentElement;
 for(var k in t.v)r.style.setProperty(k,t.v[k]);
 if(trimiteMaiDeparte!==false){
  var f=document.querySelectorAll('iframe');
  for(var i=0;i<f.length;i++){
   try{f[i].contentWindow.postMessage({type:'tema',valori:t.v},'*')}catch(e){}
  }
 }
}
function alegeTema(){
 if(!esteLogat()){ ceruteCont('Temele de culoare'); return }
 var acum=temaCurenta();
 function mostre(t){
  return '<span class="tema-mostre">'+
    '<i style="background:'+t.v['--bg']+'"></i>'+
    '<i style="background:'+t.v['--card']+'"></i>'+
    '<i style="background:'+t.v['--red']+'"></i>'+
    '<i style="background:'+t.v['--gold']+'"></i></span>';
 }
 var corp='<div class="d-taburi" id="tema-taburi">'+
   '<button class="d-tab activ" data-tsec="app">Aplicatie</button>'+
   '<button class="d-tab" data-tsec="ec">Echipe SuperLiga</button></div>';
 corp+='<div id="tema-sec-app" class="tema-lista">';
 Object.keys(TEME).forEach(function(k){
  corp+='<button class="tema-op'+(k===acum?' aleasa':'')+'" data-tema="'+k+'">'+
    mostre(TEME[k])+'<span>'+TEME[k].nume+'</span></button>';
 });
 corp+='</div><div id="tema-sec-ec" class="tema-lista" style="display:none">';
 Object.keys(TEME_ECHIPE).forEach(function(k){
  var cheie='ec_'+k;
  corp+='<button class="tema-op'+(cheie===acum?' aleasa':'')+'" data-tema="'+cheie+'">'+
    mostre(TEME_ECHIPE[k])+'<span>'+TEME_ECHIPE[k].nume+'</span></button>';
 });
 corp+='</div>';
 arataModal({titlu:'Tema aplicatiei',corp:corp,
   butoane:[{text:'Gata',principal:true,valoare:true}]});
 setTimeout(function(){
  document.querySelectorAll('#tema-taburi .d-tab').forEach(function(tb){
   tb.addEventListener('click',function(){
    var k=tb.getAttribute('data-tsec');
    var a=document.getElementById('tema-sec-app'), e=document.getElementById('tema-sec-ec');
    if(a)a.style.display=(k==='app'?'':'none');
    if(e)e.style.display=(k==='ec'?'':'none');
    document.querySelectorAll('#tema-taburi .d-tab').forEach(function(x){
     x.classList.toggle('activ',x===tb);
    });
   });
  });
  document.querySelectorAll('.tema-op').forEach(function(b){
   b.addEventListener('click',function(){
    var k=b.getAttribute('data-tema');
    try{localStorage.setItem(cheieCont('tema'),k)}catch(e){}
    aplicaTema(k);
    document.querySelectorAll('.tema-op').forEach(function(x){x.classList.remove('aleasa')});
    b.classList.add('aleasa');
   });
  });
 },50);
}

function actualizeazaModInvitat(){
 var invitat=!esteLogat();
 document.body.classList.toggle('mod-invitat',invitat);
 // cine n-are voie la cote le vede ascunse, dar restul aplicatiei ii ramane
 document.body.classList.toggle('fara-cote',!invitat&&!areVoieLaCote());
 var profil=document.getElementById('profil-cont');
 if(profil){
  if(invitat){
   profil.innerHTML='<span id="buton-logare">Intra in cont</span>';
   profil.setAttribute('title','Intra in cont ca sa vezi cotele si biletul');
  }else if(!document.getElementById('sold-monede')){
   profil.innerHTML='<span id="nume-cont">-</span>'+
     '<span class="moneda">&#129689; <b id="sold-monede">0</b></span>';
  }
 }
 // spunem si paginilor de sport din iframe-uri, ca sa scoata cotele de pe carduri
 anuntaIframeurile();
}
function anuntaIframeurile(){
 /* ATENTIE, aici a fost un bug urat dupa mutarea conturilor pe Firebase:
    la fotbal ramanea DOAR tab-ul "Azi", chiar si logat.
    De ce: pana acum lista de conturi era coapta in pagina, deci se stia din
    prima cine esti. Acum vine din Firestore, la vreo secunda dupa deschidere -
    iar in secunda aia le spuneam paginilor de sport "e invitat". Ele isi
    ascund atunci tot ce e cu cont (Maine, Ieri, Evaluare, cotele), si cand
    aflam adevarul era prea tarziu, fiindca ascunderea nu se da inapoi.
    Deci: daca telefonul tine minte un cont dar lista inca n-a ajuns, nu
    spunem NIMIC. Mai bine o secunda de tacere decat o zi cu tab-uri lipsa. */
 if(CONTURI_VII===null&&utilizator)return;
 var invitat=!esteLogat();
 var ascundeCote=invitat||!areVoieLaCote();
 var f=document.querySelectorAll('iframe');
 for(var i=0;i<f.length;i++){
  try{f[i].contentWindow.postMessage({type:'mod-invitat',invitat:invitat,
                                      fara_cote:ascundeCote},'*')}catch(e){}
 }
 // paginile de sport se incarca pe rand, deci le retrimitem si tema
 try{aplicaTema(temaCurenta())}catch(e){}
}
// iframe-urile se incarca pe rand, deci mai spunem din cand in cand
setInterval(anuntaIframeurile,1500);

function ceruteCont(ce){
 arataModal({titlu:'Ai nevoie de cont',
   corp:'<p>'+esc(ce||'Asta')+' se vede doar cu cont.</p>'+
        '<p class="sub">Procentele, statisticile si detaliile sunt libere pentru '+
        'toata lumea. Cotele, biletul si monedele cer cont - si conturile le fac '+
        'eu, nu se pot face singure.</p>',
   butoane:[{text:'Inchide',valoare:false},{text:'Intra in cont',principal:true,valoare:'log'}]})
  .then(function(v){ if(v==='log')ferestraLogare() });
}
function ferestraLogare(){
 // ATENTIE, aici a fost o capcana: fereastra se inchide inainte sa apuce
 // butonul sa citeasca ce ai scris, deci codul cauta campuri care nu mai
 // existau si nu se intampla NIMIC - nici logare, nici mesaj de eroare.
 // De aceea copiem ce ai scris cu un ascultator "de captura", care ruleaza
 // inaintea inchiderii.

/* Fiecare isi schimba singur parola. Nici administratorul nu poate face asta
   in locul lui - nici macar nu i-o poate citi, e la Firebase si nimeni n-o
   vede in clar. Cerem si parola de acum, nu doar pe cea noua: e dovada ca la
   telefon e chiar el, nu cineva care a apucat aplicatia deschisa.

   De stiut, daca te intreaba cineva: cine isi uita parola NU si-o poate lua
   inapoi (adresele sunt inventate, n-are unde veni un link de resetare).
   Atunci adminul ii sterge contul si i-l face din nou, cu alta parola -
   monedele lui raman, ca stau pe telefonul lui, legate de nume. */
function schimbaParola(){
 if(!esteLogat()||!window.FB||!window.FB.auth.currentUser){
  ceruteCont('Schimbarea parolei'); return;
 }
 var scris={v:'',n:'',n2:''};
 function ia(){
  var a=document.getElementById('p-veche'),b=document.getElementById('p-noua'),
      c=document.getElementById('p-noua2');
  if(a)scris.v=a.value||''; if(b)scris.n=b.value||''; if(c)scris.n2=c.value||'';
 }
 document.addEventListener('click',ia,true);
 arataModal({titlu:'Schimba parola',
   corp:'<p class="sub">Cel putin 6 semne. Dupa ce o schimbi, n-o mai stie '+
        'nimeni in afara de tine - deci daca o uiti, contul trebuie facut din nou.</p>'+
        '<input id="p-veche" type="password" placeholder="Parola de acum" class="mrf-inp" autocomplete="current-password">'+
        '<input id="p-noua" type="password" placeholder="Parola noua" class="mrf-inp" autocomplete="new-password">'+
        '<input id="p-noua2" type="password" placeholder="Inca o data parola noua" class="mrf-inp" autocomplete="new-password">',
   butoane:[{text:'Renunt',valoare:false},{text:'Schimb',principal:true,valoare:'ok'}]})
  .then(function(v){
   document.removeEventListener('click',ia,true);
   if(v!=='ok')return;
   if(String(scris.n).length<6){
    mesaj('Prea scurta','<p>Parola noua trebuie sa aiba cel putin 6 semne.</p>'); return;
   }
   if(scris.n!==scris.n2){
    mesaj('Nu se potrivesc','<p>Cele doua parole noi nu sunt scrise la fel.</p>'); return;
   }
   var F=window.FB, cont=F.auth.currentUser;
   F.reautentifica(cont,F.credential(cont.email,scris.v))
    .then(function(){ return F.updatePassword(cont,scris.n) })
    .then(function(){
      mesaj('Gata','<p>Parola a fost schimbata.</p>'+
        '<p class="sub">Daca ai contul deschis si pe alt telefon, acolo o sa-ti '+
        'ceara parola noua.</p>');
    })
    .catch(function(e){
      var c=String((e&&e.code)||'');
      var text=(c.indexOf('wrong-password')>=0||c.indexOf('invalid-credential')>=0)
               ?'Parola de acum nu e buna.':eroareAuth(e);
      mesaj('N-a mers','<p>'+esc(text)+'</p>');
    });
  });
 setTimeout(function(){var c=document.getElementById('p-veche');if(c)c.focus()},60);
}

function inchideModal(){

/* optiuni: {titlu, corp (html), butoane:[{text, principal, valoare}]}
   returneaza o promisiune cu valoarea butonului apasat                      */
function arataModal(o){
 inchideModal();
 return new Promise(function(res){
  var d=document.createElement('div');
  d.id='mrf-modal';
  var but=(o.butoane||[{text:'OK',principal:true,valoare:true}]).map(function(b,i){
   return '<button data-i="'+i+'" class="mrf-mb'+(b.principal?' principal':'')+'">'+b.text+'</button>';
  }).join('');
  d.innerHTML='<div class="mrf-modal-fundal"></div><div class="mrf-modal-cutie">'+
    (o.titlu?'<div class="mrf-modal-titlu">'+o.titlu+'</div>':'')+
    '<div class="mrf-modal-corp">'+(o.corp||'')+'</div>'+
    '<div class="mrf-modal-butoane">'+but+'</div></div>';
  document.body.appendChild(d);
  var butoane=o.butoane||[{text:'OK',principal:true,valoare:true}];
  d.querySelectorAll('.mrf-mb').forEach(function(b){
   b.addEventListener('click',function(){
    var v=butoane[parseInt(b.getAttribute('data-i'))].valoare;
    inchideModal();res(v);
   });
  });
  d.querySelector('.mrf-modal-fundal').addEventListener('click',function(){
   inchideModal();res(false);
  });
 });
}

/* ══════════ BILETELE MELE (salvate pe telefon) ══════════════════════════
   Biletele pe care le pui tu se salveaza in memoria telefonului
   (localStorage) - raman si dupa ce inchizi aplicatia. Verificarea daca au
   iesit se face automat, contra fisierului pagini/rezultate.json (rezultatele
   reale din ultimele 3 saptamani, toate sporturile), descarcat DOAR cand
   deschizi pagina asta - de-aia pagina principala ramane mica si rapida.  */
var MAX_BILETE_PASTRATE=50;   // peste atatea, cele mai vechi se sterg (dar raman in statistici)
var bileteleMele=[];
try{bileteleMele=JSON.parse(localStorage.getItem('mrfBileteleMele')||'[]')}catch(e){}
// Statistici CUMULATE, pastrate pentru totdeauna: cand un bilet vechi e sters
// ca sa nu se umple memoria telefonului, rezultatul lui se aduna aici, deci
// "40 din 60 castigate" ramane corect chiar daca in lista mai vezi doar 50.
var statBilete={total:0,castigate:0,pierdute:0,profit:0};
try{statBilete=Object.assign(statBilete,JSON.parse(localStorage.getItem('mrfStatBilete')||'{}'))}catch(e){}

function salveazaBileteleMele(){
 try{
  localStorage.setItem('mrfBileteleMele',JSON.stringify(bileteleMele));
  localStorage.setItem('mrfStatBilete',JSON.stringify(statBilete));
 }catch(e){}
}

function taiePesteLimita(){
 if(bileteleMele.length<=MAX_BILETE_PASTRATE)return;
 // stergem de la coada (cele mai vechi - lista e ordonata descrescator),
 // dar mutam intai rezultatul lor in statisticile cumulate
 var deSters=bileteleMele.slice(MAX_BILETE_PASTRATE);
 deSters.forEach(function(b){
  if(b.stare==='castigat'||b.stare==='pierdut'){
   statBilete.total++;
   if(b.stare==='castigat'){statBilete.castigate++;statBilete.profit+=(b.cota-1)}
   else{statBilete.pierdute++;statBilete.profit-=1}
  }
 });
 bileteleMele=bileteleMele.slice(0,MAX_BILETE_PASTRATE);
}

// statistici COMPLETE = cele din lista curenta + cele deja arhivate
function statisticiTotale(){
 var decise=bileteleMele.filter(function(b){return b.stare==='castigat'||b.stare==='pierdut'});
 var cast=decise.filter(function(b){return b.stare==='castigat'}).length;
 var profit=0;
 decise.forEach(function(b){profit+=(b.stare==='castigat'?(b.cota-1):-1)});
 return {
  total: decise.length+statBilete.total,
  castigate: cast+statBilete.castigate,
  pierdute: (decise.length-cast)+statBilete.pierdute,
  profit: profit+statBilete.profit,
  in_lista: bileteleMele.length
 };
}

// statistici doar pe ultimele N bilete decise (tendinta recenta)
function statisticiRecente(n){
 var decise=bileteleMele.filter(function(b){return b.stare==='castigat'||b.stare==='pierdut'}).slice(0,n);
 var cast=decise.filter(function(b){return b.stare==='castigat'}).length;
 var profit=0;
 decise.forEach(function(b){profit+=(b.stare==='castigat'?(b.cota-1):-1)});
 return {n:decise.length,castigate:cast,profit:profit};
}

// TREBUIE sa fie identica cu norm_echipa() din Python, altfel cheile nu se
// potrivesc si niciun bilet nu s-ar verifica vreodata (patit: JS stergea si
// spatiile, Python le pastreaza - "st kilda saints" vs "stkildasaints")
function normEch(s){
 return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
}
/* Varianta "tare" a numelui: fara diacritice si fara semne de punctuatie.
   "1.FC Phönix Lübeck" -> "1fcphonixlubeck". Ne trebuie fiindca numele scris
   pe biletul tau vine din pagina de sport, iar cel din rezultate vine din baza,
   si cele doua difera uneori la un punct sau la un ö - destul cat cheia sa nu
   se mai potriveasca si selectia sa ramana vesnic "in asteptare". */
function normEchTare(s){
 // NFD desparte litera de accent (o + accent), apoi aruncam accentele:
 // codurile intre 0x300 si 0x36f sunt exact semnele diacritice.
 var t=String(s||'').normalize('NFD'), out='';
 for(var i=0;i<t.length;i++){
  var c=t.charCodeAt(i);
  if(c>=0x300&&c<=0x36f)continue;
  out+=t.charAt(i);
 }
 return out.toLowerCase().replace(/[^a-z0-9]+/g,'');
}
var INDEX_REZ=null;
function indexRezultate(){
 if(INDEX_REZ)return INDEX_REZ;
 INDEX_REZ={};
 for(var cheie in REZULTATE){
  var p=cheie.split('|');
  if(p.length<4)continue;
  var k=p[0]+'|'+normEchTare(p[1])+'|'+normEchTare(p[2])+'|'+p[3];
  if(!INDEX_REZ[k])INDEX_REZ[k]=REZULTATE[cheie];
 }
 return INDEX_REZ;
}
function cautaRezultat(sel){
 if(!REZULTATE)return null;
 var zile=[], d=sel.start?new Date(sel.start):null;
 if(d&&!isNaN(d)){
  for(var i=-1;i<=1;i++){                       // +/-1 zi: meciurile de noapte
   var z=new Date(d.getTime()+i*86400000);       // pot cadea pe alta zi in UTC
   zile.push(z.toISOString().substring(0,10));
  }
 }
 var k;
 for(k=0;k<zile.length;k++){
  var cheie=sel.sport+'|'+normEch(sel.home)+'|'+normEch(sel.away)+'|'+zile[k];
  if(REZULTATE[cheie])return REZULTATE[cheie];
 }
 // n-am gasit pe potrivire exacta - mai incercam o data fara diacritice si
 // fara punctuatie. Cerem sa se potriveasca AMBELE echipe, ca sa nu decontam
 // din greseala un pariu dupa alt meci.
 var idx=indexRezultate();
 var h=normEchTare(sel.home), a=normEchTare(sel.away);
 if(!h||!a)return null;
 for(k=0;k<zile.length;k++){
  var c2=sel.sport+'|'+h+'|'+a+'|'+zile[k];
  if(idx[c2])return idx[c2];
 }
 // Ultima incercare: DUPA ECHIPE, fara zi.
 // De ce e nevoie: unele selectii n-au salvata data meciului. Cautarea de mai
 // sus porneste de la data ca sa stie in ce zi sa se uite - fara ea nu cauta
 // nicaieri, si selectia ramanea "in asteptare" la nesfarsit, desi rezultatul
 // era in fisier. Aici cautam meciul dintre exact aceleasi doua echipe,
 // indiferent de zi. Cerem tot potrivire pe amandoua, deci nu se poate deconta
 // dupa alt meci; iar daca aceleasi echipe s-au intalnit de doua ori in
 // ultimele saptamani, luam meciul cel mai recent.
 var fz=indexFaraZi();
 var cheieFz=sel.sport+'|'+h+'|'+a;
 return fz[cheieFz]||null;
}
var INDEX_FZ=null;
function indexFaraZi(){
 if(INDEX_FZ)return INDEX_FZ;
 INDEX_FZ={};
 var zileVazute={};
 for(var cheie in REZULTATE){
  var p=cheie.split('|');
  if(p.length<4)continue;
  var k=p[0]+'|'+normEchTare(p[1])+'|'+normEchTare(p[2]);
  // pastram meciul cel mai recent dintre aceleasi doua echipe
  if(!INDEX_FZ[k]||p[3]>zileVazute[k]){
   INDEX_FZ[k]=REZULTATE[cheie];
   zileVazute[k]=p[3];
  }
 }
 return INDEX_FZ;
}
function pesteSub(pick,total){
 var m=String(pick).match(/([\d.]+)/); if(!m)return 'neverificabil';
 var linie=parseFloat(m[1]);
 if(total===linie)return 'neverificabil';       // linie exacta = bani inapoi
 var ePeste=/peste|over/i.test(pick);
 return (ePeste?(total>linie):(total<linie))?'castigat':'pierdut';
}
// Dupa atatea zile, un meci fara rezultat nu mai are cum sa primeasca unul.
var ZILE_PANA_LA_ANULARE=3;
function verificaSelectie(sel){
 var r=cautaRezultat(sel);
 if(!r){
  // Meciul s-a jucat acum cateva zile si tot n-are rezultat? Atunci n-o sa mai
  // apara niciodata: a fost amanat, anulat sau abandonat. (Verificat pe datele
  // noastre: dintr-o zi obisnuita, vreo 90 de meciuri din 3300 raman asa.)
  // Facem ce face orice casa de pariuri - selectia se ANULEAZA si nu mai tine
  // biletul agatat pe veci. Restul selectiilor decid biletul.
  var d=sel.start?new Date(sel.start):null;
  if(d&&!isNaN(d.getTime())&&(Date.now()-d.getTime())>ZILE_PANA_LA_ANULARE*86400000){
   return 'neverificabil';
  }
  return 'in asteptare';
 }
 var h=r.h,a=r.a,tip=sel.tip,pick=sel.pick;
 if(sel.sport==='Fotbal'){
  var real=h>a?'1':(h<a?'2':'X');
  if(tip==='1X2')return pick===real?'castigat':'pierdut';
  if(tip==='DC'){                       // sansa dubla: 1X, X2, 12
   var p=String(pick).replace(/[^12X]/gi,'').toUpperCase();
   return p.indexOf(real)>=0?'castigat':'pierdut';
  }
  if(tip==='DNB'){                      // egal = miza inapoi
   if(h===a)return 'neverificabil';
   var castig=(h>a)?'1':'2';
   return (String(pick).indexOf(castig)>=0||normEch(pick)===normEch(h>a?sel.home:sel.away))?'castigat':'pierdut';
  }
  if(tip==='GG'){
   var gg=(h>0&&a>0);
   return ((pick==='GG')===gg)?'castigat':'pierdut';
  }
  if(tip==='Goluri'||tip==='O/U')return pesteSub(pick,h+a);
  if(tip==='GolEchipa'){                // "Gazde peste 1.5" / "Oaspeti sub 0.5"
   var mge=String(pick).match(/^(Gazde|Oaspeti)\s+(.+)$/i);
   if(!mge)return 'neverificabil';
   return pesteSub(mge[2],mge[1].toLowerCase()==='gazde'?h:a);
  }
  // ── pe reprize (au nevoie de scorul la pauza) ──
  if(tip==='GolR1'){ if(!r.ht)return 'neverificabil'; return pesteSub(pick,r.ht[0]+r.ht[1]) }
  if(tip==='GolR2'){ if(!r.ht)return 'neverificabil'; return pesteSub(pick,(h-r.ht[0])+(a-r.ht[1])) }
  if(tip==='R1X2'){
   if(!r.ht)return 'neverificabil';
   var r1=r.ht[0]>r.ht[1]?'1':(r.ht[0]<r.ht[1]?'2':'X');
   return pick===r1?'castigat':'pierdut';
  }
  // ── cornere / cartonase TOTALE (multe meciuri din ligi mici n-au
  //    statistici; atunci selectia iese "anulata", nu blocheaza biletul) ──
  if(tip==='AH'){                       // handicap asiatic: "Gazde +1.5"
   var mah=String(pick).match(/(Gazde|Oaspeti)\s*([+-]?[0-9.]+)/i);
   if(!mah)return 'neverificabil';
   var linie=parseFloat(mah[2]);
   if(isNaN(linie))return 'neverificabil';
   var dif=(mah[1].toLowerCase()==='gazde')?(h-a):(a-h);
   var rez=dif+linie;
   if(rez>0)return 'castigat';
   if(rez<0)return 'pierdut';
   return 'neverificabil';               // egalitate pe linie = miza inapoi
  }
  /* Handicap asiatic PE REPRIZE. Aceeasi socoteala ca la handicapul pe tot
     meciul, dar cu golurile reprizei: la pauza le avem direct (r.ht), iar
     repriza a doua e finalul minus pauza. Fara scorul la pauza nu putem
     spune nimic - selectia se anuleaza, nu ghicim. */
  if(tip==='AHR1'||tip==='AHR2'){
   if(!r.ht)return 'neverificabil';
   var mr=String(pick).match(/(Gazde|Oaspeti)\s*([+-]?[0-9.]+)/i);
   if(!mr)return 'neverificabil';
   var lin=parseFloat(mr[2]);
   if(isNaN(lin))return 'neverificabil';
   var gg,go;
   if(tip==='AHR1'){ gg=r.ht[0]; go=r.ht[1] }
   else { gg=h-r.ht[0]; go=a-r.ht[1] }
   var dr=(mr[1].toLowerCase()==='gazde')?(gg-go):(go-gg);
   var rr=dr+lin;
   if(rr>0)return 'castigat';
   if(rr<0)return 'pierdut';
   return 'neverificabil';               // egalitate pe linie = miza inapoi
  }
  /* Pauza / Final: "1/X" inseamna gazdele conduc la pauza si se termina egal. */
  if(tip==='PF'){
   if(!r.ht)return 'neverificabil';
   var pp=String(pick).split('/');
   if(pp.length!==2)return 'neverificabil';
   var sP=r.ht[0]>r.ht[1]?'1':(r.ht[0]<r.ht[1]?'2':'X');
   var sF=h>a?'1':(h<a?'2':'X');
   return (pp[0].trim()===sP&&pp[1].trim()===sF)?'castigat':'pierdut';
  }
  if(tip==='Cornere'){ if(r.c==null)return 'neverificabil'; return pesteSub(pick,r.c) }
  if(tip==='Cartonase'){ if(r.k==null)return 'neverificabil'; return pesteSub(pick,r.k) }
  return 'neverificabil';
 }
 if(tip==='WIN'){
  if(h===a)return 'neverificabil';
  var castig=h>a?sel.home:sel.away;
  return normEch(pick)===normEch(castig)?'castigat':'pierdut';
 }
 if(tip==='TOT')return pesteSub(pick,h+a);
 if(tip==='Q1T'||tip==='H1T'){
  if(!r.p1)return 'neverificabil';
  return pesteSub(pick,r.p1[0]+r.p1[1]);
 }
 if(tip==='Q1W'||tip==='H1W'){
  if(!r.p1||r.p1[0]===r.p1[1])return 'neverificabil';
  var c1=r.p1[0]>r.p1[1]?sel.home:sel.away;
  return normEch(pick)===normEch(c1)?'castigat':'pierdut';
 }
 return 'neverificabil';
}
var castiguriDeAnuntat=[];
function verificaToateBiletele(){
 var schimbat=false;
 bileteleMele.forEach(function(b){
  if(b.stare!=='in asteptare')return;
  b.selectii.forEach(function(s){
   if(s.stare!=='in asteptare')return;
   var nou=verificaSelectie(s);
   if(nou!==s.stare){s.stare=nou;schimbat=true}
  });
  var stari=b.selectii.map(function(s){return s.stare});
  // o singura selectie pierduta => biletul e pierdut, chiar daca restul
  // n-au fost inca jucate (nu mai are rost sa asteptam)
  if(stari.indexOf('pierdut')>=0)b.stare='pierdut';
  else if(stari.every(function(x){return x==='castigat'||x==='neverificabil'}))b.stare='castigat';
  if(b.stare!=='in asteptare')schimbat=true;

  // Selectiile ANULATE (meci fara statistici de cornere, egal la "fara egal"
  // etc.) ies din calcul, ca la casele de pariuri: cota biletului se reface
  // doar din selectiile care chiar au contat.
  var cotaReala=1;
  b.selectii.forEach(function(s){ if(s.stare!=='neverificabil')cotaReala*=(s.cota||1) });
  b.cota_finala=cotaReala;

  // castigul se vireaza O SINGURA data (de-aia "platit") - miza a fost deja
  // retinuta cand ai pus biletul, deci acum primesti miza x cota
  if(b.stare==='castigat'&&b.miza>0&&!b.platit){
   var castig=Math.round(b.miza*(b.cota_finala||b.cota)*100)/100;
   monedeSet(monede()+castig);
   logMoneda('castig',castig,'bilet castigat, cota '+(b.cota_finala||b.cota).toFixed(2));
   b.platit=true;schimbat=true;
   castiguriDeAnuntat.push({miza:b.miza,cota:b.cota,castig:castig});
   anuntaPariu('castigat',b,{titlu:b.titlu||numeBiletAI(b.sursa)||'bilet',castig:castig});
  } else if(b.stare==='castigat'&&!b.platit){
   // fara miza: nu se plateste nimic, dar tot a nimerit-o - se vede pe "Acasa"
   b.platit=true;schimbat=true;
   anuntaPariu('castigat',b,{titlu:b.titlu||numeBiletAI(b.sursa)||'bilet'});
  }
  if(b.stare==='pierdut'&&!b.platit){
   if(b.miza>0)logMoneda('pierdut',0,'bilet pierdut (miza '+b.miza+' retinuta la punere)');
   b.platit=true;schimbat=true;
   anuntaPariu('pierdut',b,{titlu:b.titlu||numeBiletAI(b.sursa)||'bilet'});
  }
 });
 if(schimbat)salveazaBileteleMele();
 if(castiguriDeAnuntat.length){
  var t=castiguriDeAnuntat.reduce(function(s,c){return s+c.castig},0);
  var n=castiguriDeAnuntat.length;
  castiguriDeAnuntat=[];
  setTimeout(function(){
   mesaj('&#127881; Bilet castigat!','<p>Ai castigat <b>'+n+'</b> bilet'+(n>1?'e':'')+'.<br>&#129689; <b style="color:var(--green)">+'+t+'</b> monede in cont.</p>');
  },300);
 }
}
function incarcaRezultate(dupa){
 if(REZULTATE){dupa();return}
 if(rezultateInCurs)return;
 rezultateInCurs=true;
 fetch('pagini/rezultate.json?t='+Date.now())
  .then(function(r){return r.json()})
  .then(function(j){REZULTATE=j;rezultateInCurs=false;verificaToateBiletele();dupa()})
  .catch(function(){rezultateInCurs=false;dupa()});
}

/* ── Deblocarea detaliilor unui meci (costa COST_DETALII monede) ────────── */
// Un meci platit ramane deblocat cat timp mai e afisat in aplicatie (azi si
// maine), adica 2 zile - dupa ce meciul dispare din liste, dispare si
// deblocarea lui, ca sa nu se adune la nesfarsit in memoria telefonului.
var ZILE_DEBLOCARE=2;
function meciuriDeblocate(){
 var d={};
 try{d=JSON.parse(localStorage.getItem(cheieCont('deblocate'))||'{}')}catch(e){return {}}
 var limita=Date.now()-ZILE_DEBLOCARE*86400000, curatat=false;
 Object.keys(d).forEach(function(k){ if(!d[k]||d[k]<limita){delete d[k];curatat=true} });
 if(curatat){try{localStorage.setItem(cheieCont('deblocate'),JSON.stringify(d))}catch(e){}}
 return d;
}
function marcheazaDeblocat(cheie){
 var d=meciuriDeblocate();d[cheie]=Date.now();
 try{localStorage.setItem(cheieCont('deblocate'),JSON.stringify(d))}catch(e){}
}
// mesaje trimise din paginile de sport, ca sa foloseasca ferestrele frumoase
window.addEventListener('message',function(e){
 if(!e.data||e.data.type!=='arata-mesaj')return;
 mesaj(e.data.titlu||'',e.data.corp||'');
});

window.addEventListener('message',function(e){
 if(!e.data||e.data.type!=='cere-detalii')return;
 var sursa=e.source, id=e.data.id;
 var cheie=(e.data.sport||'')+'|'+(e.data.meci||'');
 function raspunde(ok){
  try{sursa.postMessage({type:'raspuns-detalii',id:id,ok:ok},'*')}catch(err){}
 }
 if(meciuriDeblocate()[cheie]){raspunde(true);return}      // deja platit
 var m=monede();
 if(m<COST_DETALII){
  mesaj('Nu ai destule monede',
   '<p>Detaliile unui meci costa <b>'+COST_DETALII+' monede</b>, iar tu ai <b>'+m+'</b>.</p>');
  raspunde(false);return;
 }
 intreaba('Deschizi detaliile?',
  '<p><b>'+esc(e.data.meci)+'</b></p>'+
  '<p class="sub">Costa '+COST_DETALII+' monede (ai '+m.toLocaleString('ro-RO')+').<br>'+
  'Dupa ce platesti, meciul ramane deblocat cat timp e afisat in aplicatie.</p>',
  'Platesc '+COST_DETALII+' &#129689;').then(function(ok){
   if(!ok){raspunde(false);return}
   monedeSet(monede()-COST_DETALII);
   logMoneda('detalii',-COST_DETALII,e.data.meci);
   marcheazaDeblocat(cheie);
   raspunde(true);
  });
});

/* ── Trimiterea unui meci pe chat ─────────────────────────────────────────
   Apesi sageata de pe card si ajungi in chat cu mesajul deja scris; tu alegi
   cui il dai, din coloana din stanga. Nu-l trimitem noi de-a dreptul: altfel
   ar pleca mereu in camera comuna, iar de multe ori vrei sa-l dai unuia
   singur.
   Mesajul e un rand de text obisnuit, cu un semn la inceput (MECI|) dupa care
   il recunoastem si il desenam ca pe un cartonas. Deci nu costa nimic in plus
   la Firebase - e acelasi fel de mesaj ca "salut".                          */
function textMeciPentruChat(d){
 return 'MECI|'+[(d.emoji||''),(d.sport||''),(d.gazda||''),(d.oaspete||''),(d.ora||'')]
   .map(function(x){return String(x).replace(/\|/g,' ')}).join('|');
}
window.addEventListener('message',function(e){
 if(!e.data||e.data.type!=='trimite-meci')return;
 if(!esteLogat()){ ceruteCont('Trimiterea unui meci pe chat'); return }
 var text=textMeciPentruChat(e.data);
 if(CHAT_CAMERA===null)CHAT_CAMERA='toti';
 arataEcran('chat');
 deschideCamera();
 setTimeout(function(){
  var inp=document.getElementById('chat-text');
  if(inp){ inp.value=text; inp.focus() }
  var z=document.getElementById('chat-eroare');
  if(z)z.textContent='Alege cui trimiti din stanga, apoi apasa ➤';
 },250);
});

window.addEventListener('message',function(e){
 if(!e.data||e.data.type!=='ticket-sync')return;
 meuBiletPeSport[e.data.sport]={emoji:e.data.emoji,items:e.data.items||[]};
 actualizeazaFab();
 if(meuPanelOpen)renderMeuPanel();
});

function meniuCont(){
 if(!esteLogat()){ ferestraLogare(); return }
 var im=istoricMonede();
 var nume={miza:'Miza pusa',castig:'Castig bilet',pierdut:'Bilet pierdut',
           primit:'Primite de la administrator',scazut:'Scazute de administrator',
           detalii:'Detalii meci'};
 var corp='<div style="text-align:center;margin-bottom:14px">'+
   '<div style="font-size:26px;font-weight:800;color:var(--gold)">&#129689; '+
   monede().toLocaleString('ro-RO')+'</div>'+
   '<div class="sub">monede disponibile &middot; cont <b>'+esc(utilizator||'')+'</b></div></div>';
 if(!im.length){
  corp+='<div class="sub" style="text-align:center;padding:10px 0">Nicio miscare inca.</div>';
 }else{
  // Lista de miscari sta STRANSA: acum in profil sunt mai multe lucruri
  // (tema, iesirea din cont), iar un sul de 25 de randuri le impingea pe toate
  // afara din ecran. Se deschide daca chiar vrei sa te uiti pe ea.
  corp+='<details class="mrf-istoric"><summary>Pe ce s-au dus monedele '+
        '<span class="sub">('+im.length+' miscari)</span></summary>';
  im.slice(0,25).forEach(function(x){
   var d=new Date(x.d);
   var col=x.s>0?'var(--green)':(x.s<0?'#EF4444':'var(--muted)');
   corp+='<div class="mrf-linie"><span>'+esc(nume[x.t]||x.t)+
     (x.info?' <span class="sub">'+esc(x.info)+'</span>':'')+
     '<br><span class="sub">'+d.toLocaleDateString('ro-RO')+' '+
     d.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})+'</span></span>'+
     '<b style="color:'+col+';white-space:nowrap">'+(x.s>0?'+':'')+(x.s||0)+'</b></div>';
  });
  corp+='</details>';
 }
 arataModal({titlu:'&#129689; Monedele tale',corp:corp,butoane:[
   {text:'Inchide',valoare:false},{text:'&#127912; Tema',valoare:'tema'},
   {text:'&#9635; Butoane',valoare:'stil'}]
   .concat(eAdmin()?[{text:'&#128100; Conturi',valoare:'conturi'}]:[])
   .concat([{text:'Iesi din cont',valoare:'iesi'}])})
  .then(function(v){
    if(v==='iesi')iesiDinCont();
    else if(v==='tema')alegeTema();
    else if(v==='stil')alegeStil();
    else if(v==='conturi')panouConturi();
  });
}

/* ══ CHAT (Cloud Firestore) ═════════════════════════════════════════════════
   O camera comuna, deschisa si celor fara cont, plus discutii intre doi, doar
   pentru cei cu cont.

   Pana acum chatul statea intr-o foaie Google si aplicatia intreba din 12 in
   12 secunde daca a aparut ceva nou. La 100 de oameni cu aplicatia deschisa
   inseamna zeci de mii de cereri pe ora - iar cand Google taie robinetul se
   opresc TOATE deodata: si conturile, si monedele, nu doar chatul.

   Acum mesajele stau in Firestore si nu mai intrebam nimic: tinem o legatura
   deschisa (onSnapshot) prin care serverul le impinge singur cand apar. Se
   numara doar mesajele chiar livrate, deci o zi intreaga cu aplicatia deschisa
   costa cateva zeci de citiri in loc de zeci de mii. Si vin instant, care era
   de fapt motivul mutarii.

   Conturile si monedele au ramas pe Google. Se mutau si ele, dar separat si
   dupa ce se vede ca partea asta merge - mutate toate odata, un singur bug te
   lasa fara nimic.

   Ce se scrie in Firestore:
     mesaje/<id>   {camera, de_la, jos, text, cand, disp}
        id-ul e ora scrierii in milisecunde plus 6 semne la intamplare
        ('1754251234567_a1b2c3'). Fiind in ordinea timpului, putem cere direct
        "doar ce s-a scris in ultimele 24 de ore" fara sa fie nevoie de vreun
        index facut de mana in consola - si nici nu platim citiri pe ce e mai
        vechi. 'jos' e numele cu litere mici si 'disp' numarul telefonului;
        dupa ele se uita regulile din consola cand cineva e blocat.
     blocati/<nume>  {de, cand}

   Ce NU face: notificari nu exista (un site static n-are cum sa sune
   telefonul). Si nu mai exista parola la chat - inainte, Google verifica
   parola ca sa nu scrie cineva sub numele altuia, dar parolele tuturor
   conturilor sunt oricum scrise in pagina asta (vezi CONTURI), deci
   verificarea nu apara nimic; in schimb ea era exact cea care nu te lasa pe
   TINE sa scrii.                                                            */

var CHAT_CAMERA='toti';        // 'toti', numele celuilalt, sau null = lista
var CHAT_MESAJE=[];            // ce se vede acum pe ecran
var MESAJE_TOTI=[];            // camera comuna, tinuta la zi tot timpul
var CHAT_NECITITE=0;
var CHAT_BLOCATI=[];
var ORE_CHAT=24;               // cat traieste un mesaj

/* Id-ul ultimului mesaj vazut din camera comuna, ca sa stim cate sunt noi.
   Inainte era un numar (1, 2, 3...); daca a ramas unul vechi in telefon il
   aruncam, altfel s-ar compara "37" cu "1754..." si cifra de pe buton n-ar
   mai porni niciodata. */
var CHAT_VAZUT='';
try{
  var _v=localStorage.getItem('mrfChatVazut')||'';
  CHAT_VAZUT=(_v.indexOf('_')>0)?_v:'';
}catch(e){}

function chatPrag(){ return String(Date.now()-ORE_CHAT*3600000)+'_' }
function idNou(){ return String(Date.now())+'_'+Math.random().toString(36).slice(2,8) }
function chatEroare(t){
  var z=document.getElementById('chat-eroare');
  if(z)z.textContent=t||'';
}

/* Firebase se incarca separat, ca modul (vezi capul paginii). Pana ajunge -
   sau daca nu ajunge deloc, fiindca esti fara net - aplicatia merge intreaga,
   iar ecranul de chat spune de ce nu merge, in loc sa para stricat. */
var FB_STARE='asteapta';       // 'asteapta' | 'gata' | 'nu'
function chatGata(){ return FB_STARE==='gata'&&!!window.FB }
window.addEventListener('firebase-gata',function(){
  FB_STARE=window.FB?'gata':'nu';
  if(FB_STARE==='gata'){ porneteConturi(); porneteChatViu() }
  if(ecranCurent==='chat')deseneazaChat();
});
setTimeout(function(){
  if(FB_STARE!=='asteapta')return;
  FB_STARE='nu';
  if(!window.FB_EROARE)window.FB_EROARE='nu s-a putut incarca Firebase (esti fara net?)';
  if(ecranCurent==='chat')deseneazaChat();
},15000);

/* Cei fara cont primesc un nume propriu, tinut pe telefonul lor. Nu si-l pot
   alege, ca sa nu se dea cineva drept altcineva; si e stabil, ca sa poata fi
   blocat daca deranjeaza. */
function numeInChat(){
  if(esteLogat())return utilizator;
  var n='';
  try{n=localStorage.getItem('mrfInvitat')||''}catch(e){}
  if(!n){
    n='invitat-'+Math.floor(1000+Math.random()*9000);
    try{localStorage.setItem('mrfInvitat',n)}catch(e){}
  }
  return n;
}

function cameraCurenta(){
  if(CHAT_CAMERA==='toti')return 'toti';
  var a=String(utilizator||'').toLowerCase(), b=String(CHAT_CAMERA).toLowerCase();
  return (a<b)?(a+'|'+b):(b+'|'+a);
}

function suntBlocat(){
  var n=String(numeInChat()).toLowerCase(), d=String(numarTelefon()).toLowerCase();
  return CHAT_BLOCATI.indexOf(n)>=0||CHAT_BLOCATI.indexOf(d)>=0;
}

/* Legatura deschisa cu o camera. Cerem doar ce s-a scris in ultimele 24 de
   ore (de aia e ora in id-ul mesajului), iar dupa aceea serverul ne trimite
   singur fiecare mesaj nou - nu mai intrebam noi. */
function ascultaMesaje(cam,laSchimbare){
  var F=window.FB;
  var q=F.query(F.collection(F.db,'mesaje'),
                F.where('camera','==',cam),
                F.orderBy(F.documentId()),
                F.startAt(chatPrag()));
  return F.onSnapshot(q,function(snap){
    var out=[], vechi=Date.now()-ORE_CHAT*3600000;
    snap.forEach(function(d){
      var m=d.data()||{};
      // daca aplicatia sta deschisa doua zile, mesajele prinse la deschiderea
      // legaturii ar imbatrani sub ochii tai - le taiem la desenare
      if(Number(m.cand||0)&&Number(m.cand)<vechi)return;
      out.push({id:d.id,de_la:String(m.de_la||''),text:String(m.text||''),
                cand:Number(m.cand||0)});
    });
    laSchimbare(out);
  },function(err){
    chatEroare('nu pot citi mesajele: '+((err&&err.message)||err));
  });
}

var SUB_TOTI=null, SUB_PRIVAT=null, SUB_BLOCATI=null, SUB_PRIVAT_TOT=null, PRIVAT_CAM='';
var PRIVAT_NECITITE={};        // cate mesaje necitite ai de la fiecare

/* Pana unde ai citit discutia cu cineva. Tinem un semn separat pe fiecare
   om, ca sa putem arata cifra langa numele lui, nu doar una singura pe tot
   chatul. */
function vazutCu(cine){
  try{ return localStorage.getItem('mrfVazut_'+String(cine).toLowerCase())||'' }catch(e){ return '' }
}
function marcheazaVazutCu(cine,lista){
  if(!lista||!lista.length)return;
  var ultim=lista[lista.length-1].id;
  try{ localStorage.setItem('mrfVazut_'+String(cine).toLowerCase(),ultim) }catch(e){}
  var c=String(cine).toLowerCase();
  if(PRIVAT_NECITITE[c]){ delete PRIVAT_NECITITE[c]; deseneazaBara() }
}
function totalNecitite(){
  var n=CHAT_NECITITE||0;
  Object.keys(PRIVAT_NECITITE).forEach(function(k){ n+=PRIVAT_NECITITE[k]||0 });
  return n;
}

function marcheazaVazut(lista){
  if(!lista.length)return;
  var ultim=lista[lista.length-1].id;
  if(ultim>CHAT_VAZUT){
    CHAT_VAZUT=ultim;
    try{localStorage.setItem('mrfChatVazut',ultim)}catch(e){}
  }
}

/* Se cheama o singura data, cand Firebase e gata. De aici incolo camera comuna
   e ascultata tot timpul, chiar si cand esti in alta parte a aplicatiei: de
   acolo vine cifra rosie de pe butonul de Chat, si tot de acolo se vad
   mesajele pe loc cand intri. */
function porneteChatViu(){
  if(!chatGata()||SUB_TOTI)return;
  var F=window.FB;
  SUB_TOTI=ascultaMesaje('toti',function(lista){
    MESAJE_TOTI=lista;
    if(CHAT_CAMERA==='toti'&&ecranCurent==='chat'){
      CHAT_MESAJE=lista;
      CHAT_NECITITE=0;
      marcheazaVazut(lista);
      deseneazaChat();
      deseneazaBara();
    }else{
      var alMeu=String(numeInChat()).toLowerCase(), n=0;
      lista.forEach(function(m){
        if(m.id>CHAT_VAZUT&&String(m.de_la).toLowerCase()!==alMeu)n++;
      });
      if(n!==CHAT_NECITITE){ CHAT_NECITITE=n; deseneazaBara() }
    }
  });
  /* ── Cine ti-a scris in privat ───────────────────────────────────────────
     O singura legatura, deschisa tot timpul, care asculta mesajele trimise
     CATRE tine (campul "catre"), din orice discutie privata. Asa afli ca
     ti-a scris cineva chiar daca esti pe Fotbal - inainte stiai doar de
     camera comuna, fiindca doar pe aia o ascultam tot timpul.
     Nu se putea altfel: camera se cheama "albert|robert", iar Firestore nu
     stie sa caute "camerele care ma contin pe mine". */
  if(esteLogat()){
   try{
    SUB_PRIVAT_TOT=F.onSnapshot(
     F.query(F.collection(F.db,'mesaje'),
             F.where('catre','==',String(utilizator).toLowerCase()),
             F.orderBy(F.documentId()),
             F.startAt(chatPrag())),
     function(s){
       var pe={}, eu=String(utilizator).toLowerCase();
       s.forEach(function(d){
         var m=d.data()||{};
         var de=String(m.de_la||'').toLowerCase();
         if(!de||de===eu)return;
         if(d.id<=vazutCu(de))return;             // l-ai citit deja
         pe[de]=(pe[de]||0)+1;
       });
       PRIVAT_NECITITE=pe;
       deseneazaBara();
       if(ecranCurent==='chat')deseneazaChat();
     },function(e){ console.log('privat:',e&&e.message) });
   }catch(e){}
  }

  // lista celor blocati: cateva randuri, dar trebuie sa fie la zi peste tot
  SUB_BLOCATI=F.onSnapshot(F.collection(F.db,'blocati'),function(s){
    var l=[];
    s.forEach(function(d){ l.push(String(d.id).toLowerCase()) });
    CHAT_BLOCATI=l;
    if(ecranCurent==='chat')deseneazaChat();
  },function(){});
  curataVechi('toti');
}

/* Deschiderea unei discutii. Camera comuna e deja ascultata, deci apare
   instantaneu; pentru o discutie privata deschidem o legatura in plus, si o
   inchidem cand iesi din ea - altfel s-ar aduna cate una la fiecare intrare. */
function deschideCamera(){
  if(SUB_PRIVAT){ SUB_PRIVAT(); SUB_PRIVAT=null; PRIVAT_CAM='' }
  // nu mai exista "nicaieri": chatul e mereu deschis pe cineva, iar cu cine
  // vorbesti se schimba din randul de sus
  if(CHAT_CAMERA===null)CHAT_CAMERA='toti';
  if(!chatGata()){ CHAT_MESAJE=[]; deseneazaChat(); return }
  if(CHAT_CAMERA==='toti'){
    CHAT_MESAJE=MESAJE_TOTI;
    CHAT_NECITITE=0;
    marcheazaVazut(MESAJE_TOTI);
    deseneazaChat();
    deseneazaBara();
    return;
  }
  CHAT_MESAJE=[];
  deseneazaChat();
  var cam=cameraCurenta();
  PRIVAT_CAM=cam;
  SUB_PRIVAT=ascultaMesaje(cam,function(lista){
    if(PRIVAT_CAM!==cam)return;      // ai schimbat discutia intre timp
    CHAT_MESAJE=lista;
    if(ecranCurent==='chat')deseneazaChat();
  });
  curataVechi(cam);
}

/* Mesajele mai vechi de 24 de ore se sterg. N-avem unde tine un program care
   sa faca asta (planul gratuit n-are asa ceva), deci le sterge aplicatia:
   cine deschide o discutie mai da si cu matura prin ea, pentru toti. Daca
   n-are voie sa stearga, nu e nimic stricat - oricum nu se mai vad, fiindca
   nu le mai cerem. */
function curataVechi(cam){
  if(!chatGata())return;
  var F=window.FB;
  try{
    var q=F.query(F.collection(F.db,'mesaje'),
                  F.where('camera','==',cam),
                  F.orderBy(F.documentId()),
                  F.endBefore(chatPrag()),
                  F.limit(60));
    F.getDocs(q).then(function(s){
      s.forEach(function(d){ F.deleteDoc(d.ref).catch(function(){}) });
    }).catch(function(){});
  }catch(e){}
}

function trimiteMesaj(){
  var inp=document.getElementById('chat-text');
  if(!inp)return;
  var text=(inp.value||'').trim();
  if(!text)return;
  if(text.length>500)text=text.slice(0,500);
  if(!chatGata()){
    chatEroare('chatul nu e pornit: '+(window.FB_EROARE||'se incarca...'));
    return;
  }
  if(suntBlocat()){ chatEroare('nu mai poti scrie in chat'); return }
  var nume=numeInChat();
  inp.value='';
  chatEroare('');
  var F=window.FB;
  /* Nu-l mai punem noi in lista ca sa para trimis: Firestore il arata pe loc,
     inainte sa ajunga la server, si il ia inapoi singur daca scrierea nu
     trece. Asa nu mai raman mesaje fantoma pe ecran. */
  /* "catre" = cui ii scrii, la discutiile intre doi (gol la camera comuna).
     Fara campul asta n-aveam cum sa te anuntam ca ti-a scris cineva in
     privat: camera se cheama "albert|robert", iar Firestore nu stie sa caute
     "camerele care contin numele meu". Cu el, e o singura legatura deschisa
     care asculta tot ce vine spre tine, oricati prieteni ai avea. */
  var cui=(CHAT_CAMERA==='toti')?'':String(CHAT_CAMERA).toLowerCase();
  F.setDoc(F.doc(F.db,'mesaje',idNou()),{
    camera:cameraCurenta(), de_la:nume, jos:String(nume).toLowerCase(),
    catre:cui, text:text, cand:Date.now(), disp:numarTelefon()
  }).catch(function(err){
    chatEroare('nu s-a trimis: '+((err&&err.message)||err));
  });
}

/* Blocarea. Cine e in lista "blocati" nu mai poate scrie nicaieri - si nu e
   doar o ascunzatoare in aplicatie: regulile din consola verifica lista la
   fiecare mesaj, deci scrierea chiar e refuzata de server.
   Cine apasa butonul nu se poate verifica insa la fel: nu avem conturi in
   Firestore (au ramas pe Google), asa ca butonul e ascuns celor care n-au
   voie, dar nu-i oprit din afara aplicatiei. Pentru prieteni e destul. */
function blocheazaPe(cine){
  if(!chatGata()){ mesaj('N-a mers','<p>Chatul nu e pornit.</p>'); return }
  var tinta=String(cine||'').trim().toLowerCase();
  if(!tinta)return;
  if(ADMINI[tinta]){ mesaj('Nu se poate','<p>Un administrator nu se blocheaza.</p>'); return }
  intreaba('Blochezi pe '+esc(cine)+'?',
    '<p>Nu va mai putea scrie nici in camera comuna, nici in privat.</p>'+
    '<p class="sub">Poti sa-l deblochezi oricand, tot de aici.</p>','Blocheaza')
   .then(function(da){
     if(!da)return;
     var F=window.FB;
     F.setDoc(F.doc(F.db,'blocati',tinta),{de:String(utilizator||''),cand:Date.now()})
      .catch(function(err){ mesaj('N-a mers','<p>'+esc((err&&err.message)||err)+'</p>') });
   });
}
function deblocheazaPe(cine){
  if(!chatGata())return;
  var F=window.FB;
  F.deleteDoc(F.doc(F.db,'blocati',String(cine||'').trim().toLowerCase()))
   .catch(function(err){ mesaj('N-a mers','<p>'+esc((err&&err.message)||err)+'</p>') });
}

function deseneazaChat(){
  var el=document.getElementById('ec-chat');
  if(!el)return;
  var logat=esteLogat();

  /* Cu cine vorbesti - un rand de nume, mereu la vedere, deasupra discutiei.
     Inainte, ca sa treci de la unul la altul trebuia sa apesi "Inapoi" si sa
     te intorci la o lista, adica sa iesi din chat ca sa poti intra iar. Acum
     schimbi dintr-o apasare si nu pleci de nicaieri. */
  if(CHAT_CAMERA===null)CHAT_CAMERA='toti';
  var eGrup=(CHAT_CAMERA==='toti');

  /* Numele stau pe verticala, intr-o coloana ingusta in stanga: asa incape
     langa fiecare cifra cu cate mesaje necitite ai de la el, si vezi dintr-o
     privire cine ti-a scris. Pe orizontala nu incapea nimic langa nume. */
  var h2='<div class="chat-zona"><div class="chat-oameni">'+
    '<button class="chat-om'+(eGrup?' activ':'')+'" data-chat="toti" title="Toata lumea">'+
    '<span class="chat-om-ic">\u{1F465}</span><span class="chat-om-nume">Toti</span>'+
    ((!eGrup&&CHAT_NECITITE)?'<span class="chat-pastila">'+CHAT_NECITITE+'</span>':'')+
    '</button>';
  if(logat){
    var altii=Object.keys(conturiActive()).filter(function(u){return u!==utilizator});
    // cine ti-a scris si n-ai citit trece primul
    altii.sort(function(a,b){
      var na=PRIVAT_NECITITE[a]||0, nb=PRIVAT_NECITITE[b]||0;
      if(na!==nb)return nb-na;
      return a.localeCompare(b,'ro');
    });
    altii.forEach(function(u){
      var n=PRIVAT_NECITITE[u]||0;
      h2+='<button class="chat-om'+(CHAT_CAMERA===u?' activ':'')+'" data-chat="'+esc(u)+
          '" title="'+esc(u)+'">'+
          '<span class="av mic">'+esc(u.charAt(0).toUpperCase())+'</span>'+
          '<span class="chat-om-nume">'+esc(u)+'</span>'+
          (n?'<span class="chat-pastila">'+n+'</span>':'')+'</button>';
    });
  }
  h2+='</div><div class="chat-corp">';
  if(!logat){
    h2+='<div class="chat-nota">discutiile intre doi cer cont &middot; '+
        'in camera comuna scrii si fara</div>';
  }else if(Object.keys(conturiActive()).length<2){
    h2+='<div class="chat-nota">cand mai are cineva cont, apare aici si vorbiti doar voi doi</div>';
  }

  /* capul discutiei: doar cand e nevoie de el (blocare), ca sa nu ia un rand
     intreg din ecran degeaba */
  if(!eGrup&&ePoateBloca()){
    h2+='<div class="chat-cap"><b>'+esc(CHAT_CAMERA)+'</b>'+
      (CHAT_BLOCATI.indexOf(String(CHAT_CAMERA).toLowerCase())>=0
        ?'<button class="chip-s" data-deblocheaza="'+esc(CHAT_CAMERA)+'">Deblocheaza</button>'
        :'<button class="chip-s" data-blocheaza="'+esc(CHAT_CAMERA)+'">Blocheaza</button>')+
      '</div>';
  }
  h2+='<div class="chat-nota">mesajele mai vechi de 24 de ore s-au sters</div>';
  // Camera comuna e ascultata tot timpul si tine mesajele in MESAJE_TOTI, dar
  // pana acum le copia in ce se afiseaza DOAR cand sosea unul nou. Daca nu erai
  // pe ecranul de chat cand a sosit, intrai si scria "inca nu a scris nimeni",
  // desi erau acolo - si apareau abia daca ieseai si intrai iar. Le luam direct.
  if(CHAT_CAMERA==='toti'&&typeof MESAJE_TOTI!=='undefined'&&MESAJE_TOTI&&MESAJE_TOTI.length){
    CHAT_MESAJE=MESAJE_TOTI;
    marcheazaVazut(CHAT_MESAJE);
    CHAT_NECITITE=0;
  }
  var alMeu=numeInChat();
  if(!CHAT_MESAJE.length){
    h2+='<div class="gol">'+(chatGata()?'Inca nu a scris nimeni.'
        :(FB_STARE==='asteapta'?'Se leaga la chat...'
          :'Chatul nu se poate deschide.<br><span class="sub">'+
            esc(window.FB_EROARE||'')+'</span>'))+'</div>';
  }
  CHAT_MESAJE.forEach(function(m){
    var eu=(String(m.de_la).toLowerCase()===String(alMeu).toLowerCase());
    var d=new Date(m.cand);
    var ora=isNaN(d.getTime())?'':d.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'});
    /* mesajele care sunt de fapt un meci trimis se deseneaza ca un cartonas,
       nu ca text; apesi pe el si te duce la meci, in sportul lui */
    var corp;
    if(String(m.text).indexOf('MECI|')===0){
      var p=String(m.text).split('|');
      corp='<div class="chat-meci" data-meci-sport="'+esc(p[2]||'')+'" '+
           'data-meci-echipa="'+esc(p[3]||'')+'">'+
           '<div class="chat-meci-sus">'+esc(p[1]||'')+' '+esc(p[2]||'')+
           (p[5]?'<span class="sub"> &middot; '+esc(p[5])+'</span>':'')+'</div>'+
           '<div class="chat-meci-ech">'+esc(p[3]||'')+' <span class="sub">vs</span> '+
           esc(p[4]||'')+'</div>'+
           '<div class="chat-meci-jos">apasa ca sa vezi meciul ›</div>'+
           '<div class="chat-ora">'+ora+'</div></div>';
    } else {
      corp='<div class="chat-bula">'+esc(m.text)+'<div class="chat-ora">'+ora+'</div></div>';
    }
    h2+='<div class="chat-rand'+(eu?' eu':'')+'"><div class="chat-bula-inv">'+
      (!eu&&eGrup?'<div class="chat-cine">'+esc(m.de_la)+
        (ePoateBloca()?'<button class="chat-x" data-blocheaza="'+esc(m.de_la)+'">blocheaza</button>':'')+
        '</div>':'')+corp+'</div></div>';
  });
  var potScrie=(eGrup||logat)&&!suntBlocat();
  if(suntBlocat()){
    h2+='<div class="gol">Nu mai poti scrie in chat.</div>';
  }else if(potScrie){
    h2+='<div class="chat-emoji">'+['😀','😂','😎','😡','😭','👍','👎','🔥','⚽','🏆','💰','🤞','🤝','👏']
        .map(function(e){return '<button class="em" data-emoji="'+e+'">'+e+'</button>'}).join('')+
        '</div>'+
        '<div class="chat-scrie"><input id="chat-text" placeholder="Scrie un mesaj..." '+
        'autocomplete="off" maxlength="500"><button class="chat-trimite" data-trimite="1">➤</button></div>'+
        '<div id="chat-eroare" class="chat-eroare"></div>';
    if(!logat)h2+='<div class="sub" style="text-align:center;padding:4px 0">scrii ca <b>'+
      esc(alMeu)+'</b></div>';
  }else{
    h2+='<div class="gol">Ca sa scrii aici ai nevoie de cont.</div>';
  }
  h2+='</div></div>';                 // inchidem .chat-corp si .chat-zona
  el.innerHTML=h2;
  document.body.classList.add('chat-deschis');
  /* Jos de tot, la ultimul mesaj ─────────────────────────────────────────
     Inainte chemam scrollIntoView pe ultimul rand si te lasa pe la jumatatea
     discutiei. Doua motive: se chema INAINTE ca browserul sa aseze randurile
     (deci se ducea la o pozitie care nu mai era buna o clipa mai tarziu), si
     "block:end" opreste marginea de jos a mesajului la marginea ecranului -
     adica exact sub bara de scris si sub emoji-uri, care stau peste pagina.
     Acum coboram pagina pana la capat, dupa ce s-a asezat totul, si o mai
     facem o data putin mai tarziu pentru cazul in care se incarca ceva
     intre timp (avatare, poze). */
  function laFund(){
    try{ window.scrollTo(0,document.body.scrollHeight) }catch(e){}
  }
  requestAnimationFrame(function(){ laFund(); setTimeout(laFund,120) });
  var inp=document.getElementById('chat-text');
  if(inp)inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter')trimiteMesaj() });
}

/* Aici era ceasul care intreba Google din 12 in 12 secunde daca a aparut ceva
   nou. Nu mai e nevoie de el: legatura cu Firestore sta deschisa si mesajele
   vin singure. A ramas doar chemarea, ca sa porneasca legatura daca Firebase
   a ajuns dupa ce se deschisese aplicatia (porneteChatViu, mai sus, nu face

   conturiActive(), care pe atunci tinea parole, nu obiecte. Ieseau mereu
   false, deci butonul de blocare nu i-a aparut niciodata nimanui, nici tie.
   Adevarul e in ADMINI si MODERATORI. */
function eAdminAcum(){ return eAdmin() }
function ePoateBloca(){
  return esteLogat()&&!!(ADMINI[utilizator]||MODERATORI[utilizator]);
}

/* Cine poate bloca oameni din chat, in afara de tine. Nu-i face admini - pot
   doar sa blocheze si sa deblocheze, nimic altceva. */
function panouModeratori(){
  if(!eAdmin()){ ceruteCont('Moderatorii'); return }
  var lista=Object.keys(conturiActive()).filter(function(u){return u!==utilizator}).sort();
  var corp='<p class="sub">Cei bifati pot bloca pe oricine scrie urat in chat. '+
           'Nu pot face conturi, nu pot da monede - doar atat.</p>';
  if(!lista.length)corp+='<p class="sub">Nu mai are nimeni cont.</p>';
  lista.forEach(function(u){
    var poate=!!MODERATORI[u];
    corp+='<div class="cont-rand"><b>'+esc(u)+'</b>'+
      '<button class="cont-cote-btn '+(poate?'deschis':'inchis')+
      '" data-mod="'+esc(u)+'" data-are="'+(poate?'da':'nu')+'">'+
      (poate?'poate bloca':'nu poate')+'</button></div>';
  });
  arataModal({titlu:'Cine poate bloca',corp:corp,
              butoane:[{text:'Gata',principal:true,valoare:true}]});
  setTimeout(function(){
    document.querySelectorAll('[data-mod]').forEach(function(b){
      b.addEventListener('click',function(){
        var u=b.getAttribute('data-mod');
        var vrea=(b.getAttribute('data-are')==='da')?'nu':'da';
        scrieCont(u,{moderator:(vrea==='da')},function(j){
          if(!j.ok){ mesaj('N-a mers','<p>'+esc(j.err||'eroare')+'</p>'); return }
          b.setAttribute('data-are',vrea);
          b.className='cont-cote-btn '+(vrea==='da'?'deschis':'inchis');
          b.textContent=(vrea==='da')?'poate bloca':'nu poate';
        });
      });
    });
  },60);
}

function normSport(x){
  return String(x||'').toLowerCase()
    .replace(/[\u0103\u00e2]/g,'a').replace(/\u00ee/g,'i')
    .replace(/[\u0219\u015f]/g,'s').replace(/[\u021b\u0163]/g,'t');
}

/* Aprinde panoul de bilete: se vede doar daca si #stage e vizibil, si doar cu
   clasa .active. In plus stingem paginile de sport, ca altfel raman dedesubt. */
function aratePanouBilet(stage,pane){
  if(stage)stage.style.display='block';
  // cu !important, ca sa batem regula "body.mod-invitat #bilet-pane{display:none}"
  // daca a ramas pornita cat se aduce lista de conturi de la Google
  if(pane)pane.style.setProperty('display','block','important');
  try{Object.keys(frames).forEach(function(k){frames[k].classList.remove('active')})}catch(e){}
  if(pane)pane.classList.add('active');
}

function arataEcran(nume){
  // pleci de pe sport => scapam si de cautare, ca sa nu te intorci peste o ora
  // la o lista din care lipsesc meciuri fara sa stii de ce
  if(nume!=='cauta'&&ecranCurent==='cauta'){ try{stergeCautarea()}catch(e){} }
  ecranCurent=nume;
  var stage=document.getElementById('stage');
  var pane=document.getElementById('bilet-pane');
  ['ec-acasa','ec-cauta','ec-chat','ec-admin','ec-fara-cont'].forEach(function(id){
    var e=document.getElementById(id); if(e)e.style.display='none';
  });
  // Panoul de bilete sta INAUNTRUL lui #stage si se aprinde cu clasa .active,
  // nu cu stilul direct - asa e facut de la inceput. Daca ascunzi #stage, se
  // duce si el, oricat i-ai pune display:block.
  if(pane){pane.classList.remove('active');pane.style.removeProperty('display')}
  if(stage)stage.style.display='none';
  if(nume!=='chat')document.body.classList.remove('chat-deschis');
  var capS=document.getElementById('cap-sport');
  if(capS)capS.style.display='none';

  if(nume==='acasa'){ deseneazaAcasa(); document.getElementById('ec-acasa').style.display='block' }
  else if(nume==='cauta'){
    if(sportDeschis===null){ deseneazaCauta(); document.getElementById('ec-cauta').style.display='block' }
    else {
      // suntem intr-un sport: aratam pagina lui, cu un rand sus de unde te poti
      // intoarce la lista de sporturi
      var cap=document.getElementById('cap-sport');
      if(!cap){
        cap=document.createElement('div');
        cap.id='cap-sport';
        stage.parentNode.insertBefore(cap,stage);
      }
      var g=GROUPS[sportDeschis]||{};
      /* Randul de cautare nu mai sta aici. Intri in Fotbal ca sa vezi
         meciurile, nu ca sa cauti - iar bara ocupa un rand din ecran de
         fiecare data, degeaba. Cautarea a ramas unde e locul ei: in
         "Sporturi", si se duce si in pagina sportului cand scrii acolo.
         Singurul caz in care mai apare ceva aici e cand chiar ai o cautare
         pornita: atunci trebuie sa vezi de ce lipsesc meciuri si sa o poti
         opri dintr-o apasare, fara sa te intorci in alt ecran. */
      /* Randul de sus iti spune unde esti: ce sport si ce vedere (meciuri,
         Live sau Favorite). Inainte nu scria nimic si, mai ales dupa ce
         treceai prin cautare sau prin favorite, nu mai stiai pe ce te uiti. */
      var pgAct=(g.pages||[])[curP[sportDeschis]||0]||{};
      // la pagina principala eticheta e chiar numele sportului ("Fotbal"),
      // si ar iesi "Fotbal › Fotbal" - acolo scriem "Meciuri"
      var etPag=(pgAct.label&&normSport(pgAct.label)!==normSport(g.tab||''))
                ?pgAct.label:'Meciuri';
      var undeSunt=DOAR_FAVORITE?'⭐ Favorite':(pgAct.url?'🔴 Live':etPag);
      var qv=(document.getElementById('q-global')||{}).value||'';
      var h='<div class="unde-sunt"><span class="us-sport">'+(g.emoji||'')+' '+
            esc(g.tab||'')+'</span><span class="us-sep">›</span>'+
            '<span class="us-tab">'+esc(undeSunt)+'</span></div>';
      if(qv.trim()){
        h+='<div class="cauta-activa"><span>🔍</span>'+
           '<b>'+esc(qv)+'</b>'+
           '<button class="chip-s" data-sterge-cautare="1">✕ Renunt</button></div>';
      }
      cap.innerHTML=h;
      cap.style.display='flex';
      if(stage)stage.style.display='block';
      var kk=sportDeschis+'_'+(curP[sportDeschis]||0);
      try{ if(frames[kk])frames[kk].classList.add('active') }catch(e){}
    }
  }
  else if(nume==='pariuri'){
    if(!esteLogat()){
      arataFaraCont('Biletul tau cere cont',
        'Aici iti tii selectiile si vezi cum au iesit. Contul il face administratorul.');
    } else {
      if(typeof setTicket==='function')setTicket('alemele');
      aratePanouBilet(stage,pane);
    }
  }
  else if(nume==='bilete'){
    if(curTicket==='alemele'||curTicket==='istoric'){
      if(typeof setTicket==='function')setTicket((BILETE[0]||{}).cheie||'c2');
    } else if(typeof renderBilet==='function')renderBilet();
    if(!esteLogat()){
      arataFaraCont('Biletele zilei cer cont',
        'In fiecare dimineata se fac patru bilete: cota 2, 5, 10 si 20. '+
        'Cel de cota 2 e gratuit, restul se deschid cu monede.');
    } else {
      aratePanouBilet(stage,pane);
    }
  }
  else if(nume==='chat'){ deseneazaChat(); document.getElementById('ec-chat').style.display='block' }
  else if(nume==='admin'){ deseneazaAdmin(); document.getElementById('ec-admin').style.display='block' }

  try{localStorage.setItem('mrfEcran',nume)}catch(e){}
  pasNou(stareaDeAcum());
  try{porneteChatViu()}catch(e){}
  deseneazaBara();
  window.scrollTo(0,0);
}

/* ══ CE S-A INTAMPLAT ════════════════════════════════════════════════════
   Banda de sus (cea cu picks) nu se vede pe telefon - o ascunde o regula din
   CSS, ca sa ramana loc pentru meciuri. Deci lucrurile pe care vrei sa le
   vezi cand deschizi aplicatia stau aici, pe "Acasa": ce bilete de-ale
   noastre au iesit ieri si cine dintre voi a pariat si cu ce rezultat.

   Biletele AI le stim din pagina (ISTORIC, scris la generare). Pariurile
   voastre vin din Firestore, unde fiecare telefon isi scrie singur ce a pus
   si ce a iesit - altfel n-ar avea de unde sa stie unul de altul, biletele
   fiind tinute pe telefonul fiecaruia.                                     */
function numeBiletAI(tip){
  var t=String(tip||'');
  return t.charAt(0)==='c' ? ('cota '+t.slice(1)) : t;
}
function candText(ms){
  var d=new Date(Number(ms)||0);
  if(isNaN(d.getTime())||!ms)return '';
  var min=Math.round((Date.now()-d.getTime())/60000);
  if(min<2)return 'acum';
  if(min<60)return 'acum '+min+' min';
  if(min<1440)return 'acum '+Math.round(min/60)+' h';
  return d.toLocaleDateString('ro-RO',{day:'numeric',month:'short'});
}
/* biletele noastre decise in ultimele doua zile */
function biletaeleAIDecise(){
  var out=[], acum=Date.now();
  (typeof ISTORIC!=='undefined'?ISTORIC:[]).forEach(function(b){
    if(!b||(b.stare!=='castigat'&&b.stare!=='pierdut'))return;
    var z=new Date((b.ziua||'')+'T12:00:00').getTime();
    if(isNaN(z)||acum-z>2.2*86400000)return;
    out.push({cand:z, castigat:(b.stare==='castigat'),
              tip:b.tip, cota:Number(b.cota_totala||0), ziua:b.ziua});
  });
  out.sort(function(a,b){return b.cand-a.cand});
  return out;
}
function randulCuNoutati(){
  var randuri=[];
  biletaeleAIDecise().forEach(function(b){
    // cate zile in urma a fost ziua biletului (ora 12, ca sa nu ne pacaleasca
    // schimbarea de ora sau faptul ca e aproape miezul noptii)
    var zile=Math.round((Date.now()-b.cand)/86400000);
    var cand=(zile<=0?' de azi':(zile===1?' de ieri':''));
    randuri.push({cand:b.cand, html:
      '<div class="nout '+(b.castigat?'bun':'rau')+'">'+
      '<span class="nout-ic">'+(b.castigat?'\u{1F3C6}':'❌')+'</span>'+
      '<div><b>Biletul de '+esc(numeBiletAI(b.tip))+cand+
      (b.castigat?' a iesit':' n-a iesit')+'</b>'+
      '<span class="sub">cota '+b.cota.toFixed(2).replace('.',',')+
      ' &middot; '+esc(b.ziua||'')+'</span></div></div>'});
  });
  (typeof PARIURI_VII!=='undefined'?PARIURI_VII:[]).forEach(function(p){
    var eu=(String(p.nume||'').toLowerCase()===String(utilizator||'').toLowerCase());
    var cine=eu?'Tu':esc(p.nume||'cineva');
    var txt='';
    if(p.fel==='pus'){
      txt='<b>'+cine+(eu?' ai':' a')+' pus '+(p.miza?('<b>'+p.miza+'</b> monede pe '):'')+
          esc(p.titlu||'un bilet')+'</b>'+
          '<span class="sub">cota '+Number(p.cota||0).toFixed(2).replace('.',',')+
          ' &middot; '+candText(p.cand)+'</span>';
    }else if(p.fel==='castigat'){
      txt='<b>'+cine+(eu?' ai':' a')+' castigat '+
          (p.castig?('<b style="color:var(--green)">'+p.castig+'</b> monede'):'un bilet')+'</b>'+
          '<span class="sub">'+esc(p.titlu||'')+' &middot; cota '+
          Number(p.cota||0).toFixed(2).replace('.',',')+' &middot; '+candText(p.cand)+'</span>';
    }else{
      txt='<b>'+cine+(eu?' ai':' a')+' pierdut un bilet</b>'+
          '<span class="sub">'+esc(p.titlu||'')+' &middot; cota '+
          Number(p.cota||0).toFixed(2).replace('.',',')+' &middot; '+candText(p.cand)+'</span>';
    }
    randuri.push({cand:Number(p.cand||0), html:
      '<div class="nout '+(p.fel==='castigat'?'bun':(p.fel==='pierdut'?'rau':''))+'">'+
      '<span class="nout-ic">'+(p.fel==='castigat'?'\u{1F389}':(p.fel==='pierdut'?'\u{1F615}':'\u{1F3AB}'))+
      '</span><div>'+txt+'</div></div>'});
  });
  if(!randuri.length)return '';
  randuri.sort(function(a,b){return b.cand-a.cand});
  return '<div class="et">Ce s-a intamplat</div>'+
         '<div class="nout-lista">'+randuri.slice(0,8).map(function(r){return r.html}).join('')+'</div>';
}

function randSetare(ic,tit,actiune,sub){

    '<div><b>'+tit+'</b>'+(sub?'<span class="sub">'+sub+'</span>':'')+'</div>'+
    '<span class="sag">›</span></div>';
}

function normCauta(x){
  return String(x||'').toLowerCase()
    .replace(/[ăâàá]/g,'a').replace(/[îí]/g,'i')
    .replace(/[șş]/g,'s').replace(/[țţ]/g,'t')
    .replace(/[éè]/g,'e').replace(/[óö]/g,'o')
    .replace(/[üú]/g,'u');
}
function indexSport(nume){
  var n=normSport(nume);
  for(var i=0;i<GROUPS.length;i++){ if(normSport(GROUPS[i].tab)===n)return i }
  return -1;
}
function meciuriGasite(q){
  var t=normCauta(q);
  if(t.length<2)return [];
  var out=[];
  for(var i=0;i<CAUTA.length&&out.length<40;i++){
    var r=CAUTA[i];
    if(normCauta(r[1]).indexOf(t)>=0||normCauta(r[2]).indexOf(t)>=0)out.push(r);
  }
  return out;
}

function deseneazaCauta(){
  var el=document.getElementById('ec-cauta');
  var q=(document.getElementById('q-sport')||{}).value||'';
  var h='<div class="cauta-rand"><span>\u{1F50D}</span>'+
    '<input id="q-sport" placeholder="Cauta echipa, jucator sau sport..." '+
    'autocomplete="off" value="'+esc(q)+'"></div>';

  var gasite=meciuriGasite(q);
  if(gasite.length){
    h+='<div class="et">Meciuri gasite</div><div class="gasit-lista">';
    gasite.forEach(function(r){
      var gi=indexSport(r[0]);
      var g=(gi>=0?GROUPS[gi]:null)||{};
      h+='<div class="gasit" data-gasit="'+gi+'">'+
         '<span class="gasit-sport">'+(g.emoji||'')+' '+esc(r[0])+'</span>'+
         '<span class="gasit-meci">'+esc(r[1])+' <span class="sub">vs</span> '+esc(r[2])+'</span>'+
         '<span class="sag">›</span></div>';
    });
    h+='</div>';
  }else if(normCauta(q).length>=2){
    h+='<div class="gol">Nicio echipa cu numele asta, azi sau maine.<br>'+
       '<span class="sub">Cautarea merge pe meciurile din zilele astea doua.</span></div>';
  }

  h+='<div class="et">Alege sportul</div><div class="chip-lista">';
  GROUPS.forEach(function(g,gi){
    if(!(g.pages||[]).length)return;
    if(q&&!gasite.length&&normSport(g.tab).indexOf(normSport(q))<0)return;
    h+='<button class="chip-s" data-sport="'+gi+'">'+(g.emoji||'')+' '+esc(g.tab)+
       '<u>'+(g.n_meciuri||0)+'</u></button>';
  });
  el.innerHTML=h+'</div>';
}

/* Aduce paginile celorlalte sporturi pe fundal, ca sa fie deja in cache cand
   apesi pe ele. Pornim abia dupa ce s-a asezat Fotbalul, si luam un sport la
   cateva secunde, ca sa nu ia latimea de banda de la ce te uiti acum.
   Pe conexiune cu trafic limitat sau cu "economie de date" pornita nu aducem
   nimic - paginile astea sunt zeci de MB la un loc si n-are rost sa-ti manance
   traficul fara sa ceri. */
var AD_FUNDAL_PORNIT=false;
function aduSporturilePeFundal(){
 if(AD_FUNDAL_PORNIT)return;
 AD_FUNDAL_PORNIT=true;
 var c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
 if(c&&(c.saveData===true||/(^|-)2g$/.test(c.effectiveType||'')))return;
 var deAdus=[],activ=indexFotbal();
 GROUPS.forEach(function(g,gi){
  (g.pages||[]).forEach(function(pg,pi){
   if(gi===activ&&pi===(curP[gi]||0))return;  // asta e deja incarcat
   // tab-ul Live e pagina altcuiva: n-o aducem pe fundal (n-are rost sa
   // descarcam Flashscore de 20 de ori, si oricum se schimba din minut in
   // minut). Fara ocolirea asta s-ar fi cerut "pagini/?v=..." - adica 404.
   if(pg.url)return;
   deAdus.push('pagini/'+pg.file+'?v='+BUILD);
  });
 });
 var i=0;
 (function urmatorul(){
  if(i>=deAdus.length)return;
  var l=document.createElement('link');
  l.rel='prefetch'; l.href=deAdus[i++]; l.as='document';
  document.head.appendChild(l);
  setTimeout(urmatorul,1500);
 })();
}

/* Toate apasarile din ecranele noi trec pe aici. Un singur ascultator, ca sa nu
   trebuiasca legat cate unul de fiecare buton la fiecare redesenare. */
document.addEventListener('click',function(ev){
  var t=ev.target;
  var b=t.closest?t.closest('[data-ecran]'):null;
  if(b){
    var e=b.getAttribute('data-ecran');
    // daca esti deja intr-un sport si apesi iar pe Sporturi, te intorci la lista
    if(e==='cauta'&&sportDeschis!==null&&ecranCurent==='cauta')sportDeschis=null;
    if(e==='chat'){
      // Direct in camera comuna. Lista de discutii se ia din butonul de sus -
      // n-are rost un ecran prin care treci de fiecare data ca sa ajungi unde
      // te duceai oricum.
      CHAT_CAMERA='toti';
      CHAT_NECITITE=0;
      marcheazaVazut(MESAJE_TOTI);
    }
    arataEcran(e);
    return;
  }
  if(t.closest&&t.closest('[data-sterge-cautare]')){
    stergeCautarea();
    arataEcran('cauta');
    return;
  }
  if(t.closest&&t.closest('[data-inapoi-sporturi]')){ sportDeschis=null; arataEcran('cauta'); return }
  var gz=t.closest?t.closest('[data-gasit]'):null;
  if(gz){
    var gi=parseInt(gz.getAttribute('data-gasit'),10);
    if(gi>=0){
      // ducem si textul cautat in pagina sportului, ca sa vezi meciul, nu
      // toata liga - altfel te lasam intr-o lista de 600 de meciuri
      var q=(document.getElementById('q-sport')||{}).value||'';
      var g2=document.getElementById('q-global');
      if(g2)g2.value=q;
      deschideSport(gi);
      // si redesenam ecranul, ca sa apara sus randul "cauti barcelona ✕ Renunt".
      // Fara el ramai cu meciurile filtrate si fara nimic care sa-ti spuna de ce
      // lipsesc restul - exact capcana pe care randul ala o rezolva.
      arataEcran('cauta');
      setTimeout(function(){ try{aplicaCautareGlobala()}catch(x){} },700);
    }
    return;
  }
  var sp=t.closest?t.closest('[data-sport]'):null;
  if(sp){
    // alegi un sport din lista => cautarea de dinainte nu mai are ce cauta
    stergeCautarea();
    deschideSport(parseInt(sp.getAttribute('data-sport'),10));
    return;
  }

  var ch=t.closest?t.closest('[data-chat]'):null;
  if(ch){
    CHAT_CAMERA=ch.getAttribute('data-chat');
    CHAT_MESAJE=[];
    pasNou(stareaDeAcum());
    deschideCamera();
    return;
  }
  var cm=t.closest?t.closest('[data-meci-sport]'):null;
  if(cm){
    // meci trimis pe chat: te duce in sportul lui, cu echipa cautata
    var gi=indexSport(cm.getAttribute('data-meci-sport'));
    if(gi>=0){
      var qg=document.getElementById('q-global');
      if(qg)qg.value=cm.getAttribute('data-meci-echipa')||'';
      deschideSport(gi);
      arataEcran('cauta');
      setTimeout(function(){ try{aplicaCautareGlobala()}catch(x){} },700);
    } else {
      mesaj('Sportul nu mai e in aplicatie','<p>Meciul a fost trimis dintr-un sport care '+
        'intre timp a fost scos sau pus pe pauza.</p>');
    }
    return;
  }
  if(t.closest&&t.closest('[data-trimite]')){ trimiteMesaj(); return }
  var em=t.closest?t.closest('[data-emoji]'):null;
  if(em){
    var inp=document.getElementById('chat-text');
    if(inp){ inp.value=(inp.value||'')+em.getAttribute('data-emoji'); inp.focus() }
    return;
  }
  var bl=t.closest?t.closest('[data-blocheaza]'):null;
  if(bl){ blocheazaPe(bl.getAttribute('data-blocheaza')); return }
  var db=t.closest?t.closest('[data-deblocheaza]'):null;
  if(db){ deblocheazaPe(db.getAttribute('data-deblocheaza')); return }
  if(t.closest&&t.closest('[data-logare]')){ ferestraLogare(); return }

  var ac=t.closest?t.closest('[data-actiune]'):null;
  if(ac){
    var a=ac.getAttribute('data-actiune');
    if(a==='tema-din-acasa'&&typeof alegeTema==='function')alegeTema();
    else if(a==='parola-din-acasa'&&typeof schimbaParola==='function')schimbaParola();
    else if(a==='monede-din-acasa'&&typeof meniuCont==='function')meniuCont();
    else if(a==='iesire-din-acasa'&&typeof iesiDinCont==='function')iesiDinCont();
    else if(a==='panou-conturi'&&typeof panouConturi==='function')panouConturi();
    else if(a==='cote-toti'&&typeof panouConturi==='function')panouConturi();
    else if(a==='moderatori'&&typeof panouModeratori==='function')panouModeratori();
    else if(a==='stil-din-acasa'&&typeof alegeStil==='function')alegeStil();
    return;
  }
},false);

var IST_SARI=false;
function pasNou(stare){
  if(IST_SARI)return;
  try{history.pushState(stare,'',location.href)}catch(e){}
}
function stareaDeAcum(){
  return {ecran:ecranCurent, sport:sportDeschis, camera:CHAT_CAMERA};
}
window.addEventListener('popstate',function(ev){
  var st=ev.state;
  IST_SARI=true;
  try{
    if(!st){
      // s-a terminat istoricul nostru: daca nu esti pe ecranul de pornire, te
      // ducem acolo si mai adaugam un pas, ca sa nu iasa din aplicatie
      if(ecranCurent!=='cauta'||sportDeschis!==null||CHAT_CAMERA!==null){
        CHAT_CAMERA=null; sportDeschis=indexFotbal();
        showGroup(sportDeschis); arataEcran('cauta');
        try{history.pushState(stareaDeAcum(),'',location.href)}catch(e){}
      }
    } else {
      CHAT_CAMERA=(st.camera===undefined)?null:st.camera;
      sportDeschis=(st.sport===undefined)?null:st.sport;
      if(sportDeschis!==null&&st.ecran==='cauta')showGroup(sportDeschis);
      arataEcran(st.ecran||'cauta');
      if(st.ecran==='chat')deschideCamera();
    }
  }catch(e){}
  IST_SARI=false;
});
