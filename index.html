<!-- ══ Ca sa se puna pe ecranul telefonului, ca o aplicatie ═════════════════
     Pe iPhone nu se poate instala un fisier, ca APK-ul pe Android - Apple nu
     lasa. Dar Safari stie sa puna un site pe ecranul de start si sa-l
     deschida pe tot ecranul, fara bara de browser: Share -> "Add to Home
     Screen". Etichetele de mai jos sunt ce citeste Safari ca sa faca asta
     cum trebuie - altfel iese o iconita urata, taiata dintr-o poza a paginii,
     si aplicatia se deschide tot in browser.
     Pe Android nu strica nimic: aplicatia din APK e tot pagina asta intr-un
     WebView, iar el ignora etichetele. In Chrome doar adauga optiunea de a o
     pune si acolo pe ecran.
     Ce NU punem: service worker. Ala ar tine pagina in memorie si ai risca sa
     ramai cu o versiune veche dupa ce urcam - exact ce nu vrem la o aplicatie
     care se schimba zilnic.                                                -->

.h-sub{font-size:9px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
@keyframes mrfTickerScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#mrf-ticker:hover #mrf-ticker-track{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){#mrf-ticker-track{animation:none!important}}
@media(max-width:680px){#mrf-ticker{display:none}}
/* Cautarea globala - stilata AICI, nu inline pe element: un stil inline are
   prioritate mai mare si impiedica regula din @media sa o treaca pe rand
   propriu pe ecran mic (patit: ramanea strivita la 129px langa logo). */
/* ── profilul din dreapta sus: nume + monede ── */
/* "margin-left:auto" il impinge in coltul din dreapta al randului din header;
   altfel ramanea lipit de cautare, singur in mijlocul randului, si arata gol */
#profil-cont{flex-shrink:0;margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;
 background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:12px;
 padding:6px 12px;cursor:pointer;line-height:1.25}
#profil-cont:hover{border-color:var(--gold)}
#nume-cont{font-size:12px;font-weight:800}

/* ── Butoane "sticla": mat, translucid, cu o dunga de lumina sus ──────────
   Culorile nu mai sunt scrise de mana, ci luate din tema (--fata, --contur,
   --lumina). Asa acelasi stil merge si pe o tema inchisa, si pe una deschisa:
   la tema de zi "fata" e o umbra usoara, nu un alb care ar disparea pe alb. */
.tabs .tab,.tab{background:var(--fata,rgba(255,255,255,.05));
 border:1px solid var(--contur,rgba(255,255,255,.10));
 border-radius:12px;transition:background .18s,border-color .18s,box-shadow .18s}
.tabs .tab.active,.tab.active,.tab.on{
 background:linear-gradient(180deg,var(--fata2,rgba(255,255,255,.19)),var(--fata,rgba(255,255,255,.05)));
 border-color:var(--contur,rgba(255,255,255,.32));color:var(--text);
 box-shadow:0 5px 18px rgba(0,0,0,.35),inset 0 1px 0 var(--lumina,rgba(255,255,255,.45));
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.piata-btn,.pc,.btn-det,.act-btn,.st-tab,.d-tab,.btn-cp{
 background:linear-gradient(180deg,var(--fata,rgba(255,255,255,.09)),transparent);
 border:1px solid var(--contur,rgba(255,255,255,.12));border-radius:13px;
 box-shadow:inset 0 1px 0 var(--lumina,rgba(255,255,255,.22))}
.piata-btn.picked,.pc.picked{
 background:linear-gradient(180deg,rgba(196,30,58,.55),rgba(196,30,58,.22));
 border-color:rgba(255,255,255,.35);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 14px rgba(196,30,58,.35)}
.piata-btn.value-bet{border-color:rgba(228,179,99,.55);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 16px rgba(228,179,99,.22)}
.st-tab.activ,.d-tab.activ{
 background:linear-gradient(180deg,rgba(228,179,99,.95),rgba(190,140,60,.95));
 border-color:rgba(255,255,255,.4);color:#1a0008;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 14px rgba(0,0,0,.4)}
.act-btn{border-radius:15px}
/* Textul care sta PESTE culoarea de accent. Pana acum era scris alb peste tot,
   ceea ce merge la o aplicatie visinie - dar la tema neagra accentul e chiar
   alb, deci iesea alb pe alb si nu se mai citea nimic. Acum fiecare tema spune
   ea cu ce culoare se scrie peste accentul ei. */
.tab.active .tcnt{color:var(--pe-accent,#fff)}
.tl.ini{color:var(--pe-accent,#fff)}
.piata-btn.picked,.pc.picked{color:var(--text)}

/* butoanele mari din pagina principala, in acelasi stil de sticla */
#meu-fab{border-radius:50px;border:1px solid rgba(255,255,255,.2);
 background:linear-gradient(180deg,rgba(196,30,58,.95),rgba(92,0,23,.95));
 box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4);
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mrf-mb{border-radius:12px;border:1px solid rgba(255,255,255,.12);
 background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.mrf-mb.principal{border-color:rgba(255,255,255,.25);
 background:linear-gradient(180deg,rgba(196,30,58,.92),rgba(120,12,32,.92));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px rgba(0,0,0,.45)}
#buton-logare{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
 border-color:rgba(255,255,255,.2);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
/* ── Fara cont: ascundem ce tine de pariuri ──────────────────────────────
   Procentele, statisticile, detaliile si evaluarea raman la vedere. */
body.mod-invitat .bilettab,
body.mod-invitat #meu-fab,
body.mod-invitat #mrf-ticker,
body.mod-invitat .br-cota.estimata{opacity:.72;border-bottom:1px dotted currentColor}
.nota-estimat{font-size:11px;line-height:1.55;color:var(--muted);background:var(--card2);
  border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:8px 11px;margin:0 0 10px}
#bilet-pane{display:none !important}
.mrf-istoric>summary{cursor:pointer;list-style:none;font-size:12px;font-weight:700;
 padding:8px 10px;background:var(--card2);border-radius:9px;margin-bottom:6px}
.mrf-istoric>summary::-webkit-details-marker{display:none}
.mrf-istoric>summary:before{content:"\25B8 ";color:var(--muted)}
.mrf-istoric[open]>summary:before{content:"\25BE "}
.tema-lista{display:flex;flex-direction:column;gap:7px}
.cont-rand{display:flex;align-items:center;justify-content:space-between;gap:8px;
 padding:8px 11px;border-radius:10px;background:var(--card2);font-size:13px}
.cont-monede{color:var(--gold);font-size:12px}
.cont-rand{align-items:flex-start}
.meu-sterge{background:none;border:1px solid var(--border);color:#EF4444;
 border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer;font-family:inherit}
.bilet-sterge{background:none;border:1px solid var(--border);color:#EF4444;
 border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer;margin-left:8px;
 font-family:inherit}
.avertisment{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);
 border-radius:10px;padding:9px 11px;font-size:12px;margin-bottom:10px}
.cote-toate{display:flex;gap:6px;margin-bottom:10px}
.cote-toate .act-btn{flex:1;font-size:11px;padding:8px 6px}
.cote-stare{margin:2px 0 8px;font-size:13px}
.cote-da{color:var(--green)} .cote-nu{color:#EF4444} .cote-partial{color:#F59E0B}
.cont-cote-btn.deschis{border-color:rgba(34,197,94,.5);color:var(--green)}
.cont-cote-btn.inchis{border-color:rgba(239,68,68,.5);color:#EF4444}
.cont-cote-btn{background:none;border:1px solid var(--border);color:var(--text);
 border-radius:8px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;
 font-family:inherit;white-space:nowrap}
.cont-actiuni{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cont-monede-btn{background:none;border:1px solid var(--border);color:var(--gold);
 border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;
 font-family:inherit;white-space:nowrap}
.cont-sterge{background:none;border:1px solid var(--border);color:#EF4444;
 border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;
 font-family:inherit}
.tema-op{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;
 border-radius:11px;border:1px solid var(--border);background:var(--card2);
 color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:left}
.tema-op.aleasa{border-color:var(--gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.tema-mostre{display:flex;gap:3px}
.tema-mostre i{width:14px;height:14px;border-radius:4px;border:1px solid rgba(255,255,255,.18)}
#buton-logare{font-size:11.5px;font-weight:800;color:var(--text);
 border:1px solid var(--border);border-radius:999px;padding:5px 11px;white-space:nowrap}
.mrf-inp{width:100%;box-sizing:border-box;margin:0 0 8px;padding:10px 12px;border-radius:9px;
 border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:14px;
 font-family:inherit}
#profil-cont .moneda{font-size:11.5px;color:var(--gold);white-space:nowrap}
/* ── ferestre proprii (in locul celor native ale browserului) ── */
#mrf-modal{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:18px}
.mrf-modal-fundal{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px)}
.mrf-modal-cutie{position:relative;width:min(400px,92vw);max-height:82vh;overflow:auto;
 background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;
 box-shadow:0 18px 50px rgba(0,0,0,.55)}
.mrf-modal-titlu{font-size:15px;font-weight:800;margin-bottom:10px}
.mrf-modal-corp{font-size:13px;line-height:1.55;color:var(--text)}
.mrf-modal-corp .sub{color:var(--muted);font-size:11.5px}
.mrf-modal-butoane{display:flex;gap:8px;margin-top:18px}
.mrf-mb{flex:1;padding:11px;border-radius:9px;border:1px solid var(--border);cursor:pointer;
 background:var(--card2);color:var(--text);font-size:13px;font-weight:700;font-family:inherit}
.mrf-mb:hover{border-color:var(--gold)}
.mrf-mb.principal{background:linear-gradient(90deg,#C41E3A,#5C0017);border-color:transparent;color:#fff}
.mrf-linie{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
 border-top:1px solid rgba(255,255,255,.07);font-size:12px}
.mrf-linie:first-child{border-top:none}
/* ── ecranul de logare ── */
#ecran-logare{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;
 align-items:center;justify-content:center}
/* cat timp nu esti intrat in cont, nu se vede nimic din aplicatie - nici
   macar o clipa, cat se deseneaza ecranul de logare peste */
body.inainte-de-logare header,body.inainte-de-logare #subtabs,
body.inainte-de-logare #stage,body.inainte-de-logare #ecrane,
body.inainte-de-logare #bara-jos,body.inainte-de-logare #cap-sport{display:none !important}
.login-box{width:min(320px,88vw);text-align:center;padding:26px 22px;background:var(--card);
 border:1px solid var(--border);border-radius:16px}
.login-logo{font-family:'Pinyon Script',serif;font-size:52px;line-height:1}
.login-sub{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;color:#C79AA8;margin-bottom:20px}
.login-box input{width:100%;box-sizing:border-box;margin-bottom:10px;padding:11px 13px;border-radius:9px;
 border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px;font-family:inherit}
.login-box input:focus{outline:none;border-color:var(--gold)}
.login-box button{width:100%;padding:12px;border:none;border-radius:9px;cursor:pointer;
 background:linear-gradient(90deg,#C41E3A,#5C0017);color:#fff;font-size:13.5px;font-weight:700;font-family:inherit}
.login-err{color:#EF4444;font-size:11.5px;margin-top:9px;min-height:14px}
/* Sta LANGA logo, cu latime potrivita - nu intinsa pe tot randul: fiind doar
   un camp de text, intinsa lasa mult gol si arata urat. */
/* ── bara de jos si ecranele ei ── */
body{padding-bottom:78px}
#bara-jos{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:var(--card2);border-top:1px solid var(--border);
  padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.nav-b{flex:1 1 0;min-width:0;background:none;border:0;color:var(--muted);cursor:pointer;
  padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;
  border-radius:10px;position:relative;font-family:inherit}
.nav-b i{font-style:normal;font-size:19px;line-height:1}
.nav-b b{font-size:9.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%}
.nav-b.activ{color:var(--text);background:linear-gradient(180deg,rgba(196,30,58,.20),rgba(196,30,58,0))}
.nav-pastila{position:absolute;top:2px;left:56%;background:var(--red);color:var(--pe-accent);font-size:8.5px;
  font-weight:800;border-radius:999px;padding:1px 5px;line-height:1.4}
.nav-pastila.statica{position:static;margin-left:auto}
.ecran-nou{display:none;max-width:820px;margin:0 auto;padding:4px 12px 10px}
.cart{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:13px 14px;margin-bottom:10px}
.profil-rand{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7A1226);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:0 0 auto}
.av.mic{width:34px;height:34px;font-size:13px}
.nm{font-weight:800;font-size:16px}
.mon{margin-left:auto;text-align:right}
.mon b{display:block;font-size:19px;color:var(--gold);font-variant-numeric:tabular-nums}
.mon span{font-size:9.5px;color:var(--muted)}
.grid-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.mini{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:11px 12px}
.mini b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.mini span{font-size:10px;color:var(--muted)}
.et{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;
  font-weight:700;margin:16px 0 8px}
.rand-s{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--rs);padding:11px 12px;margin-bottom:7px;cursor:pointer}
.rand-s:hover{border-color:var(--red)}
.rand-s .ic{font-size:18px;flex:0 0 auto}
.rand-s b{font-size:12.5px;display:block}
.rand-s .sub{font-size:10.5px;display:block}
.rand-s .sag{margin-left:auto;color:var(--muted)}
.cauta-rand{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);
  border-radius:999px;padding:11px 15px;margin-bottom:4px}
.cauta-rand input{flex:1;background:none;border:0;color:var(--text);font-size:14px;outline:none;min-width:0}
.chip-lista{display:flex;flex-wrap:wrap;gap:7px}
.chip-s{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 12px;
  font-size:12px;cursor:pointer;color:var(--text);font-weight:600;font-family:inherit}
.chip-s:hover{border-color:var(--red)}
.chip-s u{text-decoration:none;color:var(--muted);font-size:10.5px;margin-left:5px;
  font-variant-numeric:tabular-nums}
.gol{text-align:center;color:var(--muted);font-size:12.5px;padding:28px 16px;line-height:1.7}
/* ── chat ── */
/* Antetul ocupa un sfert de ecran pe telefon: logo mare, sublinia, banda cu
   picks. Pe ecrane mici il strangem - logo mai mic, banda mai joasa - ca sa
   ramana loc pentru meciuri, care sunt motivul pentru care intri. */
@media (max-width:640px){
  header{padding-top:6px}
  #mrf-brand .mrf-logo-row span:first-child{font-size:30px !important}
  #mrf-brand .mrf-logo-sub{font-size:8px !important;margin-left:9px !important}
  #mrf-contor{font-size:7px !important}
  #mrf-ticker{padding:3px 0 5px !important}
  .ecran-nou{padding-top:0}
}
#cap-sport{display:none;flex-direction:column;gap:6px;max-width:820px;margin:0 auto 4px;padding:0 12px}
#cap-sport b{font-size:14px}
#cap-sport .chip-s{padding:5px 10px;font-size:11.5px}
#cap-sport .cauta-rand{padding:7px 13px}
#cap-sport .cauta-rand input{font-size:13px}
#cap-sport b{font-size:15px}
.chat-cap{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.chat-cap b{font-size:14px}
.chat-nota{font-size:10.5px;color:var(--muted);text-align:center;margin:8px 0 12px}
.chat-rand{display:flex;justify-content:flex-start;margin-bottom:8px}
.chat-rand.eu{justify-content:flex-end}
.chat-bula-inv{max-width:80%}
.chat-cine{font-size:10px;color:var(--muted);margin:0 0 2px 11px;font-weight:700;
  display:flex;align-items:center;gap:6px}
.chat-x{background:none;border:0;color:var(--muted);font-size:9px;cursor:pointer;
  text-decoration:underline;padding:0;font-family:inherit}
.chat-bula{padding:9px 12px;border-radius:14px;font-size:12.5px;line-height:1.5;
  background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;
  word-break:break-word}
/* Mesajele TALE: fundal pe culoarea temei. Culoarea scrisului TREBUIE sa fie
   --pe-accent (culoarea gandita pentru text pus peste accent), nu --text.
   Bug patit: la tema "Negru total" accentul e ALB si textul e tot ALB, deci
   mesajele tale erau alb pe alb - le scriai si nu le mai vedeai. */
.chat-rand.eu .chat-bula{background:var(--red);border-color:var(--red);
  color:var(--pe-accent);
  border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.chat-ora{font-size:9px;opacity:.6;margin-top:3px;text-align:right}
.chat-emoji{position:fixed;left:12px;right:12px;bottom:calc(122px + env(safe-area-inset-bottom));
  z-index:55;display:flex;gap:4px;overflow-x:auto;max-width:796px;margin:0 auto;padding:4px 0}
.chat-emoji .em{background:var(--card);border:1px solid var(--border);border-radius:9px;
  font-size:17px;line-height:1;padding:5px 7px;cursor:pointer;flex:0 0 auto}
.chat-scrie{display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--border);border-radius:999px;padding:8px 8px 8px 15px;
  position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));
  z-index:55;max-width:796px;margin:0 auto;box-shadow:0 6px 20px rgba(0,0,0,.45)}
/* loc sub ultimul mesaj, ca sa nu ramana ascuns sub bara de scris */
/* Loc sub ultimul mesaj. Erau 118px si nu ajungeau: bara de scris sta la 72px
   de jos, iar randul de emoji-uri la 122px si mai are si el vreo 34px inaltime
   - adica ultimul mesaj ramanea ascuns sub emoji-uri cand ajungeai jos de tot.
   Acum lasam loc pana peste randul de emoji-uri, plus o palma. */
body.chat-deschis #ec-chat{padding-bottom:176px}
/* Oamenii stau intr-o coloana ingusta in stanga, nu pe orizontala: asa incape
   langa fiecare cifra cu mesajele necitite de la el. */
/* coloana cu oamenii sta in DREAPTA (row-reverse), ca sa nu-ti stea in drum
   cand citesti mesajele - alea incep de la marginea din stanga */
.chat-zona{display:flex;flex-direction:row-reverse;gap:8px;align-items:flex-start}
.chat-oameni{flex:0 0 62px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:4px;max-height:calc(100vh - 210px);overflow-y:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chat-oameni::-webkit-scrollbar{display:none}
.chat-corp{flex:1;min-width:0}
.chat-om{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:var(--card);border:1px solid var(--border);border-radius:13px;padding:7px 3px;
  color:var(--text);font-size:9.5px;font-weight:700;font-family:inherit;cursor:pointer;
  position:relative;width:100%}
.chat-om.activ{background:var(--red);border-color:var(--red);color:var(--pe-accent)}
.chat-om .av{width:26px;height:26px;font-size:11px}
.chat-om.activ .av{background:rgba(255,255,255,.25)}
.chat-om-ic{font-size:17px;line-height:26px}
.chat-om-nume{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-pastila{position:absolute;top:-4px;right:-3px;background:#EF4444;color:#fff;
  border-radius:999px;font-size:9.5px;min-width:16px;padding:1px 4px;text-align:center;
  box-shadow:0 0 0 2px var(--bg)}
/* bara de scris se opreste inainte de coloana cu oameni (care e in dreapta) */
body.chat-deschis .chat-scrie,body.chat-deschis .chat-emoji{right:82px}
/* un meci trimis pe chat */
.chat-meci{background:var(--card2);border:1px solid var(--red);border-radius:14px;
  padding:9px 12px;cursor:pointer;min-width:180px}
.chat-meci-sus{font-size:10.5px;color:var(--muted);margin-bottom:2px}
.chat-meci-ech{font-size:12.5px;font-weight:700;line-height:1.35}
.chat-meci-jos{font-size:10px;color:var(--red);margin-top:4px}
.chat-scrie input{flex:1;background:none;border:0;color:var(--text);font-size:13.5px;
  outline:none;min-width:0;font-family:inherit}

  position:fixed;left:0;right:0;bottom:calc(120px + env(safe-area-inset-bottom));z-index:55}
/* meciurile gasite dupa numele echipei, in ecranul Sporturi */
.gasit-lista{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.gasit{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--border);border-radius:10px;padding:9px 12px;cursor:pointer}
.gasit:hover{border-color:var(--red)}
.gasit-sport{font-size:11px;color:var(--muted);flex:0 0 auto;max-width:34%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gasit-meci{font-size:12.5px;font-weight:700;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.gasit-meci .sub{font-weight:400;font-size:10.5px}

/* "Ce s-a intamplat" de pe Acasa */
.nout-lista{display:flex;flex-direction:column;gap:7px;margin-bottom:6px}
.nout{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--border);border-left-width:3px;border-radius:10px;padding:9px 12px}
.nout.bun{border-left-color:var(--green)}
.nout.rau{border-left-color:#EF4444}
.nout-ic{font-size:17px;flex:0 0 auto}
.nout b{font-size:12.5px;display:block;font-weight:700}
.nout .sub{font-size:10.5px;display:block;margin-top:1px}

/* randul de sus din sport: unde esti (sport › vedere) */
.unde-sunt{display:flex;align-items:center;gap:6px;width:100%;font-size:12px;
  padding:2px 0 1px}
.us-sport{font-weight:800}
.us-sep{color:var(--muted)}
.us-tab{color:var(--red);font-weight:700}
/* randul care apare in sport DOAR cand ai o cautare pornita */
.cauta-activa{display:flex;align-items:center;gap:8px;width:100%;font-size:12px}
.cauta-activa b{color:var(--red)}
.cauta-activa .sub{font-size:10.5px}
.cauta-activa .chip-s{margin-left:auto}
#cauta-global{flex:0 1 260px;min-width:0;display:flex;align-items:center;gap:8px;
 background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:20px;padding:8px 14px}
#q-global{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:inherit}
@media(max-width:480px){
 /* Logo-ul pe doua randuri (MrF deasupra, subtitlul dedesubt) ca sa ramana loc
    pe acelasi rand pentru cautare - altfel logo-ul pe orizontala ocupa aproape
    toata latimea telefonului si cautarea ar fi impinsa pe rand propriu,
    lasand gol langa logo. */
 .mrf-logo-row{flex-direction:column;align-items:flex-start!important;gap:0}
 .mrf-logo-sub{margin-left:2px!important}
 #q-global{font-size:12px}
}
/* Pe telefon randul din header nu incape intreg, iar profilul ajungea singur
   pe un rand al lui, lipit in dreapta, cu mult gol in jur. Il urcam langa logo
   (acolo e loc liber) si lasam cautarea sa ia tot randul de dedesubt.

   sus, altfel sunt suprascrise (aceeasi specificitate, castiga ultima). */

.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit}
.tab.active{color:var(--text);border-bottom-color:var(--gold)}
.tab-empty{opacity:.45;font-style:italic}
.tab.bilettab.active{border-bottom-color:var(--red)}
#subtabs{display:none;background:var(--card2);border-bottom:1px solid var(--border);padding:6px 10px;gap:6px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#subtabs::-webkit-scrollbar{display:none}
#subtabs.on{display:flex}
.stab{background:var(--card);border:1px solid var(--border);border-radius:99px;color:var(--muted);font-size:11px;font-weight:700;padding:5px 12px;cursor:pointer;white-space:nowrap;font-family:inherit}
.stab.active{background:linear-gradient(90deg,var(--gold),#5C0017);color:#FFFFFF;border-color:transparent}
#stage{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg);display:none}
iframe.active{display:block}
/* indicatorul afisat cat timp se descarca pagina unui sport */

 background:var(--bg);z-index:5}
.inc-box{text-align:center;padding:20px}
.inc-spin{width:34px;height:34px;margin:0 auto 14px;border:3px solid rgba(196,30,58,.25);
 border-top-color:#C41E3A;border-radius:50%;animation:inc-rot .8s linear infinite}
@keyframes inc-rot{to{transform:rotate(360deg)}}
.inc-txt{font-size:13.5px;font-weight:700}
.inc-sub{font-size:11px;color:var(--muted);margin-top:5px}
#bilet-pane{position:absolute;inset:0;overflow:auto;display:none;padding:14px}
#bilet-pane.active{display:block}
.gold-box{max-width:640px;margin:0 auto 14px;background:linear-gradient(135deg,rgba(196,30,58,.22),rgba(196,30,58,.10));border:1px solid rgba(196,30,58,.4);border-radius:14px;padding:14px 16px}
.gold-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.gold-sub{font-size:10px;color:var(--muted);margin:4px 0 2px}
.bilet-row{max-width:640px;margin:0 auto 8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.br-teams{font-weight:700;font-size:12.5px}
.mlink{color:inherit;text-decoration:none;border-bottom:1px dashed var(--gold)}
.mlink:hover{color:var(--gold)}
.br-sub{font-size:10px;color:var(--muted);margin-top:2px}
.br-pick{color:var(--yellow);font-weight:700}
.br-right{text-align:right;flex-shrink:0}
.br-prob{font-size:12px;font-weight:700}
.br-cota{font-size:12px;color:var(--yellow);font-weight:700}
.tot-box{max-width:640px;margin:10px auto 0;text-align:center;font-size:15px;font-weight:800;padding:10px;border-radius:10px;background:var(--card2);border:1px solid var(--border)}
.empty{max-width:640px;margin:20px auto;text-align:center;color:var(--muted);font-size:12px}
.bilet-blocat{max-width:640px;margin:0 auto;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px 18px}
.bb-lacat{font-size:34px;line-height:1;margin-bottom:10px;opacity:.75}

     nu-l asteapta: pana ajunge (sau daca nu ajunge deloc, ca esti fara net)
     meciurile, procentele si statisticile se vad la fel.

     Firestore e pornit cu memorie pe telefon (persistentLocalCache): ce a
     apucat sa vada o data ramane si fara net, deci nu te trezesti dat afara
     din cont in metrou. Cu "multiple tabs" ca sa nu se certe doua ferestre
     deschise deodata pe aceeasi memorie.

     Punem in window.FB doar ce ne trebuie, ca sa poata fi folosit din
     scriptul obisnuit de mai jos (care nu e modul).                       -->
<script type="module">

  if(CFG&&CFG.projectId){
    var app=initializeApp(CFG);
    var db=initializeFirestore(app,{localCache:persistentLocalCache(
             {tabManager:persistentMultipleTabManager()})});
    var auth=getAuth(app);
    setPersistence(auth,browserLocalPersistence).catch(function(){});
    /* Contul nou il face o A DOUA legatura cu Firebase, nu asta. Motivul e
       ca la Firebase "am facut un cont" inseamna si "am intrat in el": daca
       l-am face pe legatura ta, ai fi dat afara din contul tau si ai ramane
       logat ca omul caruia tocmai i-ai facut cont. */
    window.FB={db:db,auth:auth,cfg:CFG,
               initializeApp:initializeApp,getAuth:getAuth,
               collection:collection,doc:doc,getDoc:getDoc,setDoc:setDoc,
               updateDoc:updateDoc,deleteDoc:deleteDoc,getDocs:getDocs,
               query:query,where:where,orderBy:orderBy,startAt:startAt,
               endBefore:endBefore,limit:limit,onSnapshot:onSnapshot,
               documentId:documentId,

               signIn:signInWithEmailAndPassword,signOut:signOut,

function pariazaBiletulAI(){
 var tk=TICKETS[curTicket];
 if(!tk||!tk.lista||!tk.lista.length){mesaj('Bilet gol','<p>Biletul asta n-are selectii azi.</p>');return}
 var cota=1;tk.lista.forEach(function(s){cota*=(s.cota||1)});
 var sold=monede();
 var camp=document.getElementById('ai-miza');
 var miza=Math.max(0,parseInt(camp&&camp.value)||0);
 if(miza>sold){mesaj('Nu ai atatea monede','<p>Ai doar <b>'+bani(sold)+'</b> monede.</p>');return}
 var deja=bileteleMele.filter(function(b){return b.sursa===curTicket&&b.ziua===tk.ziua}).length;
 if(deja){
  intreaba('L-ai jucat deja azi','<p class="sub">Biletul <b>'+esc(tk.titlu)+
    '</b> e deja pe lista ta pentru azi. Il mai pui o data?</p>','Il pun din nou')
   .then(function(ok){if(ok)pariazaBiletulAIAcum(tk,cota,miza,sold)});
  return;
 }
 pariazaBiletulAIAcum(tk,cota,miza,sold);
}
function pariazaBiletulAIAcum(tk,cota,miza,sold){
 if(miza>0){monedeSet(sold-miza);logMoneda('miza',-miza,tk.titlu+', cota '+cota.toFixed(2))}
 bileteleMele.unshift({
  id:'b'+Date.now(),
  data:new Date().toISOString(),
  sursa:curTicket, ziua:tk.ziua,
  cota:cota, miza:miza, platit:false, stare:'in asteptare',
  selectii:tk.lista.map(function(s){
   return {sport:s.sport,emoji:s.emoji,home:s.home,away:s.away,comp:s.comp,
           start:s.start,tip:s.tip,pick:s.pick,prob:s.prob,cota:s.cota,stare:'in asteptare'};
  })
 });
 taiePesteLimita();
 salveazaBileteleMele();
 anuntaPariu('pus',bileteleMele[0],{titlu:tk.titlu});
 mesaj(miza>0?'Bilet pus!':'Bilet salvat',
   miza>0
    ? '<p>Ai jucat <b>'+esc(tk.titlu)+'</b> cu <b>'+miza+'</b> monede.<br>Daca iese, primesti <b style="color:var(--green)">'+
      bani(miza*cota)+'</b> monede.</p>'
    : '<p><b>'+esc(tk.titlu)+'</b> e la <b>Biletele mele</b>.</p>');
 aratraBileteleMele();
}
function renderCalibrareInterval(){
 var buckets=[{lo:0,hi:65,eticheta:'&lt;65%'},{lo:65,hi:80,eticheta:'65-80%'},{lo:80,hi:101,eticheta:'&ge;80%'}];
 buckets.forEach(function(b){b.n=0;b.castiguri=0;b.sumaProb=0});
 ISTORIC.forEach(function(bilet){
  (bilet.selectii||[]).forEach(function(s){
   if(s.stare!=='castigat'&&s.stare!=='pierdut')return;
   var p=s.prob||0;
   var buc=buckets.filter(function(x){return p>=x.lo&&p<x.hi})[0];
   if(!buc)return;
   buc.n++;
   if(s.stare==='castigat')buc.castiguri++;
   buc.sumaProb+=p;
  });
 });
 var total=buckets.reduce(function(s,b){return s+b.n},0);
 if(!total){
  return '<div class="gold-box"><div class="gold-title">&#128200; Calibrare pe interval de incredere</div>'+
    '<div class="gold-sub">Inca nu exista selectii verificate (castigate/pierdute) ca sa calculam rata reala pe interval de incredere.</div></div>';
 }
 var h='<div class="gold-box"><div class="gold-title">&#128200; Calibrare pe interval de incredere</div>'+
   '<div class="gold-sub">Rata reala de castig ('+total+' selectii verificate din toate biletele), pe fiecare interval de incredere aratat la momentul predictiei.</div></div>';
 h+='<div class="ist-card"><div class="ist-det" style="display:block;padding:10px 14px">';
 buckets.forEach(function(b){
  if(!b.n){
   h+='<div class="ist-sel"><span>'+b.eticheta+' <span style="color:var(--muted)">(0 selectii verificate)</span></span></div>';
   return;
  }
  var rataReala=b.castiguri/b.n*100;
  var probMedie=b.sumaProb/b.n;
  var diff=rataReala-probMedie;
  var culoare=diff>=-5?'var(--green)':'var(--red)';
  h+='<div class="ist-sel"><span><b>'+b.eticheta+'</b> <span style="color:var(--muted)">(n='+b.n+', incredere medie prezisa '+probMedie.toFixed(1)+'%)</span></span>'+
    '<span style="color:'+culoare+';font-weight:700">'+rataReala.toFixed(1)+'% real ('+b.castiguri+'/'+b.n+')</span></div>';
 });
 h+='</div></div>';
 return h;
}

/* ── Biletele cu plata ────────────────────────────────────────────────────
   Biletul de cota 2 e gratuit; celelalte se deschid cu monede. Odata platit,
   biletul ramane deschis toata ziua lui (folosim aceeasi memorie ca la
   detaliile meciurilor, care se curata singura dupa doua zile).            */
function cheieBilet(k){
 var t=TICKETS[k]||{};
 return 'bilet|'+k+'|'+(t.ziua||'');
}
function biletDeblocat(k){
 var t=TICKETS[k];
 if(!t||!t.pret)return true;                 // gratuit
 return !!meciuriDeblocate()[cheieBilet(k)];
}
function deschideBilet(k){
 var t=TICKETS[k];
 if(!t)return;
 var m=monede();
 if(m<t.pret){
  mesaj('Nu ai destule monede',
   '<p>Biletul <b>'+esc(t.titlu)+'</b> costa <b>'+t.pret+' monede</b>, iar tu ai <b>'+m+'</b>.</p>');
  return;
 }
 intreaba('Deschizi '+t.titlu+'?',
  '<p class="sub">Costa '+t.pret+' monede (ai '+m.toLocaleString('ro-RO')+').<br>'+
  'Ramane deschis toata ziua.</p>',
  'Platesc '+t.pret+' &#129689;').then(function(ok){
   if(!ok)return;
   monedeSet(monede()-t.pret);
   logMoneda('bilet',-t.pret,t.titlu);
   marcheazaDeblocat(cheieBilet(k));
   renderBilet();
  });
}

function roundRect(ctx,x,y,w,h,r){
 ctx.beginPath();
 ctx.moveTo(x+r,y);
 ctx.arcTo(x+w,y,x+w,y+h,r);
 ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r);
 ctx.arcTo(x,y,x+w,y,r);
 ctx.closePath();
}
function fitText(ctx,text,maxWidth){
 text=String(text||'');
 if(ctx.measureText(text).width<=maxWidth)return text;
 var t=text;
 while(t.length>1 && ctx.measureText(t+'\u2026').width>maxWidth){t=t.slice(0,-1)}
 return t+'\u2026';
}

// Deseneaza biletul pe un canvas la rezolutie mare (HD, 1080px latime) - nu
// depinde de nicio librarie externa (functioneaza offline, fara CDN).
function deseneazaBiletCanvas(lista,titlu){
 var W=1080,PAD=50,ROWH=190,HEADH=280,FOOTH=190;
 var H=HEADH+lista.length*ROWH+FOOTH+PAD;
 var cv=document.createElement('canvas');
 cv.width=W;cv.height=H;
 var ctx=cv.getContext('2d');
 ctx.fillStyle='#2A070E';ctx.fillRect(0,0,W,H);

 var grad=ctx.createLinearGradient(0,0,W,0);
 grad.addColorStop(0,'rgba(196,30,58,.28)');
 grad.addColorStop(1,'rgba(196,30,58,.12)');
 ctx.fillStyle=grad;ctx.fillRect(0,0,W,HEADH-20);
 ctx.strokeStyle='rgba(196,30,58,.5)';ctx.lineWidth=2;
 ctx.strokeRect(1,1,W-2,HEADH-22);

 ctx.fillStyle='#F5EDEF';
 ctx.font='bold 54px system-ui,-apple-system,sans-serif';
 ctx.fillText('\u2b50 '+titlu,PAD,95);

 var cT=1;lista.forEach(function(s){cT*=(s.cota||1)});
 ctx.font='30px system-ui,-apple-system,sans-serif';
 ctx.fillStyle='#C79AA8';
 ctx.fillText(lista.length+' selectii  |  cota totala '+cT.toFixed(2),PAD,145);

 var acum=new Date();
 var p2=function(n){return String(n).padStart(2,'0')};
 ctx.font='22px system-ui,-apple-system,sans-serif';
 ctx.fillStyle='#C79AA8';
 ctx.fillText('Generat '+p2(acum.getDate())+'.'+p2(acum.getMonth()+1)+'.'+acum.getFullYear()+' '+p2(acum.getHours())+':'+p2(acum.getMinutes()),PAD,185);

 var y=HEADH;
 lista.forEach(function(s){
  var rowH=ROWH-16;
  ctx.fillStyle='#3A0C18';
  roundRect(ctx,PAD,y,W-PAD*2,rowH,16);ctx.fill();
  ctx.strokeStyle='#5C2230';ctx.lineWidth=1.5;
  roundRect(ctx,PAD,y,W-PAD*2,rowH,16);ctx.stroke();

  var innerX=PAD+28,rightW=260;
  ctx.textAlign='left';
  ctx.fillStyle='#F5EDEF';
  ctx.font='bold 34px system-ui,-apple-system,sans-serif';
  ctx.fillText(fitText(ctx,s.emoji+' '+s.home+' vs '+s.away,W-PAD*2-rightW-40),innerX,y+52);

  ctx.font='22px system-ui,-apple-system,sans-serif';
  ctx.fillStyle='#C79AA8';
  ctx.fillText(fitText(ctx,s.sport+(s.comp?' - '+s.comp:''),W-PAD*2-rightW-40),innerX,y+86);

  ctx.font='24px system-ui,-apple-system,sans-serif';
  ctx.fillStyle='#C79AA8';
  var lbl=s.tip+': ';
  ctx.fillText(lbl,innerX,y+124);
  var lblW=ctx.measureText(lbl).width;
  ctx.fillStyle='#C41E3A';
  ctx.font='bold 24px system-ui,-apple-system,sans-serif';
  ctx.fillText(fitText(ctx,s.pick,W-PAD*2-rightW-40-lblW),innerX+lblW,y+124);

  ctx.textAlign='right';
  ctx.fillStyle=s.prob>=70?'#22C55E':s.prob>=60?'#C41E3A':'#EF4444';
  ctx.font='bold 42px system-ui,-apple-system,sans-serif';
  ctx.fillText(s.prob.toFixed(0)+'%',W-PAD-24,y+62);
  ctx.fillStyle='#C41E3A';
  ctx.font='bold 30px system-ui,-apple-system,sans-serif';
  ctx.fillText('@'+s.cota.toFixed(2),W-PAD-24,y+102);
  ctx.textAlign='left';
  y+=ROWH;
 });

 var atins=cT>=COTA_MIN_BILET;
 var araTinta=(titlu.indexOf('Complet')<0);
 var footOk=(!araTinta||atins);
 ctx.fillStyle=footOk?'rgba(34,197,94,.16)':'rgba(196,30,58,.16)';
 roundRect(ctx,PAD,y+10,W-PAD*2,FOOTH-40,16);ctx.fill();
 ctx.strokeStyle=footOk?'#22C55E':'#C41E3A';ctx.lineWidth=2;
 roundRect(ctx,PAD,y+10,W-PAD*2,FOOTH-40,16);ctx.stroke();
 ctx.textAlign='center';
 ctx.fillStyle=footOk?'#22C55E':'#C41E3A';
 ctx.font='bold 46px system-ui,-apple-system,sans-serif';
 ctx.fillText('Cota totala: '+cT.toFixed(2)+(araTinta&&atins?' \u2713':''),W/2,y+72);
 ctx.textAlign='left';
 return cv;
}

function descarcaBlob(blob,nume){

function showPage(gi,pi){
 curP[gi]=pi;
 subEl.querySelectorAll('.stab').forEach(function(t,k){t.classList.toggle('active',k===pi)});
 Object.keys(frames).forEach(function(k){frames[k].classList.remove('active')});
 biletPane.classList.remove('active');
 var key=gi+'_'+pi;
 if(!frames[key]){
  var f=document.createElement('iframe');
  // Pe fisier local (file://) NU punem sandbox. Sandbox-ul da frame-ului o
  // origine "opaca", iar Chrome refuza atunci sa incarce fisierul din pagini/
  // - pe calculator pagina de sport ramanea complet goala, desi pe telefon
  // (unde site-ul e pe https) mergea. Inainte paginile erau incluse in
  // documentul principal (srcdoc), de-aia problema n-a existat pana acum.
  if(location.protocol!=='file:'){
   f.setAttribute('sandbox','allow-scripts allow-same-origin allow-modals allow-popups allow-downloads');
  }
  // Fara asta, "share"-ul nativ e interzis in iframe si butonul cu aparatul de
  // fotografiat parea ca nu face nimic pe telefon.
  f.setAttribute('allow','web-share; clipboard-write');
  stage.appendChild(f);
  frames[key]=f;
  // Sporturile mari (Fotbal ~48 MB) au nevoie de cateva secunde - fara
  // indicator, pagina arata goala/cu 0 meciuri si pare stricata.
  aratraIncarcare(GROUPS[gi].tab);
  f.__gi=gi; f.__pi=pi; f.__incercare=1;
  var pg=GROUPS[gi].pages[pi];
  if(pg.url){
   /* Tab-ul "Live" - pagina lor de scoruri, nu una de-a noastra. NU o punem
      sub supraveghere: aia asteapta semnalul "pagina-gata" pe care il trimit
      doar paginile noastre, si dupa 12 secunde ar reincarca-o si ar zice ca
      s-a stricat. Aici ne luam dupa evenimentul obisnuit de incarcare. */
   f.__extern=true;
   f.addEventListener('load',function(){ f.__gata=true; ascundeIncarcare() });
   f.src=pg.url;
  } else {
   // fisier separat (pagini/<sport>.html), incarcat abia acum - de-aia
   // pornirea e instantanee: nu mai descarcam toate sporturile din start
   f.src='pagini/'+pg.file+'?v='+BUILD;
   supravegheazaFrame(f);
  }
 }
 frames[key].classList.add('active');
 try{localStorage.setItem('combTab','g'+gi+'_'+pi)}catch(e){}
 aplicaCautareGlobala();   // pastreaza cautarea si cand schimbi sportul
}

/* ── Vederea "Favorite" ─────────────────────────────────────────────────────
   Steluta de pe card si filtrarea propriu-zisa stau in pagina sportului (vezi
   peticul din injecteaza_bridge). De aici doar ii spunem sa arate doar
   cardurile insemnate, si tinem minte daca vederea e pornita, ca sa ramana
   asa si cand treci de la un sport la altul.                                */
/* ── Cautarea nu are voie sa ramana agatata ───────────────────────────────
   Bug patit: trimiteai un meci pe chat, apasai pe el, si te ducea in sportul
   lui filtrat pe numele echipei. Pana aici bine - dar filtrul RAMANEA pus.
   Te duceai apoi la Fotbal si vedeai doar meciurile echipei aleia, fara sa
   intelegi de ce lipsesc restul; trebuia sa inchizi si sa deschizi aplicatia.
   Acum cautarea se sterge singura cand pleci de pe ecranul de sport sau cand
   alegi alt sport din lista. Ramane doar cat te uiti la ce ai cautat.       */
function stergeCautarea(){

   si reveneai maine, gaseai aplicatia cu doua meciuri in ea si nu intelegeai
   unde e restul - aceeasi capcana ca la cautarea care ramanea agatata.

// ── Cautare unica, pentru toate sporturile ─────────────────────────────────
// Fiecare pagina de sport are propriul camp de cautare (#srch), acum ascuns.
// De aici ii setam valoarea si declansam evenimentul "input" pe care pagina
// deja il asculta - asa filtrarea ramane exact aceeasi logica testata din
// fiecare sport, doar comandata dintr-un singur loc. iframe-urile sunt
// srcdoc + allow-same-origin, deci le putem accesa documentul direct.
function aplicaCautareGlobala(){
 var inp=document.getElementById('q-global');
 if(!inp)return;
 var q=inp.value||'';
 Object.keys(frames).forEach(function(k){
  var f=frames[k];
  if(!f.classList.contains('active'))return;
  // prin mesaj, nu prin acces direct la documentul iframe-ului: paginile sunt
  // fisiere separate, iar accesul direct ar fi blocat cand deschizi de pe disc
  try{f.contentWindow.postMessage({type:'cauta',q:q},'*')}catch(e){}
 });
}

 if(!inp)return;

 inp.addEventListener('input',function(){

/* ── Butonul "inapoi" de pe telefon inchide ce e deschis, nu aplicatia ────
   Ferestrele noastre (detalii meci, panoul de bilet, ferestrele de confirmare)
   sunt straturi desenate peste pagina, nu pagini noi. Fara asta, "inapoi" iesea
   direct din aplicatie. Punem un pas fals in istoric pentru fiecare strat
   deschis; cand se apasa inapoi, il consumam si inchidem stratul.            */
var STRATURI=[];
// Cand inchidem noi un strat (din butonul inapoi), pagina de sport observa si ea
// ca s-a inchis si ne anunta. Fara contorul asta am scoate stratul de doua ori,
// iar al doilea "inapoi" n-ar mai avea ce inchide - exact ce se intampla.
var INCHIDERI_DE_IGNORAT=0;
function deschideStrat(nume,inchide){
 STRATURI.push({nume:nume,inchide:inchide});
 try{history.pushState({mrf:nume,n:STRATURI.length},'')}catch(e){}
}
function inchideStratCurent(){
 var s=STRATURI.pop();
 if(!s)return false;
 INCHIDERI_DE_IGNORAT++;
 try{s.inchide()}catch(e){}
 return true;
}
window.addEventListener('popstate',function(){
 if(STRATURI.length)inchideStratCurent();
});
window.addEventListener('message',function(e){
 if(!e.data)return;
 if(e.data.type==='strat-deschis'){
  var sursa=e.source;
  deschideStrat('detalii',function(){
   try{sursa.postMessage({type:'inchide-strat'},'*')}catch(err){}
  });
 }else if(e.data.type==='strat-inchis'){
  if(INCHIDERI_DE_IGNORAT>0){INCHIDERI_DE_IGNORAT--;return}   // am inchis noi
  // s-a inchis din pagina (X sau click in afara) - scoatem ultimul pas pus
  STRATURI.pop();
 }
});

/* ══════════ CONT + MONEDE (Firebase) ════════════════════════════════════

   si se uita in ea putea intra ca oricine. Acum sunt in Firebase Auth:

   sa fie doar litere mici, cifre, punct, minus si liniuta de subsol.

   Langa fiecare cont tinem in Firestore doar ce NU e secret:
     conturi/<nume>   {nume, uid, admin, moderator, cote, monede, creat}
     solduri/<nume>   {monede, bilete, cand, disp}   - cat are fiecare acum
     sesiuni/<nume__telefon> {nume, disp, cand}      - de pe cate telefoane

   Cine face conturile: tot tu, din aplicatie, ca pana acum. Un cont facut
   direct in Firebase, fara randul din "conturi", nu e cont - nu vede cotele,
   n-are monede si nu poate intra nicaieri.                                 */

function emailDinNume(u){ return String(u||'').trim().toLowerCase()+DOMENIU_CONT }

var utilizator=null;
try{utilizator=localStorage.getItem('mrfUtilizator')||null}catch(e){}

function cheieCont(sufix){return 'mrf_'+(utilizator||'anonim')+'_'+sufix}

/* Monedele se tin si se arata cu doua zecimale: la cota 24,20 si miza 1, castigi
   24,20, nu 24. Rotunjirea manca bani din castiguri, mai ales la mize mici. */
function bani(x){
 var n=Math.round((Number(x)||0)*100)/100;
 return n.toLocaleString('ro-RO',{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2});
}
function monede(){
 try{
  var v=localStorage.getItem(cheieCont('monede'));
  if(v===null){
   /* Prima deschidere a contului asta pe telefonul asta. Ii dam soldul de
      pornire, dar lasam un semn: daca in Firestore exista un sold raportat
      de un telefon de-al lui, il luam pe ala (vezi recupereazaSoldul).
      Fara asta, schimbi telefonul si o iei de la capat cu 1000, cu tot ce ai
      castigat pierdut - soldul a stat dintotdeauna doar pe telefon. */
   try{localStorage.setItem(cheieCont('sold_nou'),'1')}catch(e2){}
   monedeSet(MONEDE_START);
   return MONEDE_START;
  }
  return parseFloat(v)||0;
 }catch(e){return 0}
}

/* Aduce soldul de pe celalalt telefon, o singura data, si NUMAI daca aici
   soldul tocmai a fost creat din nimic. Daca ai deja un sold pe telefonul
   asta - chiar si 0, pentru ca ai pierdut tot - nu ne atingem de el.
   Sursa e "solduri/<nume>", pe care telefoanele o scriu oricum din 5 in 5
   minute ca s-o vezi tu in panoul de Conturi; acum o si citim inapoi. */
var SOLD_VERIFICAT=false;
function recupereazaSoldul(){
 if(SOLD_VERIFICAT)return;
 if(!esteLogat()||!window.FB||!window.FB.auth.currentUser)return;
 var semn='';
 try{semn=localStorage.getItem(cheieCont('sold_nou'))||''}catch(e){}
 SOLD_VERIFICAT=true;
 if(!semn)return;
 var F=window.FB, cine=utilizator;
 function gata(){ try{localStorage.removeItem(cheieCont('sold_nou'))}catch(e){} }
 F.getDoc(F.doc(F.db,'solduri',cine)).then(function(d){
   gata();
   if(!d.exists()||cine!==utilizator)return;
   var s=Number((d.data()||{}).monede);
   if(!isFinite(s)||s<0)return;
   if(Math.round(s)===Math.round(monede()))return;
   monedeSet(s);
   logMoneda(s>MONEDE_START?'primit':'scazut', s-MONEDE_START, 'sold adus de pe celalalt telefon');
   mesaj('Ti-am adus monedele',
     '<p>Pe celalalt telefon aveai <b>'+bani(s)+'</b> monede.</p>'+
     '<p class="sub">Soldul se tine pe telefon, dar il raportezi din 5 in 5 minute - '+
     'de acolo l-am luat.</p>');
 }).catch(function(){ gata() });
}
function monedeSet(n){
 try{localStorage.setItem(cheieCont('monede'),String(Math.max(0,Math.round(n))))}catch(e){}
 actualizeazaAfisajMonede();
 raporteazaSold();
}

/* ── Cate monede are fiecare ──────────────────────────────────────────────
   Monedele stau pe telefonul fiecaruia, deci pagina principala n-are de unde
   sti cat are Albert. De aceea fiecare telefon isi SCRIE soldul in Firestore,
   iar tu il vezi in panoul de Conturi.
   Scrierea e "cu intarziere": daca pui trei pariuri la rand, nu scriem de trei
   ori, ci o data, dupa ce te-ai oprit. Si nu blocam nimic daca n-are net -
   Firestore o trimite singur cand revine reteaua. */
var raportTimer=null;
function raporteazaSold(){
 if(!esteLogat()||!window.FB||!window.FB.auth.currentUser)return;
 clearTimeout(raportTimer);
 raportTimer=setTimeout(function(){
  var nr=0;
  try{nr=(JSON.parse(localStorage.getItem('mrfBileteleMele')||'[]')||[]).length}catch(e){}
  var F=window.FB, disp=numarTelefon();
  F.setDoc(F.doc(F.db,'solduri',utilizator),
    {monede:monede(),bilete:nr,cand:Date.now(),disp:disp}).catch(function(){});
  // de pe cate telefoane e deschis contul (vezi avertismentul din panou)
  F.setDoc(F.doc(F.db,'sesiuni',utilizator+'__'+disp),
    {nume:utilizator,disp:disp,cand:Date.now()}).catch(function(){});
 },4000);
}

/* ── Istoricul monedelor: de unde au venit si pe ce s-au dus ───────────── */
function istoricMonede(){
 try{return JSON.parse(localStorage.getItem(cheieCont('istoric_monede'))||'[]')}catch(e){return []}
}
function logMoneda(tip,suma,detalii){
 if(!suma)return;
 var ist=istoricMonede();
 ist.unshift({d:new Date().toISOString(),t:tip,s:Math.round(suma),info:detalii||'',sold:monede()});
 if(ist.length>200)ist=ist.slice(0,200);   // nu lasam sa creasca la nesfarsit
 try{localStorage.setItem(cheieCont('istoric_monede'),JSON.stringify(ist))}catch(e){}
}
function scadeMonede(n){
 var m=monede();
 if(m<n)return false;
 monedeSet(m-n);
 return true;
}
function actualizeazaAfisajMonede(){
 if(!utilizator)return;                 // fara cont nu exista monede de aratat
 var el=document.getElementById('sold-monede');
 if(el)el.textContent=monede().toLocaleString('ro-RO');
 var nume=document.getElementById('nume-cont');
 if(nume)nume.textContent=utilizator.charAt(0).toUpperCase()+utilizator.slice(1);
}

/* ══════════ Fara cont: se vede tot, mai putin cotele si biletul ══════════
   Ce vede oricine: meciurile, procentele noastre, statisticile, detaliile,
   evaluarea, ranking-urile. Ce cere cont: cotele, biletul si monedele.
   Conturile le fac eu - de aceea nu exista nicaieri buton de inregistrare.

   De stiut, ca sa nu te bazezi gresit pe asta: site-ul e static, deci cotele
   ajung oricum in fisierul descarcat pe telefon. E o separare pentru oameni
   cinstiti, nu o incuietoare adevarata - pentru aia ar trebui un server. */
/* ══════════ Conturile, luate in direct ══════════════════════════════════
   Pana acum lista de conturi era "coapta" in pagina la generare: un cont nou
   aparea abia dupa ce regeneram si urcam tot site-ul. Acum aplicatia o cere de
   la un mic serviciu din contul tau Google (Apps Script), la pornire si apoi
   din minut in minut - deci un cont facut de pe telefon merge imediat.

   Daca serviciul nu raspunde (esti fara net, ori Google e picat), ramanem pe
   lista veche din pagina. Asa nu ramai NICIODATA blocat afara din aplicatie
   din cauza retelei. */
var CONTURI_VII=null;          // lista din Firestore (null = n-a venit inca)
var ADMINI={};                 // cine are voie sa faca si sa stearga conturi
var MODERATORI={};             // cine poate doar sa blocheze oameni din chat
var SOLDURI={};                // cat are fiecare (numai adminul le poate citi)
var SESIUNI={};                // de pe ce telefoane e deschis fiecare cont
var PARIURI_VII=[];            // ce au pariat ai tai in ultimele doua zile

/* Biletele stau pe telefonul fiecaruia, deci nimeni n-are de unde sti ce a
   jucat celalalt. Scriem in Firestore doar atat cat sa apara pe "Acasa":
   cine, ce bilet, ce cota, ce miza si cum a iesit. Fara selectii - ce joaca
   fiecare ramane al lui pana se decide.
   Se scrie doar daca esti intr-un cont: cei fara cont n-au bilete oricum. */
function anuntaPariu(fel,b,extra){
  if(!esteLogat()||!window.FB||!window.FB.auth.currentUser)return;
  var F=window.FB, e=extra||{};
  var id=String(Date.now())+'_'+Math.random().toString(36).slice(2,8);
  F.setDoc(F.doc(F.db,'pariuri',id),{
    nume:String(utilizator), jos:String(utilizator).toLowerCase(),
    fel:String(fel),
    titlu:String(e.titlu||b.titlu||'bilet'),
    cota:Math.round(Number(b.cota_finala||b.cota||0)*100)/100,
    miza:Math.round(Number(b.miza||0)),
    castig:Math.round(Number(e.castig||0)),
    cand:Date.now()
  }).catch(function(){});
}

/* Lista de conturi vine acum in direct din Firestore si NU mai contine
   parole - doar nume si drepturi. Cat timp n-a ajuns inca (primele momente
   dupa deschidere) ramane null, iar aplicatia se poarta ca si cum n-ai avea
   cont: se vede tot ce am calculat, fara cote si fara bilet. Se corecteaza
   singura in cateva zecimi de secunda.
   Fara net nu ramai blocat afara: Firestore tine minte pe telefon ce a vazut
   ultima oara (vezi persistentLocalCache, la capul paginii). */
function conturiActive(){ return CONTURI_VII||CONTURI }
function esteLogat(){ return !!(utilizator&&conturiActive()[utilizator]!=null) }
function eAdmin(){ return esteLogat()&&!!ADMINI[utilizator] }

var MONEDE_DATE={};
/* Cine are voie sa vada cotele. Procentele se vad oricum, la toata lumea -
   se schimba doar cotele. Comuti dintr-un buton, din panoul de Conturi. */
var COTE_PERMISE={};
function areVoieLaCote(){ return !esteLogat()?false:(COTE_PERMISE[utilizator]!==false) }

/* Numarul acestui telefon. Se face o data, la prima deschidere, si ramane.
   Nu spune nimic despre tine sau despre telefon - e doar ca sa se poata
   deosebi doua aparate intre ele, ca sa stiu daca acelasi cont e deschis in
   doua locuri sau daca pe acelasi telefon s-au deschis doua conturi. */
function numarTelefon(){
 var v=null;
 try{v=localStorage.getItem('mrfDispozitiv')}catch(e){}
 if(!v){
  v='d'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  try{localStorage.setItem('mrfDispozitiv',v)}catch(e){}
 }
 return v;
}
/* Biletele facute de aplicatie se refac la fiecare rulare, deci nu pot fi
   sterse de-a binelea. Tinem in Google lista celor pe care le-ai scos, si nu
   mai apar la nimeni. Doar tu poti face asta, si se poate da inapoi. */
var BILETE_ASCUNSE={};
function biletAscuns(b){ return !!(b&&BILETE_ASCUNSE[String(b.id)]) }
/* Monedele date de tine din aplicatie.
   Cum functioneaza, ca sa nu para magie: in foaia de calcul, coloana "Monede"
   e TOTALUL pe care i l-ai dat vreodata, nu soldul lui. Telefonul tine minte
   cat a vazut ultima oara si adauga doar DIFERENTA. Asa poti da monede de
   oricate ori vrei: nu se dubleaza daca deschide aplicatia de zece ori, si nu
   sterge ce a castigat sau a pierdut el intre timp.
   Prima data cand vede cifra, doar o retine - altfel cele 1000 de la creare
   s-ar aduna peste cele 1000 cu care porneste contul.

   ATENTIE la mutarea pe Firebase (4 august 2026): semnul "cat am vazut" are
   ACUM alt nume in telefon (..._fb). Fara asta, telefoanele care mai tineau
   minte totalul din foaia Google ar fi scazut diferenta dintre cele doua
   sisteme - cine avea 5000 dati prin Google si primea un cont nou cu 1000 ar
   fi ramas cu 4000 de monede MAI PUTINE, fara sa inteleaga nimeni de ce.
   Cu nume nou, prima citire doar se retine, si nu se aduna si nu se scade
   nimic. Soldul lui de pe telefon ramane neatins. */
function aplicaMonedeleDate(){
 if(!esteLogat())return;
 var total=Number(MONEDE_DATE[utilizator]||0);
 var vazut=null;
 try{
  var v=localStorage.getItem(cheieCont('monede_date_vazut_fb'));
  if(v!==null&&v!=='')vazut=Number(v);
 }catch(e){}
 if(vazut===null){
  try{localStorage.setItem(cheieCont('monede_date_vazut_fb'),String(total))}catch(e){}
  return;
 }
 var dif=total-vazut;
 if(!dif)return;
 monedeSet(monede()+dif);
 logMoneda(dif>0?'primit':'scazut',dif,'de la administrator');
 try{localStorage.setItem(cheieCont('monede_date_vazut_fb'),String(total))}catch(e){}
 if(dif>0){
  mesaj('Ai primit monede','<p>Administratorul ti-a dat <b>'+dif+'</b> monede.</p>');
 }
}

/* ── Conturile, in direct din Firestore ────────────────────────────────────
   Inainte intrebam Google din minut in minut, de pe fiecare telefon. La 100
   de oameni, aia inseamna 144.000 de cereri pe zi degeaba - exact ce ne-a
   scos de acolo. Acum e o legatura deschisa: cand faci un cont sau dai
   monede, ajunge la ei in aceeasi secunda, si nu se mai cere nimic in gol.
   aduConturi() a ramas ca nume, ca sa nu umblu prin tot fisierul, dar nu mai
   aduce nimic - listele sunt deja proaspete. */
function aduConturi(gata){ if(gata)gata(true) }

var CONTURI_ASCULTATE=false;
function porneteConturi(){
 if(!window.FB||CONTURI_ASCULTATE)return;
 CONTURI_ASCULTATE=true;
 var F=window.FB;

 /* cine esti. Firebase tine minte sesiunea pe telefon, deci ramai logat si
    dupa ce inchizi aplicatia, si stie asta si fara net. */
 F.onAuthStateChanged(F.auth,function(cont){
  var nou=cont?numeDinEmail(cont.email):null;
  if(nou===utilizator){ dupaCeStimCine(); return }
  utilizator=nou;
  try{
   if(nou)localStorage.setItem('mrfUtilizator',nou);
   else localStorage.removeItem('mrfUtilizator');
  }catch(e){}
  if(cont)pregatesteContul(cont);
  dupaCeStimCine();
 });

 // lista de conturi si drepturile lor
 F.onSnapshot(F.collection(F.db,'conturi'),function(s){
  var m={},a={},md={},mo={},ct={};
  s.forEach(function(d){
   var c=d.data()||{}, u=String(c.nume||d.id).trim().toLowerCase();
   if(!u)return;
   m[u]={nume:u,uid:String(c.uid||''),admin:!!c.admin,moderator:!!c.moderator,
         cote:(c.cote!==false),monede:Number(c.monede||0)};
   if(c.admin)a[u]=true;
   if(c.moderator)md[u]=true;
   mo[u]=Number(c.monede||0);
   ct[u]=(c.cote!==false);
  });
  CONTURI_VII=m; ADMINI=a; MODERATORI=md; MONEDE_DATE=mo; COTE_PERMISE=ct;
  dupaCeStimCine();
 },function(e){ console.log('conturi:',e&&e.message) });

 // biletele scoase de tine din istoric
 F.onSnapshot(F.collection(F.db,'ascunse'),function(s){
  BILETE_ASCUNSE={};
  s.forEach(function(d){ BILETE_ASCUNSE[String(d.id)]=true });
  try{renderIstoric()}catch(e){}
 },function(){});

 /* cine a pariat si cum a iesit - doar ce s-a intamplat in ultimele doua
    zile. Id-ul are ora in el (ca la mesaje), deci cerem direct fereastra de
    doua zile, fara index facut de mana si fara sa platim citiri pe vechituri. */
 try{
  F.onSnapshot(
   F.query(F.collection(F.db,'pariuri'),
           F.orderBy(F.documentId()),
           F.startAt(String(Date.now()-2*86400000)+'_')),
   function(s){
     PARIURI_VII=[];
     s.forEach(function(d){ var p=d.data()||{}; p.id=d.id; PARIURI_VII.push(p) });
     PARIURI_VII.reverse();
     if(ecranCurent==='acasa'){ try{deseneazaAcasa()}catch(e){} }
   },function(e){ console.log('pariuri:',e&&e.message) });
 }catch(e){}

 setTimeout(function(){raporteazaSold()},6000);
 setInterval(function(){raporteazaSold()},300000);
 // maturam si pariurile vechi, ca la mesaje: cine deschide, curata si pentru
 // ceilalti. Daca regulile nu-l lasa, nu se strica nimic - oricum nu se mai cer.
 setTimeout(function(){
  try{
   F.getDocs(F.query(F.collection(F.db,'pariuri'),F.orderBy(F.documentId()),
                     F.endBefore(String(Date.now()-2*86400000)+'_'),F.limit(40)))
    .then(function(s){ s.forEach(function(d){ F.deleteDoc(d.ref).catch(function(){}) }) })
    .catch(function(){});
  }catch(e){}
 },9000);
}

/* Se cheama si cand se schimba cine esti, si cand se schimba lista de
   conturi - fiindca "esti logat" inseamna amandoua: sa fii intrat cu parola
   SI sa ai rand in lista. Un cont facut direct in Firebase, fara randul lui,
   nu e cont. */
function dupaCeStimCine(){
 if(CONTURI_VII===null)return;              // inca n-a ajuns lista
 if(utilizator&&!conturiActive()[utilizator]&&!eContulTau()){
  // ti-a sters cineva contul cat erai in el
  iesiDinCont(true);
  return;
 }
 poartaDeLogare();        // fara cont nu se vede nimic
 recupereazaSoldul();     // inainte de acordari: intai aducem ce aveai, apoi adaugam
 aplicaMonedeleDate();
 aplicaAcordarile();
 actualizeazaModInvitat();
 actualizeazaAfisajMonede();
 try{deseneazaBara()}catch(e){}
 try{if(ecranCurent==='acasa')deseneazaAcasa()}catch(e){}
}

/* Contul TAU nu se poate face din aplicatie - el e primul, n-are cine sa-l
   faca. Deci: cand intri cu adresa de admin si inca n-ai rand in "conturi",
   ti-l scriem noi, cu drepturi de admin. O singura data, la prima intrare. */
function eContulTau(){
 var c=window.FB&&window.FB.auth.currentUser;
 return !!(c&&String(c.email||'').toLowerCase()===ADMIN_EMAIL);
}
function pregatesteContul(cont){
 var F=window.FB, nume=numeDinEmail(cont.email);
 F.getDoc(F.doc(F.db,'conturi',nume)).then(function(d){
  if(d.exists()){
   // completam uid-ul daca lipseste (contul facut inainte de prima intrare)
   if(!(d.data()||{}).uid){
    F.updateDoc(F.doc(F.db,'conturi',nume),{uid:cont.uid}).catch(function(){});
   }
   return;
  }
  if(String(cont.email||'').toLowerCase()!==ADMIN_EMAIL)return;   // nu e cont
  F.setDoc(F.doc(F.db,'conturi',nume),{
   nume:nume,uid:cont.uid,admin:true,moderator:true,cote:true,
   monede:0,creat:Date.now()
  }).catch(function(e){ console.log('cont admin:',e&&e.message) });
 }).catch(function(){});
}

/* ── Administrarea conturilor, de pe telefon (doar pentru admin) ─────────
   Nu-ti mai cer parola de administrator la fiecare deschidere: acum esti
   intrat cu ea in aplicatie, iar Firebase stie ca esti tu. Ce nu poate face
   nimeni de pe telefon, oricat ar apasa, opresc chiar regulile din consola,
   nu doar butoanele ascunse.
   Ce s-a schimbat fata de foaia Google, ca sa nu te miri:
     - parola cuiva NU se mai schimba de aici; se face din consola Firebase.
       Motivul: doar el o mai stie, nici serverul n-o are in clar.
     - "Sterg contul" ii ia randul, monedele si drepturile pe loc; adresa lui
       ramane in Firebase pana o stergi si de acolo (Authentication -> Users).
       Fara rand in lista nu poate face nimic in aplicatie.                 */
function panouConturi(){
 if(!eAdmin()){ ceruteCont('Administrarea conturilor'); return }
 // Panoul se deschide PE LOC, cu ce stim deja. Soldurile le citim doar cand
 // esti chiar in panou (le vede numai adminul) si le punem cand ajung.
 deseneazaPanouConturi(null);
 var F=window.FB;
 Promise.all([F.getDocs(F.collection(F.db,'solduri')),
              F.getDocs(F.collection(F.db,'sesiuni'))])
  .then(function(r){
    SOLDURI={}; SESIUNI={};
    r[0].forEach(function(d){ SOLDURI[d.id]=d.data()||{} });
    r[1].forEach(function(d){ SESIUNI[d.id]=d.data()||{} });
    deseneazaPanouConturi({});
  })
  .catch(function(e){ deseneazaPanouConturi({err:String((e&&e.message)||e)}) });
}

/* Mesajele de la Firebase sunt in engleza si suna a calculator. Le spunem pe
   romaneste, si mai ales spunem ce ai de facut cand e ceva de facut. */
function eroareAuth(e){
  var c=String((e&&e.code)||''), m=String((e&&e.message)||e||'');
  if(c.indexOf('email-already-in-use')>=0)return 'Numele asta e deja luat.';
  if(c.indexOf('weak-password')>=0)return 'Parola trebuie sa aiba cel putin 6 semne.';
  if(c.indexOf('invalid-email')>=0)return 'Numele are semne care nu se pot folosi.';
  if(c.indexOf('user-not-found')>=0||c.indexOf('wrong-password')>=0||
     c.indexOf('invalid-credential')>=0||c.indexOf('invalid-login')>=0)
    return 'Utilizator sau parola gresita.';
  if(c.indexOf('too-many-requests')>=0)return 'Prea multe incercari. Mai asteapta un minut.';
  if(c.indexOf('network-request')>=0)return 'N-ai net.';
  if(c.indexOf('operation-not-allowed')>=0||c.indexOf('configuration-not-found')>=0)
    return 'Intrarea cu parola nu e pornita in Firebase (Authentication → Sign-in method → Email/Password).';
  if(c.indexOf('permission-denied')>=0||m.indexOf('permission')>=0)
    return 'Regulile din consola nu lasa. Vezi WebApp/firestore_reguli.txt.';
  return m||'eroare';
}

/* Contul nou se face pe o A DOUA legatura cu Firebase. La Firebase, "am facut
   un cont" inseamna si "am intrat in el" - pe legatura ta, ai fi fost dat
   afara din contul tau si ai fi ramas logat ca omul caruia tocmai i-ai facut
   cont. Randul din "conturi" il scriem tot de pe legatura TA, ca regulile sa
   vada ca cel care il face e adminul. */
function faceContNou(nume,parola,monede,gata){
  var F=window.FB;
  if(!F){ gata({ok:false,err:'Firebase nu e pornit.'}); return }
  if(!numeValid(nume)){
    gata({ok:false,err:'Numele poate avea doar litere mici, cifre, punct, minus si _ (2-30 semne).'});
    return;
  }
  if(String(parola||'').length<6){
    gata({ok:false,err:'Parola trebuie sa aiba cel putin 6 semne.'});
    return;
  }
  if(conturiActive()[nume]){ gata({ok:false,err:'Ai deja un cont cu numele asta.'}); return }
  var app2=null,auth2=null;
  try{
    app2=F.initializeApp(F.cfg,'creare-'+Date.now());
    auth2=F.getAuth(app2);
  }catch(e){ gata({ok:false,err:eroareAuth(e)}); return }
  F.createUser(auth2,emailDinNume(nume),String(parola))
   .then(function(cred){
     return F.setDoc(F.doc(F.db,'conturi',nume),{
       nume:nume,uid:cred.user.uid,admin:false,moderator:false,cote:true,
       monede:Number(monede)||0,creat:Date.now()
     });
   })
   .then(function(){ try{F.signOut(auth2)}catch(e){} gata({ok:true}) })
   .catch(function(e){
     try{F.signOut(auth2)}catch(x){}
     // Adresa exista in Firebase, dar randul din lista nu - un cont ramas pe
     // jumatate facut (a cazut netul intre cei doi pasi, sau a fost incercat
     // si intrerupt). Fara iesirea asta, numele ala ar fi ramas de nefolosit
     // pentru totdeauna, fiindca Firebase nu-l lasa creat a doua oara.
     if(String((e&&e.code)||'').indexOf('email-already-in-use')>=0
        && !conturiActive()[nume]){
       gata({ok:false,jumatate:true,err:'Adresa '+emailDinNume(nume)+' exista deja in Firebase, '+
             'dar contul nu are rand in lista.'});
       return;
     }
     gata({ok:false,err:eroareAuth(e)});
   });
}

/* Termina un cont ramas pe jumatate: scrie doar randul din lista. Parola
   ramane cea cu care a fost facuta adresa - noi n-o stim si n-avem cum s-o
   schimbam. Uid-ul si-l completeaza singur, la prima lui intrare. */
function terminaContJumatate(nume,monede,gata){
  var F=window.FB;
  F.setDoc(F.doc(F.db,'conturi',nume),{
    nume:nume,uid:'',admin:false,moderator:false,cote:true,
    monede:Number(monede)||0,creat:Date.now()
  }).then(function(){ gata({ok:true}) })
   .catch(function(e){ gata({ok:false,err:eroareAuth(e)}) });
}

function scrieCont(nume,schimbari,gata){
  var F=window.FB;
  F.updateDoc(F.doc(F.db,'conturi',nume),schimbari)
   .then(function(){ if(gata)gata({ok:true}) })
   .catch(function(e){ if(gata)gata({ok:false,err:eroareAuth(e)}) });
}

var IA_CONT_NOU=null;   // vezi mai jos, la formularul de cont nou
function deseneazaPanouConturi(dTot){
  var seIncarca=(dTot===null);
  // A doua desenare (cea cu soldurile) nu are voie sa deschida iar fereastra
  // daca intre timp ai inchis-o, si nu are voie sa stearga ce ai apucat sa scrii.
  var pastrat={};
  if(!seIncarca){
   if(!document.getElementById('panou-conturi'))return;
   ['nou-user','nou-parola','nou-monede'].forEach(function(id){
    var e=document.getElementById(id); if(e)pastrat[id]=e.value;
   });
  }
  function cateMonede(u){
   if(seIncarca)return '<span class="sub">se incarca...</span>';
   var s=SOLDURI[u];
   if(!s)return '<span class="sub">n-a raportat inca</span>';
   var cand='';
   var d=new Date(Number(s.cand)||0);
   if(!isNaN(d.getTime())&&Number(s.cand)){
    var min=Math.round((Date.now()-d.getTime())/60000);
    cand=min<2?'acum':(min<60?('acum '+min+' min'):
         (min<2880?('acum '+Math.round(min/60)+' h'):d.toLocaleDateString('ro-RO')));
   }
   return '<b class="cont-monede">&#129689; '+Number(s.monede||0).toLocaleString('ro-RO')+'</b>'+
     '<span class="sub"> &middot; '+Number(s.bilete||0)+' bilete'+(cand?' &middot; '+cand:'')+'</span>';
  }
  // cine e conectat in doua locuri deodata
  var sesiuni={},peTelefon={};
  Object.keys(SESIUNI).forEach(function(k){
   var r=SESIUNI[k]||{};
   var u=String(r.nume||'').trim().toLowerCase(), dev=String(r.disp||'');
   if(!u||!dev)return;
   // socotim doar ce s-a miscat in ultimele 12 ore
   if(Date.now()-(Number(r.cand)||0)>12*3600000)return;
   (sesiuni[u]=sesiuni[u]||{})[dev]=1;
   (peTelefon[dev]=peTelefon[dev]||{})[u]=1;
  });
  var dubluri=[];
  Object.keys(sesiuni).forEach(function(u){
   var n=Object.keys(sesiuni[u]).length;
   if(n>1)dubluri.push('<b>'+esc(u)+'</b> e deschis pe '+n+' telefoane');
  });
  Object.keys(peTelefon).forEach(function(dev){
   var us=Object.keys(peTelefon[dev]);
   if(us.length>1)dubluri.push('pe acelasi telefon: <b>'+esc(us.join(', '))+'</b>');
  });

  var lista=Object.keys(conturiActive()).sort();
  var corp='<span id="panou-conturi"></span>';
  if(!seIncarca&&dTot&&dTot.err){
   corp+='<div class="avertisment">&#9888; N-am putut citi soldurile: '+esc(dTot.err)+'</div>';
  }
  if(dubluri.length){
   corp+='<div class="avertisment">&#9888; '+dubluri.join('<br>')+
     '<div class="sub">Din ultimele 12 ore.</div></div>';
  }
  // Cate conturi au cotele deschise - se vede dintr-o privire, fara sa citesti lista.
  var cuCote=0;
  lista.forEach(function(u){ if(COTE_PERMISE[u]!==false)cuCote++ });
  var stare = cuCote===0 ? '<b class="cote-nu">&#128274; Cotele sunt inchise la toti</b>'
            : cuCote===lista.length ? '<b class="cote-da">&#128275; Cotele sunt deschise la toti</b>'
            : '<b class="cote-partial">&#128275; Cote deschise la '+cuCote+' din '+lista.length+' conturi</b>';
  corp+='<div class="cote-stare">'+stare+'</div>';
  corp+='<div class="cote-toate">'+
    '<button class="act-btn" data-cote-toate="da">&#128275; Deschide cotele la toti</button>'+
    '<button class="act-btn" data-cote-toate="nu">&#128274; Inchide cotele la toti</button>'+
    '</div>';
  corp+='<div class="tema-lista">';
  lista.forEach(function(u){
   corp+='<div class="cont-rand"><span><b>'+esc(u)+'</b><br>'+cateMonede(u)+
     '</span>'+
     '<span class="cont-actiuni">'+
       '<button class="cont-cote-btn '+(COTE_PERMISE[u]!==false?'deschis':'inchis')+
         '" data-user="'+esc(u)+'" data-are="'+(COTE_PERMISE[u]!==false?'da':'nu')+'">'+
         (COTE_PERMISE[u]!==false?'&#128275; Cote: DA':'&#128274; Cote: NU')+'</button>'+
       '<button class="cont-monede-btn" data-user="'+esc(u)+'">+ monede</button>'+
       (ADMINI[u]
         ? '<span class="sub">admin</span>'
         : '<button class="cont-sterge" data-user="'+esc(u)+'">Sterge</button>')+
     '</span>'+
     '</div>';
  });
  corp+='</div>';
  corp+='<div class="stitle" style="margin-top:12px">Cont nou</div>'+
   '<input id="nou-user" placeholder="Utilizator" class="mrf-inp" autocapitalize="off" autocomplete="off">'+
   '<input id="nou-parola" placeholder="Parola (cel putin 6 semne)" class="mrf-inp" autocomplete="off">'+
   '<input id="nou-monede" type="number" value="1000" placeholder="Monede" class="mrf-inp">'+
   '<div class="sub" style="margin-top:6px">Litere mici, cifre, punct sau minus. '+
   'Ii spui numele si parola, si intra cu ele de pe telefonul lui.</div>'+
   '<div id="cont-mesaj" class="sub" style="min-height:16px"></div>';
  var p=arataModal({titlu:'Conturi',corp:corp,butoane:[
    {text:'Inchide',valoare:false},{text:'Adauga',principal:true,valoare:'adauga'}]});
  Object.keys(pastrat).forEach(function(id){
   var e=document.getElementById(id); if(e)e.value=pastrat[id];
  });
  /* ACEEASI capcana ca la fereastra de logare, si de aia nu mergea "Adauga":
     apesi butonul, fereastra se inchide, si abia dupa aceea ajunge codul sa
     citeasca ce ai scris - dar campurile nu mai sunt in pagina, deci iesea
     mereu "Lipseste ceva", oricat de corect ai fi scris.
     Copiem ce ai scris cu un ascultator "de captura", care ruleaza inaintea
     inchiderii. Il tinem intr-o variabila afara, fiindca panoul se deseneaza
     de doua ori (o data pe loc, o data cand ajung soldurile) si altfel ar
     ramane ascultatori vechi agatati de pagina. */
  if(IA_CONT_NOU)document.removeEventListener('click',IA_CONT_NOU,true);
  var scrisNou={u:'',p:'',m:''};
  IA_CONT_NOU=function(){
   var a=document.getElementById('nou-user'),
       b=document.getElementById('nou-parola'),
       c=document.getElementById('nou-monede');
   if(a)scrisNou.u=a.value||'';
   if(b)scrisNou.p=b.value||'';
   if(c)scrisNou.m=c.value||'';
  };
  document.addEventListener('click',IA_CONT_NOU,true);
  p.then(function(v){
    if(IA_CONT_NOU){ document.removeEventListener('click',IA_CONT_NOU,true); IA_CONT_NOU=null }
    if(v!=='adauga')return;
    var u=String(scrisNou.u||'').trim().toLowerCase();
    var pa=String(scrisNou.p||'');
    var mo=scrisNou.m;
    if(!u||!pa){ mesaj('Lipseste ceva','<p>Scrie si utilizatorul, si parola.</p>'); return }
    faceContNou(u,pa,parseInt(mo,10)||0,function(j){
     if(j.ok){
      mesaj('Gata','<p>Contul <b>'+esc(u)+'</b> a fost creat.</p>'+
            '<p class="sub">Intra cu numele <b>'+esc(u)+'</b> si parola pe care i-ai dat-o. '+
            'Apare la el pe loc, nu trebuie sa astepte nimic.</p>');
      return;
     }
     if(j.jumatate){
      intreaba('Contul e pe jumatate facut',
        '<p>'+esc(j.err)+'</p>'+
        '<p class="sub">Ii pot scrie randul acum, si contul merge imediat - dar '+
        '<b>parola ramane cea cu care a fost facuta adresa</b>, nu cea scrisa aici. '+
        'Daca n-o mai stii, sterge intai adresa din consola Firebase '+
        '(Authentication &rarr; Users) si fa-l din nou de aici.</p>',
        'Scrie randul').then(function(da){
         if(!da)return;
         terminaContJumatate(u,parseInt(mo,10)||0,function(r){
          if(r.ok)mesaj('Gata','<p>Contul <b>'+esc(u)+'</b> merge acum.</p>'+
                        '<p class="sub">Intra cu parola veche.</p>');
          else mesaj('N-a mers','<p>'+esc(r.err||'eroare')+'</p>');
         });
       });
      return;
     }
     mesaj('N-a mers','<p>'+esc(j.err||'eroare')+'</p>');
    });
   });
  setTimeout(function(){
   // comutarea cotelor, pe un cont sau pe toate
   // redeseneaza butoanele de cote si randul de stare, fara sa reincarce nimic
   function improspateazaCote(){
    var n=0,t=0;
    document.querySelectorAll('.cont-cote-btn').forEach(function(b){
     var u=b.getAttribute('data-user'), are=(COTE_PERMISE[u]!==false);
     b.className='cont-cote-btn '+(are?'deschis':'inchis');
     b.setAttribute('data-are',are?'da':'nu');
     b.innerHTML=are?'&#128275; Cote: DA':'&#128274; Cote: NU';
     t++; if(are)n++;
    });
    var st=document.querySelector('.cote-stare');
    if(st)st.innerHTML = n===0 ? '<b class="cote-nu">&#128274; Cotele sunt inchise la toti</b>'
      : n===t ? '<b class="cote-da">&#128275; Cotele sunt deschise la toti</b>'
      : '<b class="cote-partial">&#128275; Cote deschise la '+n+' din '+t+' conturi</b>';
   }
   function comutaCote(cine,valoare,eticheta){
    var cui=(cine==='*')?Object.keys(conturiActive()):[cine];
    var vrea=(valoare==='da');
    var stricate=[];
    Promise.all(cui.map(function(u){
      return window.FB.updateDoc(window.FB.doc(window.FB.db,'conturi',u),{cote:vrea})
        .catch(function(e){ stricate.push(u+': '+eroareAuth(e)) });
    })).then(function(){
     if(stricate.length){ mesaj('N-a mers tot','<p>'+esc(stricate.join('; '))+'</p>') }
     // Se vede pe loc, chiar in panou: butonul isi schimba starea si scrie sus
     // cate conturi au cotele deschise. Fara fereastra peste fereastra.
     cui.forEach(function(u){ COTE_PERMISE[u]=vrea });
     actualizeazaModInvitat();
     improspateazaCote();
     var m=document.getElementById('cont-mesaj');
     if(m)m.innerHTML='&#10003; '+eticheta+' Se aplica la ei pe loc.';
    });
   }
   document.querySelectorAll('[data-cote-toate]').forEach(function(b){
    b.addEventListener('click',function(){
     var v=b.getAttribute('data-cote-toate');
     comutaCote('*',v,v==='da'?'Toata lumea vede cotele.':'Nimeni nu mai vede cotele, doar procentele.');
    });
   });
   document.querySelectorAll('.cont-cote-btn').forEach(function(b){
    b.addEventListener('click',function(){
     var u=b.getAttribute('data-user');
     var nou=b.getAttribute('data-are')==='da'?'nu':'da';
     comutaCote(u,nou,nou==='da'?('<b>'+esc(u)+'</b> vede cotele.')
                                :('<b>'+esc(u)+'</b> vede doar procentele.'));
    });
   });

   // darea de monede. Campul "monede" din cont e TOTALUL dat vreodata, iar
   // telefonul lui adauga doar diferenta - exact ca inainte, cand era coloana
   // din foaia Google.
   document.querySelectorAll('.cont-monede-btn').forEach(function(b){
    b.addEventListener('click',function(){
     var u=b.getAttribute('data-user');
     var scris={s:''};
     function ia(){var c=document.getElementById('cate-monede');if(c)scris.s=c.value||''}
     document.addEventListener('click',ia,true);
     arataModal({titlu:'Monede pentru '+esc(u),
       corp:'<p class="sub">Scrie cate monede ii dai. Cu minus in fata, i le iei.</p>'+
            '<input id="cate-monede" type="number" value="1000" class="mrf-inp">',
       butoane:[{text:'Renunt',valoare:false},{text:'Dau',principal:true,valoare:'ok'}]})
      .then(function(v){
       document.removeEventListener('click',ia,true);
       if(v!=='ok')return;
       var suma=parseInt(scris.s,10);
       if(!suma){ mesaj('Nimic de dat','<p>Scrie un numar diferit de zero.</p>'); return }
       var total=Number((conturiActive()[u]||{}).monede||0)+suma;
       scrieCont(u,{monede:total},function(j){
        if(j.ok){
         mesaj('Gata','<p>I-ai dat lui <b>'+esc(u)+'</b> <b>'+suma+'</b> monede.</p>'+
               '<p class="sub">Le primeste pe loc, daca are aplicatia deschisa; '+
               'altfel, cand o deschide.</p>');
        } else mesaj('N-a mers','<p>'+esc(j.err||'eroare')+'</p>');
       });
      });
     setTimeout(function(){var c=document.getElementById('cate-monede');if(c){c.focus();c.select()}},60);
    });
   });

   // stergerea, cu intrebare inainte
   document.querySelectorAll('.cont-sterge').forEach(function(b){
    b.addEventListener('click',function(){
     var u=b.getAttribute('data-user');
     arataModal({titlu:'Stergi contul?',
       corp:'<p>Contul <b>'+esc(u)+'</b> nu mai are cote, monede si nu mai poate '+
            'scrie nicaieri, din clipa asta.</p>'+
            '<p class="sub">Adresa lui ramane in Firebase pana o stergi de acolo '+
            '(Authentication &rarr; Users). Fara randul din lista, nu-i foloseste la nimic.</p>',
       butoane:[{text:'Nu',valoare:false},{text:'Sterg',principal:true,valoare:true}]})
      .then(function(da){
       if(!da)return;
       var F=window.FB;
       F.deleteDoc(F.doc(F.db,'conturi',u))
        .then(function(){ F.deleteDoc(F.doc(F.db,'solduri',u)).catch(function(){}) })
        .then(function(){ mesaj('Gata','<p>Contul a fost sters.</p>') })
        .catch(function(e){ mesaj('N-a mers','<p>'+esc(eroareAuth(e))+'</p>') });
      });
    });
   });
  },60);
}
