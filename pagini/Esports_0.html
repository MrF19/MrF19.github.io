<head>

<title>MRF</title>
<style>
:root{--bg:#2A070E;--card:#3A0C18;--card2:#1D0509;--border:#5C2230;--red:#C41E3A;--green2:#C41E3A;--text:#F5EDEF;--muted:#C79AA8;--green:#22C55E;--yellow:#C41E3A;--r:12px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:rgba(30,41,59,.97);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 12px}
.h-row{display:flex;align-items:center;gap:8px;padding:9px 0;flex-wrap:wrap}
.h-logo{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#C41E3A,#C41E3A);display:flex;align-items:center;justify-content:center;font-size:15px}
.h-title{font-size:14px;font-weight:700}.h-sub{font-size:10px;color:var(--muted)}
.srch{position:relative;flex:1;max-width:160px}
.srch input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);padding:6px 8px 6px 26px;font-size:12px;outline:none}
.si{position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)}
.lg-sel{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);padding:6px 7px;font-size:11px;max-width:130px}
.tabs{display:flex;gap:1px;overflow-x:auto}
.tab{padding:7px 12px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted);border:none;background:transparent;border-bottom:2px solid transparent}
.tab.active{color:var(--text);border-bottom-color:var(--green2)}
.tcnt{background:var(--border);border-radius:99px;font-size:9px;padding:1px 5px;margin-left:4px}
.tab.active .tcnt{background:var(--green2);color:#111}
main{padding:12px;max-width:820px;margin:0 auto}
.tc{display:none}.tc.active{display:block}
.badge{display:inline-flex;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700}
.b-liga{background:rgba(196,30,58,.2);color:#7DD3FC;border:1px solid rgba(196,30,58,.35)}
.b-high{background:rgba(34,197,94,.2);color:#86EFAC}.b-med{background:rgba(196,30,58,.2);color:#E8A0B0}.b-low{background:rgba(239,68,68,.2);color:#FCA5A5}
.b-rank{background:rgba(196,30,58,.15);color:#E8A0B0;border:1px solid rgba(196,30,58,.3)}
.sbar{display:flex;gap:8px;padding:8px 0 5px;overflow-x:auto}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:7px 12px;text-align:center;flex-shrink:0}
.sc-v{font-size:17px;font-weight:800}.sc-l{font-size:9px;color:var(--muted)}
.liga-grup{margin-bottom:8px}
.liga-cap{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card2);
 border:1px solid var(--border);border-radius:10px;cursor:pointer;user-select:none}
.liga-cap:hover{border-color:var(--red)}
.liga-cap.liga-fav{background:linear-gradient(135deg,rgba(250,204,21,.18),rgba(250,204,21,.04));border-color:rgba(250,204,21,.45)}
.liga-sageata{color:var(--muted);font-size:11px;width:10px}
.liga-stea{color:var(--muted);font-size:13px;cursor:pointer;line-height:1;padding:0 2px}
.liga-stea:hover,.liga-stea.activa{color:#FACC15}
.liga-nume{flex:1;font-size:12px;font-weight:700}
.liga-nr{font-size:10px;color:var(--muted);background:var(--card);border-radius:20px;padding:2px 8px}
.liga-corp{padding-top:8px}
.g-info{min-height:0;font-size:11.5px;font-weight:700;color:var(--text);text-align:center;
  padding:0 8px;margin-top:6px;border-radius:8px;transition:min-height .15s,padding .15s}
.g-info.plin{min-height:26px;line-height:26px;background:var(--card2,rgba(0,0,0,.2))}
.g-tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.g-tap.g-ales{fill:rgba(255,255,255,.14)}
.g-bo{min-height:30px}
.g-bo-t{height:16px}
@media (max-width:520px){
  .g-titlu{font-size:14px}
  .g-explic{font-size:11.5px}
  .g-bo-e{flex:0 0 40%;font-size:11.5px}
  .g-bo-v{font-size:11.5px;min-width:66px}
  .g-legenda{gap:12px}
  .g-leg{font-size:11px}
  .g-leg i{width:11px;height:11px}
  .g-card{padding:14px 12px 16px}
}
.g-verdict{font-size:12.5px;font-weight:700;line-height:1.45;padding:9px 11px;margin:2px 0 10px;
  border-radius:9px;border-left:3px solid var(--muted);background:var(--card2,rgba(0,0,0,.18))}
.g-verdict.bun{border-left-color:#22C55E}
.g-verdict.rau{border-left-color:#EF4444}
.g-verdict.normal{border-left-color:#F59E0B}
.g-scurt{border-color:var(--red)}
.g-lista-scurt{margin:4px 0 0;padding-left:18px}
.g-lista-scurt li{font-size:12.5px;line-height:1.6;color:var(--text);margin-bottom:5px}
.g-lista{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.g-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 12px 14px}
.g-titlu{font-size:13px;font-weight:800;color:var(--text);margin-bottom:3px}
.g-explic{font-size:10.5px;color:var(--muted);line-height:1.45;margin-bottom:9px}
.g-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.nota-grup{background:var(--card);border:1px solid var(--border);border-radius:10px;
 margin-bottom:6px;overflow:hidden}
.nota-grup>summary{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;
 list-style:none;font-size:12px}
.nota-grup>summary::-webkit-details-marker{display:none}
.nota-b{font-weight:800;font-size:12.5px;min-width:42px}
.pp-rand{display:flex;align-items:center;gap:9px;background:var(--card);
 border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:12px}
.pp-nume{min-width:118px;font-weight:700}
.pp-bara{flex:1;height:7px;background:var(--card2);border-radius:99px;overflow:hidden;min-width:40px}
.pp-bara>div{height:100%;border-radius:99px}
.pp-pct{font-size:12px;min-width:38px;text-align:right}
.pp-n{font-size:10px;color:var(--muted);min-width:52px;text-align:right}
.nota-meci{display:flex;align-items:center;gap:7px;padding:5px 12px;font-size:11px;
 border-top:1px solid rgba(255,255,255,.05)}
.nm-semn{flex:0 0 auto}
.nm-ech{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm-pick{color:var(--muted);flex:0 0 auto;max-width:34%;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.nm-scor{color:var(--muted);flex:0 0 auto;min-width:38px;text-align:right}
.badge.b-nota{background:transparent;border:1px solid;font-weight:800;letter-spacing:.02em}
.g-nota{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.4}
.g-legenda{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:7px}
.g-leg{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.g-leg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.g-bo{display:flex;align-items:center;gap:8px;margin:5px 0}
.g-bo-e{flex:0 0 34%;font-size:10.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-bo-t{flex:1;height:13px;background:var(--card2,rgba(0,0,0,.25));border-radius:7px;overflow:hidden}
.g-bo-t i{display:block;height:100%;border-radius:7px;transition:width .4s ease}
.g-bo-v{flex:0 0 auto;font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--text);min-width:74px;text-align:right}
.nf-rand{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.nf-b{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text);
  font-size:11px;padding:5px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.nf-b span{font-size:10px;color:var(--muted)}
.nf-b.activ{background:var(--card);box-shadow:0 0 0 1px var(--border) inset}
.nf-b:hover{border-color:var(--red)}
.mc{background:var(--card);border-radius:var(--r);border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
.mc-head{padding:8px 12px 5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mc-time{margin-left:auto;font-size:10px;color:var(--muted)}
.mc-teams{padding:8px 12px;display:flex;align-items:center;gap:8px}
.ts{display:flex;align-items:center;gap:6px;flex:1;min-width:0}.ts.r{flex-direction:row-reverse}
.tn{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.vs{font-size:10px;color:var(--muted);font-weight:600;flex-shrink:0}
.mc-probs{padding:6px 12px;display:flex;gap:4px}
.pc{flex:1;background:var(--card2);border-radius:7px;padding:5px;text-align:center;cursor:pointer;border:1px solid transparent}
.pc:hover{border-color:var(--muted)}
.pc.picked{border-color:var(--red);background:rgba(196,30,58,.2)}

.mc-pred{padding:4px 12px 8px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.btn-det{background:rgba(196,30,58,.12);border:1px solid rgba(196,30,58,.3);color:#E8A0B0;padding:4px 10px;border-radius:5px;font-size:10px;font-weight:600;cursor:pointer;margin:0 12px 10px}
.etable{width:100%;border-collapse:collapse;font-size:11px}
.etable th{background:var(--card2);padding:6px 8px;text-align:left;font-size:10px;color:var(--muted);border-bottom:1px solid var(--border)}
.etable td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.04)}
.ev-ok{color:var(--green);font-weight:700}.ev-err{color:#EF4444;font-weight:700}
#mov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;display:none;align-items:flex-end;justify-content:center}
#mov.open{display:flex}
#modal{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:14px 13px 36px}
.mh{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 12px}
.m-close{float:right;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.m-title{font-size:16px;font-weight:800}.m-sub{font-size:11px;color:var(--muted);margin-bottom:10px}
.stitle{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px}
.sbox{background:linear-gradient(135deg,rgba(196,30,58,.12),rgba(196,30,58,.12));border:1px solid rgba(196,30,58,.25);border-radius:var(--r);padding:12px;text-align:center;margin-bottom:8px}
.sbox-sc{font-size:22px;font-weight:800}.sbox-sub{font-size:11px;color:var(--muted);margin-top:3px}
.piata-btn.picked{border-color:var(--red)!important;background:rgba(196,30,58,.2)!important}
.fr{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.fr-d{font-size:10px;color:var(--muted);width:64px;flex-shrink:0}.fr-m{font-size:11px;flex:1}

.rw{background:rgba(34,197,94,.3);color:#86EFAC}.rl{background:rgba(239,68,68,.3);color:#FCA5A5}
.hr{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px}
.hd{width:64px;color:var(--muted);font-size:10px}.ht{flex:1}.hs{font-weight:700}
.bilet-row{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:8px 10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;margin:4px 4px 4px 0}
.btn.primary{background:linear-gradient(90deg,#C41E3A,#C41E3A);border:none;color:#111}
</style>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fT(s){if(!s)return'';try{return new Date(s).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Bucharest'})}catch(e){return String(s).substring(11,16)}}

/* Nota meciului, pe card ─────────────────────────────────────────────────
   Aceeasi nota care sta in spatele filtrelor 1-10 si al sectiunii "Cum au
   iesit, pe fiecare nota" din Evaluare - deci ce scrie aici se potriveste cu
   ce arata acolo. Culoarea e cea din culoareNota: verde de la 8 in sus,
   auriu la 6-7, galben la 4-5, rosu sub.
   La "Ieri" predictia sta in m.pred, nu pe meci, de aia intrebam intai
   notaMeciIeri - altfel cardurile de ieri ar ramane fara nota.            */
function badgeNota(m){
 var n=null;
 try{ n=(m&&m.pred)?notaMeciIeri(m):notaMeci(m) }catch(e){ n=null }
 if(n==null)return '';
 return '<span class="badge b-nota" style="color:'+culoareNota(n)+
        ';border-color:'+culoareNota(n)+'" title="Nota meciului, din cat de des '+
        'a iesit pana acum combinatia asta">'+n+'/10</span>';
}
function badgeConf(p){var conf=parseFloat(p)||0;if(conf>0&&conf<=1)conf*=100;var cls=conf>=80?'b-high':conf>=60?'b-med':'b-low';return '<span class="badge '+cls+'">'+conf.toFixed(0)+'% Conf.</span>'}
function rk(r){return r?'<span class="badge b-rank">#'+r+'</span>':''}

function calibExact(tip,pick,prob,conf){
 var idx=DATA.calib_exact||{};
 var a=idx[tip+'|'+pick+'|'+Math.round(prob)+'|'+(conf!=null?Math.round(conf):'None')];
 return (a&&a.n)?a:null;
}

function gSvg(w,h,inner){
 return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" '+
   'style="width:100%;max-width:'+w+'px;height:auto;display:block;margin:0 auto">'+inner+'</svg>';

function gText(x,y,t,o){
 o=o||{};
 return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-size="'+(o.m||9)+'" fill="'+
   (o.c||'var(--muted)')+'" text-anchor="'+(o.a||'middle')+'">'+t+'</text>';

function gLegenda(serii,extra){
 return '<div class="g-legenda">'+serii.map(function(s){
   return '<span class="g-leg"><i style="background:'+s.culoare+'"></i>'+s.nume+'</span>';
 }).join('')+(extra||'')+'</div>';
}
function gLinii(etichete,serii,o){
 o=o||{};
 var W=Math.max(300,etichete.length*Math.max(14,o.pas||22)),H=o.h||150;
 var st=38,dr=8,sus=10,jos=26;
 var min=(o.min!=null)?o.min:0,max=(o.max!=null)?o.max:100;
 function X(i){return st+(etichete.length<2?(W-st-dr)/2:i*(W-st-dr)/(etichete.length-1))}
 function Y(v){return sus+(1-(v-min)/(max-min))*(H-sus-jos)}
 var g='';
 (o.linii||[0,25,50,75,100]).forEach(function(v){
  if(v<min||v>max)return;
  g+='<line x1="'+st+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-dr)+'" y2="'+Y(v).toFixed(1)+
     '" stroke="var(--border)" stroke-width="1" opacity=".5"/>'+gText(st-5,Y(v)+3,v+(o.unit||'%'),{a:'end',m:8});
 });
 serii.forEach(function(s){
  var d='',pct='';
  s.puncte.forEach(function(v,i){
   if(v==null)return;
   d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';
   var info=s.nume+' '+etichete[i]+': '+v+(o.unit||'%');
   pct+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3" fill="'+s.culoare+'"/>'+
        // cerc invizibil mult mai mare: cu degetul nu nimeresti un punct de 3px
        '<circle class="g-tap" cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="13" '+
        'fill="transparent" data-info="'+esc(info)+'"><title>'+esc(info)+'</title></circle>';
  });
  g+='<path d="'+d+'" fill="none" stroke="'+s.culoare+'" stroke-width="2" stroke-linejoin="round"/>'+pct;
 });
 var pasE=Math.ceil(etichete.length/8);
 etichete.forEach(function(e,i){if(i%pasE)return;g+=gText(X(i),H-8,e,{m:8})});
 return '<div class="g-scroll">'+gSvg(W,H,g)+'</div>'+gLegenda(serii);
}
function gBareOriz(items,o){
 o=o||{};
 var max=o.max||Math.max.apply(null,items.map(function(x){return x.valoare}))||1;
 return items.map(function(x){
  var lat=Math.max(1,x.valoare/max*100);
  return '<div class="g-bo"><span class="g-bo-e" title="'+esc(x.eticheta)+'">'+esc(x.eticheta)+'</span>'+
    '<span class="g-bo-t"><i style="width:'+lat.toFixed(1)+'%;background:'+(x.culoare||CG.albastru)+'"></i></span>'+
    '<b class="g-bo-v">'+x.text+'</b></div>';
 }).join('');
}
function gBareGrup(categorii,serii,o){
 o=o||{};
 var W=Math.max(300,categorii.length*(serii.length*15+22)),H=o.h||140;
 var st=34,dr=8,sus=12,jos=24;
 var max=o.max||Math.max(1,Math.max.apply(null,serii.reduce(function(a,s){return a.concat(s.valori)},[])));
 var latGrup=(W-st-dr)/categorii.length,latBara=Math.min(18,(latGrup-6)/serii.length);
 var g='';
 [0,.25,.5,.75,1].forEach(function(f){
  var y=sus+(1-f)*(H-sus-jos);
  g+='<line x1="'+st+'" y1="'+y.toFixed(1)+'" x2="'+(W-dr)+'" y2="'+y.toFixed(1)+
     '" stroke="var(--border)" stroke-width="1" opacity=".5"/>'+
     gText(st-5,y+3,Math.round(max*f)+(o.unit||''),{a:'end',m:8});
 });
 categorii.forEach(function(c,i){
  serii.forEach(function(s,j){
   var v=s.valori[i]||0,inalt=Math.max(v>0?2:0,v/max*(H-sus-jos));
   var x=st+i*latGrup+(latGrup-latBara*serii.length)/2+j*latBara;
   var infoB=s.nume+' - '+c+': '+v+(o.unit||'');
   // bara desenata + o zona de atins pe toata inaltimea graficului, ca sa
   // poti apasa si cand bara e mica de tot
   g+='<rect x="'+x.toFixed(1)+'" y="'+(H-jos-inalt).toFixed(1)+'" width="'+(latBara-2).toFixed(1)+
      '" height="'+inalt.toFixed(1)+'" rx="2" fill="'+s.culoare+'"/>'+
      '<rect class="g-tap" x="'+(x-1).toFixed(1)+'" y="'+sus+'" width="'+(latBara).toFixed(1)+
      '" height="'+(H-jos-sus).toFixed(1)+'" fill="transparent" data-info="'+esc(infoB)+
      '"><title>'+esc(infoB)+'</title></rect>';
  });
  g+=gText(st+i*latGrup+latGrup/2,H-8,c,{m:8});
 });
 return '<div class="g-scroll">'+gSvg(W,H,g)+'</div>'+gLegenda(serii);
}
function gCalibrare(serii){
 var W=280,H=230,st=34,dr=10,sus=10,jos=28;
 function X(v){return st+v/100*(W-st-dr)}
 function Y(v){return sus+(1-v/100)*(H-sus-jos)}
 var g='';
 [0,25,50,75,100].forEach(function(v){
  g+='<line x1="'+X(v).toFixed(1)+'" y1="'+sus+'" x2="'+X(v).toFixed(1)+'" y2="'+(H-jos)+
     '" stroke="var(--border)" stroke-width="1" opacity=".4"/>';
  g+='<line x1="'+st+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-dr)+'" y2="'+Y(v).toFixed(1)+
     '" stroke="var(--border)" stroke-width="1" opacity=".4"/>';
  g+=gText(st-4,Y(v)+3,v,{a:'end',m:8})+gText(X(v),H-12,v,{m:8});
 });
 g+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(100)+'" y2="'+Y(100)+
    '" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".8"/>';
 serii.forEach(function(s){
  var d='',pct='';
  (s.puncte||[]).forEach(function(p){
   d+=(d?'L':'M')+X(p.prezis).toFixed(1)+' '+Y(p.real).toFixed(1)+' ';
   var r=Math.max(2.5,Math.min(7,Math.sqrt(p.n)/6));
   var infoC=s.nume+': a zis '+p.prezis+'%, a iesit '+p.real+'% (din '+p.n+' meciuri)';
   pct+='<circle cx="'+X(p.prezis).toFixed(1)+'" cy="'+Y(p.real).toFixed(1)+'" r="'+r.toFixed(1)+
        '" fill="'+s.culoare+'" fill-opacity=".85"/>'+
        '<circle class="g-tap" cx="'+X(p.prezis).toFixed(1)+'" cy="'+Y(p.real).toFixed(1)+
        '" r="14" fill="transparent" data-info="'+esc(infoC)+'"><title>'+esc(infoC)+'</title></circle>';
  });
  if(d)g+='<path d="'+d+'" fill="none" stroke="'+s.culoare+'" stroke-width="2"/>'+pct;
 });
 g+=gText(st+(W-st-dr)/2,H-1,'cat a promis (%)',{m:8});
 return '<div class="g-scroll">'+gSvg(W,H,g)+'</div>'+
   gLegenda(serii,'<span class="g-leg"><i style="background:var(--muted)"></i>perfect</span>');
}


/* ── Cum au iesit, pe fiecare nota ─────────────────────────────────────────
   Nota unui meci o da acelasi cod care o pune si pe butoanele de filtrare
   (celMaiBunPick + notaDinRata), deci cifrele de aici sunt exact alea, nu o
   socoteala paralela care ar putea sa nu se potriveasca.

   "A iesit" se ia de pe piata pe care s-a dat nota: daca nota a venit din
   castigator, ne uitam la hit_winner; daca a venit din total, la hit_ou.
   Meciurile fara rezultat pe piata aia nu se numara deloc - altfel ar iesi
   procente false.                                                           */
function stelutaEval(m){
 if(!m)return null;
 var b=celMaiBunPick({home:m.home,away:m.away,castigator:m.castigator_prezis,
                      p_castigator:m.p_castigator,p_over:m.p_over});
 if(!b)return null;
 var hit=null,pick='';
 if(b.tip==='WIN'){
  hit=(m.hit_winner!=null)?(Number(m.hit_winner)===1):null;
  pick=String(m.castigator_prezis||'castigator');
 }else{
  hit=(m.hit_ou!=null)?(Number(m.hit_ou)===1):null;
  pick='Peste'+(m.linie_ou!=null?(' '+m.linie_ou):'');
 }
 if(hit===null)return null;
 return {nota:notaDinRata(b.L),tip:b.tip,pick:pick,hit:hit,prob:b.prob,m:m};
}
function scorEval(m){
 return String(m.scor_real||m.scor_seturi_real||
        ((m.total_real!=null)?('total '+m.total_real):''));
}
function peNotaHtml(data){
 var pe={};
 (data||[]).forEach(function(m){
  var s=stelutaEval(m);
  if(!s)return;
  if(!pe[s.nota])pe[s.nota]={n:0,ok:0,lista:[]};
  pe[s.nota].n++;
  if(s.hit)pe[s.nota].ok++;
  pe[s.nota].lista.push(s);
 });
 var note=Object.keys(pe).map(Number).sort(function(a,b){return b-a});
 if(!note.length)return '';
 var h='<div class="stitle" style="margin-top:14px">&#127919; Cum au iesit, pe fiecare nota</div>'+
   '<div style="font-size:9.5px;color:var(--muted);margin-bottom:10px">'+
   'Nota 10 ar trebui sa iasa mai des decat nota 5. Apasa pe o nota ca sa vezi meciurile.</div>';
 note.forEach(function(nt){
  var r=pe[nt],pct=Math.round(r.ok/r.n*100),col=culoareNota(nt);
  var promis=0,cate=0;
  r.lista.forEach(function(x){ if(x.prob>0){promis+=x.prob;cate++} });
  promis=cate?Math.round(promis/cate):0;
  h+='<details class="nota-grup"><summary>'+
     '<span class="nota-b" style="color:'+col+'">'+nt+'/10</span>'+
     '<div class="pp-bara"><div style="width:'+pct+'%;background:'+col+'"></div></div>'+
     '<b class="pp-pct" style="color:'+col+'">'+pct+'%</b>'+
     '<span class="pp-n">'+r.ok+'/'+r.n+
     (promis?' &middot; a zis '+promis+'%':'')+'</span></summary>';
  r.lista.slice(0,120).forEach(function(s){
   h+='<div class="nota-meci">'+
      '<span class="nm-semn">'+(s.hit?'<span style="color:var(--green)">&#10003;</span>'
                                     :'<span style="color:#EF4444">&#10007;</span>')+'</span>'+
      '<span class="nm-ech">'+esc(s.m.home||'')+' - '+esc(s.m.away||'')+'</span>'+
      '<span class="nm-pick">'+esc(s.pick)+
        ((s.prob>0)?' <b style="color:'+(s.hit?'var(--green)':'#EF4444')+'">'+
          Math.round(s.prob)+'%</b>':'')+'</span>'+
      '<span class="nm-scor">'+esc(scorEval(s.m))+'</span></div>';
  });
  if(r.lista.length>120)h+='<div class="nota-meci"><span class="nm-ech" '+
     'style="color:var(--muted)">... si inca '+(r.lista.length-120)+' meciuri</span></div>';
  h+='</details>';
 });
 return h;
}
/* Pe ce pronostic: la ce se pricepe si la ce nu. Grupam dupa ce am zis noi
   (castigatorul, sau Peste/Sub), nu dupa piata in general. */
function pePronosticHtml(data){
 var g={};
 (data||[]).forEach(function(m){
  var s=stelutaEval(m);
  if(!s)return;
  var cheie=(s.tip==='WIN')
    ?((String(m.castigator_prezis||'')===String(m.home||''))?'Castiga gazda':'Castiga oaspetele')
    :'Peste linia de total';
  if(!g[cheie])g[cheie]={n:0,ok:0};
  g[cheie].n++;
  if(s.hit)g[cheie].ok++;
 });
 var chei=Object.keys(g).filter(function(k){return g[k].n>=10});
 if(!chei.length)return '';
 chei.sort(function(a,b){return g[b].ok/g[b].n-g[a].ok/g[a].n});
 var h='<div class="stitle" style="margin-top:14px">&#128202; Pe ce pronostic</div>'+
   '<div style="font-size:9.5px;color:var(--muted);margin-bottom:10px">'+
   'Din cate a dat fiecare fel de pronostic, cate au iesit. Sub 10 cazuri nu aratam nimic.</div>';
 chei.forEach(function(k){
  var r=g[k],pct=Math.round(r.ok/r.n*100);
  var col=pct>=60?'var(--green)':(pct>=50?'#E4B363':'#EF4444');
  h+='<div class="pp-rand"><span class="pp-nume">'+esc(k)+'</span>'+
     '<div class="pp-bara"><div style="width:'+pct+'%;background:'+col+'"></div></div>'+
     '<b class="pp-pct" style="color:'+col+'">'+pct+'%</b>'+
     '<span class="pp-n">'+r.ok+'/'+r.n+'</span></div>';
 });
 return h;
}
function renderGraficeEvaluare(){
 var G=(DATA&&DATA.eval_grafice)||{};
 if(!G.n)return '<div style="text-align:center;color:var(--muted);padding:30px">'+
   'Inca n-avem destule meciuri verificate pentru grafice.</div>';
 var h='<div class="g-lista">';
 function proc(x){return x.toFixed(1).replace('.0','')+'%'}
 function mii(x){return Number(x).toLocaleString('ro-RO')}

 h+=peNotaHtml(DATA.evaluare||[]);
 h+=pePronosticHtml(DATA.evaluare||[]);

 /* ── PE SCURT: raspunsul in cateva propozitii, inaintea oricarui grafic ── */
 (function(){
  var p=(G.pe_piata||[]).slice().sort(function(a,b){return b.ok/b.n-a.ok/a.n});
  if(!p.length)return;
  var best=p[0],worst=p[p.length-1],linii=[];
  linii.push('Am verificat <b>'+mii(G.n)+' de meciuri</b> deja jucate, ca sa vedem cat de des a avut dreptate.');
  linii.push('Cel mai bine se descurca la <b>'+esc(best.nume)+'</b>: nimereste '+proc(best.ok/best.n*100)+' din cazuri.');
  if(worst!==best)linii.push('Cel mai prost la <b>'+esc(worst.nume)+'</b>, doar '+proc(worst.ok/worst.n*100)+
    (worst.ok/worst.n<0.35?' - acolo chiar nu te baza pe el.':'.'));
  var cal=(G.calibrare||{}).Castigator||[];
  var sus=cal.filter(function(c){return c.prezis>=60});
  if(sus.length){
   var dp=sus.reduce(function(a,c){return a+c.prezis*c.n},0)/sus.reduce(function(a,c){return a+c.n},0);
   var dr=sus.reduce(function(a,c){return a+c.real*c.n},0)/sus.reduce(function(a,c){return a+c.n},0);
   linii.push('La meciurile unde a dat peste 60% sanse, a promis in medie <b>'+proc(dp)+
     '</b> si chiar s-a intamplat in <b>'+proc(dr)+'</b> din cazuri'+
     (dr>=dp+3?' - deci e mai bun decat spune.':(dr<dp-3?' - deci se lauda mai mult decat poate.':' - adica exact cat promite.')));
  }
  h+='<div class="g-card g-scurt"><div class="g-titlu">&#128173; Pe scurt</div>'+
     '<ul class="g-lista-scurt"><li>'+linii.join('</li><li>')+'</li></ul></div>';
 })();

 if((G.pe_piata||[]).length){
  var srt=G.pe_piata.slice().sort(function(a,b){return b.ok/b.n-a.ok/a.n});
  h+=gCard('&#127919; Pe ce se pricepe',
    'Din '+mii(G.n)+' de meciuri jucate: de cate ori a nimerit, pe fiecare tip de pariu.',
    gBareOriz(G.pe_piata.map(function(p){
      var r=p.ok/p.n*100;
      return {eticheta:p.nume,valoare:r,text:r.toFixed(1)+'%',
              culoare:r>=60?CG.verde:(r>=45?CG.portocaliu:CG.rosu)};
    }),{max:100})+
    '<div class="g-nota">Ca sa ai cu ce compara: daca ai ghici la intamplare, ai nimeri in jur '+
    'de 50% la castigator si la Peste/Sub. Tot ce e peste asta inseamna ca stie ceva.</div>',
    {text:'Cel mai bun la '+esc(srt[0].nume)+' ('+proc(srt[0].ok/srt[0].n*100)+'), cel mai slab la '+
          esc(srt[srt.length-1].nume)+' ('+proc(srt[srt.length-1].ok/srt[srt.length-1].n*100)+')',fel:'bun'});
 }

 var cal=G.calibrare||{},sc=[];
 if((cal.Castigator||[]).length)sc.push({nume:'Castigator',culoare:CG.albastru,puncte:cal.Castigator});
 if((cal['Peste / Sub']||[]).length)sc.push({nume:'Peste / Sub',culoare:CG.portocaliu,puncte:cal['Peste / Sub']});
 if(sc.length){
  var c1=cal.Castigator||[],dif=0,tot=0;
  c1.forEach(function(c){dif+=(c.real-c.prezis)*c.n;tot+=c.n});
  var med=tot?dif/tot:0;
  var verdict= med>3?{text:'Procentele sunt de incredere - ba chiar modeste: in medie iese cu '+proc(med)+' mai des decat scrie',fel:'bun'}
             : med<-3?{text:'Atentie: promite cu '+proc(-med)+' mai mult decat iese in realitate',fel:'rau'}
             : {text:'Procentele sunt corecte - cat scrie, atat iese',fel:'bun'};
  var ex=c1.filter(function(c){return c.prezis>=60&&c.prezis<80})[0]||c1[c1.length-1];
  h+=gCard('&#127919; Poti sa crezi procentele?',
    ex?('Exemplu din datele reale: la meciurile unde a scris <b>'+proc(ex.prezis)+'</b> sanse, '+
        'chiar s-a intamplat in <b>'+proc(ex.real)+'</b> din cazuri (din '+mii(ex.n)+' de meciuri).'):'',
    gCalibrare(sc)+
    '<div class="g-nota">Cum se citeste: fiecare bulina e un grup de meciuri. Pe orizontala, cat a '+
    'promis. Pe verticala, cat a iesit. Daca bulina sta PE linia punctata, a promis exact cat trebuia. '+
    'Deasupra liniei = a iesit mai des decat a spus. Sub linie = s-a laudat.</div>',verdict);
 }

 if((G.pe_zi||[]).length>2){
  var zile=G.pe_zi.map(function(d){return d.z.substring(8,10)+'.'+d.z.substring(5,7)});
  var rate=G.pe_zi.map(function(d){return d.nw?d.hw/d.nw*100:null}).filter(function(x){return x!=null});
  var mediaZ=rate.reduce(function(a,x){return a+x},0)/rate.length;
  // doar zilele cu destule meciuri intra in "intre X si Y" - o zi cu doua
  // meciuri poate iesi 0% sau 100% din intamplare si strica intervalul
  var rateS=G.pe_zi.filter(function(d){return d.nw>=8}).map(function(d){return d.hw/d.nw*100});
  if(rateS.length<3)rateS=rate;
  var mn=Math.min.apply(null,rateS),mx=Math.max.apply(null,rateS);
  h+=gCard('&#128197; Cum a mers zi de zi',
    'Cat de des a nimerit castigatorul, in fiecare din ultimele '+G.pe_zi.length+' zile.',
    gLinii(zile,[
      {nume:'Castigator',culoare:CG.albastru,puncte:G.pe_zi.map(function(d){return d.nw?+(d.hw/d.nw*100).toFixed(1):null})},
      {nume:'Peste / Sub',culoare:CG.portocaliu,puncte:G.pe_zi.map(function(d){return d.no?+(d.ho/d.no*100).toFixed(1):null})}
    ],{h:160})+
    '<div class="g-nota">Apasa pe orice punct ca sa vezi ziua si cifra exacta. E normal sa sara de la '+
    'o zi la alta - o zi cu putine meciuri poate iesi foarte bine sau foarte prost din intamplare.</div>',
    {text:'In medie '+proc(mediaZ)+' pe zi, intre '+proc(mn)+' si '+proc(mx)+' in functie de zi',
     fel:mediaZ>=55?'bun':'normal'});
 }

 if((G.cumulat||[]).length>2){
  var zc=G.cumulat.map(function(d){return d.z.substring(8,10)+'.'+d.z.substring(5,7)});
  var vals=G.cumulat.map(function(d){return d.rata});
  var mnc=Math.max(0,Math.floor(Math.min.apply(null,vals)-3));
  var mxc=Math.min(100,Math.ceil(Math.max.apply(null,vals)+3));
  var delta=vals[vals.length-1]-vals[0];
  var vd= delta>1.5?{text:'Se imbunatateste: a urcat cu '+proc(delta)+' de la inceputul perioadei',fel:'bun'}
        : delta<-1.5?{text:'A scazut cu '+proc(-delta)+' fata de inceputul perioadei',fel:'rau'}

/* ── NOTA unui meci (1-10) si butoanele de filtrare ────────────────────────
   Aceeasi socoteala ca la Fotbal: pornim de la cate ori a iesit in trecut
   combinatia asta (din calib_exact / calib_bucket), luam marginea de jos a
   intervalului de incredere Wilson - ca 3 din 3 sa nu iasa nota 10 - si o
   traducem in 1..10. Daca n-avem istoric pe combinatie, ne bazam pe procentul
   prezis, tratat ca si cum ar fi doar cateva observatii.                    */
function wilsonJos(hit,n){
 if(!n)return 0;
 var z=1.96,p=hit/n;
 var jos=(p+z*z/(2*n)-z*Math.sqrt((p*(1-p)+z*z/(4*n))/n))/(1+z*z/n);
 return Math.max(0,Math.min(1,jos));
}
function notaDinRata(L){
 var n=Math.round((L-0.30)/0.055)+1;
 return Math.max(1,Math.min(10,n));
}
function culoareNota(n){
 return n>=8?'var(--green)':(n>=6?'#E4B363':(n>=4?'#F59E0B':'#EF4444'));
}
/* Cel mai bun pick al meciului, cu istoricul lui, ca sa-i putem da nota. */
function celMaiBunPick(m){
 if(!m)return null;
 var pFav=(parseFloat(m.p_castigator)||0.5)*100;
 var favHome=(m.castigator===m.home);
 var p1=favHome?pFav:100-pFav;
 var pOver=(parseFloat(m.p_over)||0)*100;
 var lista=[
   {tip:'WIN',pickCalib:'home',prob:p1},
   {tip:'WIN',pickCalib:'away',prob:100-p1},
   {tip:'TOT',pickCalib:'Peste',prob:pOver}
 ];
 var best=null;
 lista.forEach(function(c){
  if(!(c.prob>0))return;
  var real=calibExact(c.tip,c.pickCalib,c.prob,pFav);
  if(!(real&&real.n>=5))real=calibBucket(c.tip,c.pickCalib,c.prob);
  if(!(real&&real.n>=15))real=null;
  var L=real?wilsonJos(real.hit,real.n):wilsonJos(c.prob/100*8,8);
  if(!best||L>best.L)best={tip:c.tip,prob:c.prob,real:real,L:L};
 });
 return best;
}
function notaMeci(m){
 var b=celMaiBunPick(m);
 return b?notaDinRata(b.L):null;
}
/* La Ieri, predictia sta in m.pred (asa vine din arhiva), nu pe meci. */

 if(!m||!m.pred)return null;

   p_castigator:m.pred.p,p_over:m.pred.p_over});
}

// ── Grafic acuratete castigator pe zile (SVG simplu, fara librarii) ──
function renderGraficEval(data){
 if(!data.length)return'';
 var perZi={};
 data.forEach(function(m){
  if(!m.start_time)return;
  var zi=String(m.start_time).substring(0,10);
  if(!perZi[zi])perZi[zi]={tot:0,corect:0};
  perZi[zi].tot++;
  if(m.hit_winner==1||m.hit_winner===true)perZi[zi].corect++;
 });
 var zile=Object.keys(perZi).sort();
 if(zile.length<2)return''; // nu merita grafic pentru 0-1 zile
 zile=zile.slice(-14); // ultimele 14 zile cu date

 var W=Math.max(320,zile.length*38),H=110,padB=22,padT=8;
 var barW=Math.min(28,(W-20)/zile.length-6);
 var maxH=H-padB-padT;
 var bars='',labels='';
 zile.forEach(function(zi,i){
  var d=perZi[zi];
  var pct=d.tot?d.corect/d.tot*100:0;
  var bh=Math.max(2,pct/100*maxH);
  var x=10+i*((W-20)/zile.length);
  var y=H-padB-bh;
  var col=pct>=60?'#22C55E':pct>=40?'#C41E3A':'#EF4444';
  bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="'+col+'"><title>'+zi+': '+Math.round(pct)+'% ('+d.corect+'/'+d.tot+')</title></rect>';
  bars+='<text x="'+(x+barW/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" fill="#C79AA8" text-anchor="middle">'+Math.round(pct)+'%</text>';
  var ziS=zi.substring(8,10)+'.'+zi.substring(5,7);
  labels+='<text x="'+(x+barW/2).toFixed(1)+'" y="'+(H-6).toFixed(1)+'" font-size="8" fill="#8B6670" text-anchor="middle">'+ziS+'</text>';
 });
 var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:'+W+'px;height:'+H+'px;display:block;margin:8px auto">'+bars+labels+'</svg>';
 return '<div class="stitle" style="margin-top:12px">&#128200; Acuratete castigator pe zile (ultimele '+zile.length+')</div>'+
   '<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px;overflow-x:auto">'+svg+'</div>';
}

// ── Breakdown pe interval de incredere (confidence) ──
function renderBreakdownIncredereEval(data){
 if(!data.length)return'';
 var bucket_uri=[
  {min:0,max:0.45,label:'0-45%'},
  {min:0.45,max:0.60,label:'45-60%'},
  {min:0.60,max:0.75,label:'60-75%'},
  {min:0.75,max:1.01,label:'&ge;75%'},
 ];
 var stats=bucket_uri.map(function(){return{tot:0,hW:0}});
 var oricare=false;
 data.forEach(function(m){
  var c=parseFloat(m.p_castigator!=null?m.p_castigator:m.confidence);
  if(isNaN(c))return;
  oricare=true;
  if(c>1)c=c/100;
  var idx=bucket_uri.findIndex(function(b){return c>=b.min&&c<b.max});
  if(idx<0)return;
  stats[idx].tot++;
  if(m.hit_winner==1||m.hit_winner===true)stats[idx].hW++;
 });
 if(!oricare)return'';

 var randuri='';
 for(var i=0;i<bucket_uri.length;i++){
  var s=stats[i];
  if(s.tot===0)continue;
  var pct=Math.round(s.hW/s.tot*100);
  var col=pct>=60?'var(--green)':pct>=45?'var(--yellow)':'#EF4444';
  randuri+='<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--card2);border-radius:7px;margin-bottom:5px">'+
    '<span style="font-size:11px;font-weight:700;flex:0 0 62px">'+bucket_uri[i].label+'</span>'+
    '<div style="flex:1;background:var(--border);border-radius:99px;height:6px;overflow:hidden">'+
      '<div style="width:'+pct+'%;height:100%;background:'+col+'"></div>'+
    '</div>'+
    '<span style="font-size:12px;font-weight:800;color:'+col+';flex:0 0 40px;text-align:right">'+pct+'%</span>'+
    '<span style="font-size:9px;color:var(--muted);flex:0 0 55px;text-align:right">('+s.tot+' m.)</span>'+
  '</div>';
 }
 if(!randuri)return'';
 return '<div class="stitle" style="margin-top:12px">&#127919; Acuratete castigator pe interval de incredere</div>'+
   '<div style="font-size:9px;color:var(--muted);margin-bottom:8px">Raspunde la "cat de bun e modelul CAND e sigur de el" - relevant cand alegi pe ce sa pariezi</div>'+
   randuri;
}

function descarcaDetaliiMeciImagine(m){
 if(!m)return;
 var piete=m.piete||[];
 var byCat={},ordineCat=[];
 piete.forEach(function(p){
  if(!byCat[p.cat]){byCat[p.cat]=[];ordineCat.push(p.cat)}

 });
 var formaH=(DATA.forma[m.home]||[]).slice(0,5);

 var W=720,y=0;
 y+=96; // header
 y+=90; // sbox
 ordineCat.forEach(function(cat){y+=30+byCat[cat].length*26+8});
 [formaH,formaA].forEach(function(arr){y+=22+(arr.length?arr.length*18:16)+20});
 y+=22+(h2h.length?Math.min(h2h.length,8)*16:16)+20;
 y+=40; // footer
 var H=y;

 var SCALE=4;
 var cv=document.createElement('canvas');
 cv.width=W*SCALE;cv.height=H*SCALE;
 var g=cv.getContext('2d');
 g.scale(SCALE,SCALE);
 g.fillStyle='#2A070E';g.fillRect(0,0,W,H);

 var cy=16;
 g.fillStyle='#C79AA8';g.font='11px Arial';
 var subLine=(m.competition||'-')+' - '+fD(m.start_time)+' '+fT(m.start_time)+' | best of '+(m.best_of||3)+' | incredere: '+(m.incredere||'-');
 if(m.rank_home)subLine+=' | #'+m.rank_home+' vs #'+(m.rank_away||'?');

 cy+=26;
 g.fillStyle='#F5EDEF';g.font='bold 20px Arial';
 g.fillText((m.home||'-')+' vs '+(m.away||'-'),20,cy);
 cy+=36;
 g.fillStyle='#3A0C18';g.fillRect(20,cy,W-40,74);

 g.textAlign='center';
 g.fillStyle='#F5EDEF';g.font='bold 22px Arial';
 g.fillText((m.castigator||'-')+' '+(m.scor_seturi||''),W/2,cy+30);

 g.fillStyle='#C79AA8';g.font='10px Arial';g.fillText(subTxt,W/2,cy+52);
 g.textAlign='left';
 cy+=90;
 ordineCat.forEach(function(cat){

  g.fillStyle='#C79AA8';g.font='9px Arial';g.textAlign='right';

  g.textAlign='left';
  cy+=30;
  byCat[cat].forEach(function(p){
   var picked=isPicked(m,p.tip,p.pick);
   g.fillStyle=picked?'#3a1520':'#3A0C18';
   g.fillRect(20,cy,W-40,22);
   if(picked){g.strokeStyle='#C41E3A';g.strokeRect(20,cy,W-40,22)}
   g.fillStyle='#F5EDEF';g.font='11px Arial';
   g.fillText(p.pick,32,cy+15);
   var col=p.prob>=60?'#22C55E':p.prob>=40?'#C41E3A':'#EF4444';
   g.fillStyle=col;g.font='bold 11px Arial';g.textAlign='right';
   g.fillText(p.prob.toFixed(0)+'%'+(p.cota?' @'+p.cota.toFixed(2):''),W-28,cy+15);
   g.textAlign='left';
   cy+=26;
  });
  cy+=8;
 });
 [[m.home,formaH],[m.away,formaA]].forEach(function(pair){
  var pl=pair[0],ms=pair[1];
  g.fillStyle='#C79AA8';g.font='bold 10px Arial';

   g.fillStyle='#8B6670';g.font='10px Arial';g.fillText('Nicio data',20,cy);
   cy+=18;
  }else{
   var w=0,l=0;
   ms.forEach(function(x){
    var ih=(x.hT||'')===pl;
    var win=ih?(x.hs>x.as_):(x.as_>x.hs);
    if(win)w++;else l++;
    g.fillStyle='#8B6670';g.font='9px Arial';g.fillText(fD(x.dt),20,cy);
    g.fillStyle='#F5EDEF';g.font='10px Arial';
    g.fillText((x.hT||'-')+' '+x.hs+'-'+x.as_+' '+(x.aT||'-'),90,cy);
    g.fillStyle=win?'#22C55E':'#EF4444';g.font='bold 10px Arial';g.textAlign='right';
    g.fillText(win?'V':'I',W-24,cy);g.textAlign='left';
    cy+=16;
   });
   g.fillStyle='#C79AA8';g.font='10px Arial';
   g.fillText(w+'V '+l+'I',20,cy+2);
   cy+=20;
  }
 });
 g.fillStyle='#C79AA8';g.font='bold 10px Arial';
 g.fillText('H2H: '+(m.home||'-')+' vs '+(m.away||'-'),20,cy+10);
 cy+=22;
 if(!h2h.length){

 }else{

 }
 g.fillStyle='#8B6670';g.font='9px Arial';

  }else{

}

<style>#fab-bilet,#mybilet{display:none!important}

   in doua feluri (unele cu data-t, Fotbal cu onclick), asa ca le prindem si
   prin CSS, si prin cod - vezi scoateBileteleDinSport(). */
[data-t="bilet"],[data-t="istoric"]{display:none!important}

/* ── Butoane "sticla": mat, translucid, cu o dunga de lumina sus ──────────
   Culorile nu mai sunt scrise de mana, ci luate din tema (--fata, --contur,
   --lumina). Asa acelasi stil merge si pe o tema inchisa, si pe una deschisa:

/* Textul care sta PESTE culoarea de accent. Pana acum era scris alb peste tot,

<script>
(function(){
 var SPORT_LABEL="Esports", SPORT_EMOJI="🎮";
 var lastSent=null;

 /* ── Ce se poate PARIA ────────────────────────────────────────────────────
    Doar pietele PRINCIPALE, care se verifica automat din scorul final si nu
    lasa biletul agatat. Am scos anume:
      - repriza 1 / repriza 2 (scorul la pauza lipseste des);
      - cornere si cartonase (vin din statistici, care lipsesc la ligile mici
        - selectia iesea "anulata" si biletul parea nedecis).
    Asa se verifica tot, imediat, din rezultatul meciului.                    */
 // 'GolEchipa' (gazdele/oaspetii marcheaza peste sau sub X), 'AH' (handicap
 // asiatic) si 'DNB' se verifica TOATE doar din scorul final - deci nu depind
 // de statistici si nu au ce cauta in lista celor blocate.
 var PIETE_PERMISE = (SPORT_LABEL==='Fotbal')
   ? ['1X2','DC','GG','Goluri','GolEchipa','AH','DNB']
   : ['WIN','TOT'];

 /* La ligile unde SofaScore tine statistici (posesie, cornere, cartonase) putem
    VERIFICA si pietele astea, deci nu mai are rost sa le blocam: cornere,
    cartonase, reprize si handicap. La ligile mici raman inchise, fiindca acolo
    biletul ar ramane vesnic nedecis. Lista de ligi vine din pagina de sport
    (DATA.ligi_cu_statistici), calculata din acoperirea reala a ultimelor zile. */
 // Cornerele se pot afla DOAR din statisticile de echipa.
 var PIETE_CU_STATISTICI = ['Cornere'];
 // Cartonasele si reprizele se pot afla si din cronologia meciului (minutul
 // fiecarui gol si al fiecarui cartonas). Sunt vizibil mai multe competitii cu
 // cronologie decat cu statistici complete - de exemplu calificarile din cupele
 // europene, unde SofaScore nu da posesie sau cornere, dar da tot ce s-a
 // intamplat pe teren.
 var PIETE_CU_CRONOLOGIE = ['Cartonase','GolR1','GolR2','R1X2'];
 var LIGI_CU_STATISTICI = null, LIGI_CU_CRONOLOGIE = null;
 function _incarcaLigi(){
  if(LIGI_CU_STATISTICI!==null)return;
  LIGI_CU_STATISTICI={};LIGI_CU_CRONOLOGIE={};
  try{
   (window.DATA&&window.DATA.ligi_cu_statistici||[]).forEach(function(l){
    LIGI_CU_STATISTICI[String(l).trim().toLowerCase()]=true;
   });
   (window.DATA&&window.DATA.ligi_cu_cronologie||[]).forEach(function(l){
    LIGI_CU_CRONOLOGIE[String(l).trim().toLowerCase()]=true;
   });
  }catch(e){}
 }
 function ligaAreStatistici(numeLiga){
  _incarcaLigi();
  return !!LIGI_CU_STATISTICI[String(numeLiga||'').trim().toLowerCase()];
 }
 function ligaAreCronologie(numeLiga){
  _incarcaLigi();
  var k=String(numeLiga||'').trim().toLowerCase();
  // cine are statistici are aproape sigur si cronologie
  return !!(LIGI_CU_CRONOLOGIE[k]||LIGI_CU_STATISTICI[k]);
 }
 function ligaDinCard(card){
  if(!card)return '';
  var b=card.querySelector('.badge.b-liga');
  if(!b)return '';
  // insigna scrie "Tara - Liga"; pastram doar liga
  var txt=(b.textContent||'').trim();
  var parti=txt.split('·');
  return (parti.length>1?parti[parti.length-1]:txt).trim();
 }
 function _permisaPtLiga(tip,liga){
  if(PIETE_PERMISE.indexOf(tip)>=0)return true;
  if(SPORT_LABEL!=='Fotbal')return false;
  if(PIETE_CU_STATISTICI.indexOf(tip)>=0)return ligaAreStatistici(liga);
  if(PIETE_CU_CRONOLOGIE.indexOf(tip)>=0)return ligaAreCronologie(liga);
  return false;
 }
 function pietaPermisa(tip,card){ return _permisaPtLiga(tip,ligaDinCard(card)) }
 // varianta cu meciul in mana (addPick il primeste) - mai sigura decat cititul
 // ligii din card, fiindca ia numele exact asa cum e in date
 function pietaPermisaMeci(tip,m){ return _permisaPtLiga(tip,m&&m.liga) }

 /* ── Detaliile unui meci se platesc ───────────────────────────────────────
    Monedele stau in pagina principala (parinte), nu aici, deci cerem voie
    prin mesaj. Un meci deja platit ramane deblocat - nu platesti de doua ori.
    Interceptam in faza de "capture" ca sa oprim actiunea paginii inainte sa
    apuce sa deschida detaliile.                                             */
 var asteptariDeblocare={};
 function numeMeciDinCard(el){
  var card=el&&el.closest?el.closest('.mc'):null;
  if(!card)return null;
  var nume=[].slice.call(card.querySelectorAll('.tn')).map(function(x){return (x.textContent||'').trim()});
  return nume.length>=2?(nume[0]+' vs '+nume[1]):null;
 }
 /* Detaliile NU se deschid doar din butonul "Detalii": paginile de sport pun
    acelasi lucru si pe click oriunde pe card. Daca pazeam doar butonul, cine
    apasa pe card intra gratis - exact asa s-a si intamplat. Deci pazim tot
    cardul si lasam sa treaca doar lucrurile care fac altceva: cotele (merg pe
    bilet), butonul de copiere, linkurile si campurile de scris. */
 function cardDeDeschis(ev){
  var t=ev.target;
  if(!t||!t.closest)return null;
  if(t.closest('[data-pick],[data-pick-ou],[data-pick-gg],[data-pick-tip],.piata-btn,.btn-cp,a,input,select,textarea,label'))
   return null;
  return t.closest('.mc');
 }
 /* Fara cont, meciurile deja incepute sau terminate RAMAN la vedere - se vede
    ca s-au jucat si cu ce scor - dar nu se pot deschide. Asa, ligile nu mai
    raman goale (ala era motivul pentru care nu se deschidea nimic cand
    apasai pe ele) si totusi rezultatele nu sunt de pomana. */
 document.addEventListener('click',function(ev){
  if(!MOD_INVITAT)return;
  var card=cardDeDeschis(ev);
  if(!card)return;
  if(!stareMeci(card))return;
  ev.preventDefault();ev.stopPropagation();
  try{window.parent.postMessage({type:'arata-mesaj',titlu:'Meci jucat',
   corp:'<p>Meciul asta s-a jucat deja.</p>'+
        '<p class="sub">Detaliile meciurilor jucate - statistici, cronologie, '+
        'formatii - se vad cu cont.</p>'},'*')}catch(e){}
 },true);

 /* Detaliile sunt GRATIS: nu mai interceptam clicul ca sa cerem monede.
    Monedele raman doar pentru miza cand joci un bilet. */
 window.addEventListener('message',function(e){
  if(!e.data||e.data.type!=='raspuns-detalii')return;
  var f=asteptariDeblocare[e.data.id];
  if(f){delete asteptariDeblocare[e.data.id];f(e.data.ok)}
 });

 /* ── Pe card NU se mai vede niciun pick ───────────────────────────────────
    Cardul din lista spune doar DACA meciul are sau nu un pick de incredere -
    scris langa ora, ca sa nu dai 5 monede degeaba pe un meci fara pick.
    Pick-ul propriu-zis (cel cu stea, ales dupa istoricul real) si toate
    explicatiile apar in "Detalii". Facem asta prin ascundere dupa randare, ca
    sa nu fie nevoie de modificari in cele 22 de fisiere de sport.            */
 var PRAG_CARD=70;      // sub atat, meciul e considerat "fara pick de incredere"

 function catDeSigur(txt){
  // cat de sigur e un pick: procentul afisat si/sau raportul din istoric "(6/9)"
  var cat=null;
  var proc=txt.match(/([0-9]+)[ ]*%/);
  if(proc)cat=parseInt(proc[1]);
  var rap=txt.match(/\(([0-9]+)\/([0-9]+)\)/);
  if(rap){
   var n=parseInt(rap[2]);
   var r=n?parseInt(rap[1])/n*100:0;
   cat=(cat==null)?r:Math.min(cat,r);            // luam cea mai slaba dintre ele
  }
  return cat==null?-1:cat;
 }

 /* Lista "Top Picks" din capul paginii dadea pe gratis exact ce se plateste
    in Detalii - o ascundem, impreuna cu randul de pick-uri de sub ea.        */
 function ascundeTopPicks(){
  var titluri=document.querySelectorAll('.stitle');
  for(var i=0;i<titluri.length;i++){
   var t=titluri[i];
   if(t.__ascuns)continue;
   if((t.textContent||'').toLowerCase().indexOf('top picks')<0)continue;
   t.__ascuns=true;
   t.style.display='none';
   var urm=t.nextElementSibling;
   if(urm&&!urm.classList.contains('stitle'))urm.style.display='none';
  }
 }

 /* Pe card se vede TOT din nou: pick-ul cu stea, recomandarea si istoricul.
    A fost o vreme cand le ascundeam, fiindca detaliile costau monede si n-avea
    rost sa dai bani pe ceva ce se vedea oricum pe card. Acum detaliile sunt
    gratuite, deci nu mai are sens sa ascundem nimic - informatia sta unde e
    cel mai la indemana, adica pe card.                                       */
 function curataPickurileDinCard(){}

 /* ── Meciurile deja incepute nu se mai pot juca ───────────────────────────
    Pana acum, un meci care incepuse (sau se terminase) ramanea in lista de
    "Azi" si putea fi pus pe bilet - adica se putea paria stiind rezultatul.
    Acum astfel de meciuri se muta intr-un tab separat, "Incepute": se pot
    vedea, dar nu se mai pot adauga pe bilet.                                 */
 var ZI_TAB={pred:1,maine:1,azi:0,ieri:-1};   // cate zile fata de ziua generarii
 // Ziua in care a fost facuta pagina. Cardurile arata doar ora, nu si data, iar
 // "Azi/Maine/Ieri" sunt fata de ziua asta - nu fata de ziua de pe telefon.
 // Fara reperul asta, o aplicatie ramasa deschisa peste miezul noptii credea ca
 // meciurile de aseara sunt de azi si le arata ca nejucate.
 var DATA_GENERARE="2026-08-08";

 function zileTab(card){
  var tc=card.closest?card.closest('.tc'):null;
  if(!tc)return null;
  var id=(tc.id||'').replace('tc-','');
  return (id in ZI_TAB)?ZI_TAB[id]:null;
 }
 // Cat tine un meci, cu tot cu pauza si prelungiri de arbitru. Dupa atat il
 // consideram terminat. Doua ore acopera fotbalul si aproape toate sporturile
 // de echipa; la un meci care se lungeste, singurul efect e ca scrie "terminat"
 // cu cateva minute mai devreme - pariurile oricum erau deja inchise de la
 // primul fluier.
 var MINUTE_PANA_SE_TERMINA=120;

 /* Ora de start a meciului, ca timp absolut. null daca nu se poate afla. */
 function oraStartMeci(card){
  if(!card)return null;
  var z=zileTab(card);
  if(z===null)return null;       // liste care nu sunt de pariat (evaluare etc.)
  var el=card.querySelector('.mc-time');
  if(!el)return null;
  // la Fotbal scrie "14:00 UK / 16:00 RO" - ne intereseaza ULTIMA ora (a
  // noastra); la restul sporturilor e o singura ora, tot ultima
  var ore=(el.textContent||'').match(/[0-9]{1,2}:[0-9]{2}/g);
  if(!ore||!ore.length)return null;
  var p=ore[ore.length-1].split(':');
  var start=new Date(DATA_GENERARE+'T00:00:00');
  if(isNaN(start.getTime()))return null;
  start.setDate(start.getDate()+z);                       // Ieri / Azi / Maine
  start.setHours(parseInt(p[0],10),parseInt(p[1],10),0,0);
  return start.getTime();
 }

 /* 0 = n-a inceput, 1 = se joaca acum, 2 = s-a terminat. */
 function stareMeci(card){
  if(!card)return 0;
  var z=zileTab(card);
  if(z===null)return 0;
  if(z<0)return 2;               // "Ieri" - s-au jucat deja
  var start=oraStartMeci(card);
  if(start===null)return 0;
  var acum=Date.now();           // "acum" = ceasul telefonului
  if(acum<start)return 0;
  return (acum-start>=MINUTE_PANA_SE_TERMINA*60000)?2:1;
 }

 function meciInceput(card){ return stareMeci(card)>0 }

 /* ── Biletele raman doar la Master ────────────────────────────────────────
    Fiecare pagina de sport avea propriul "Bilet AI" si propriul istoric de
    bilete. Erau confuze si dadeau pe gratis selectii pe care Master le arata
    oricum. Le scoatem: biletul zilei e unul singur, in pagina principala.
    (Functia asta fusese stearsa din greseala odata cu tab-ul "Incepute" -
    statea intre aceleasi repere in fisier.)                                  */
 (function scoateBileteleDinSport(){
  function ascunde(){
   var tabs=document.querySelectorAll('.tabs .tab');
   for(var i=0;i<tabs.length;i++){
    var oc=(tabs[i].getAttribute('onclick')||'')+'|'+(tabs[i].getAttribute('data-t')||'');
    if(oc.indexOf("'bilet'")>=0||oc.indexOf("'istoric'")>=0||
       /[|](bilet|istoric)$/.test(oc)){
     if(tabs[i].classList.contains('active')&&tabs[0]){
      // daca stateai pe tab-ul ascuns, te mutam pe primul. Apasam butonul, nu
      // chemam functia paginii: sporturile nu au toate aceeasi functie.
      try{tabs[0].click()}catch(e){}
     }
     tabs[i].style.display='none';
    }
   }
  }
  ascunde();
  setTimeout(ascunde,400);
  setTimeout(ascunde,1500);
  setTimeout(ascunde,4000);
 })();

 /* Meciurile incepute RAMAN unde sunt - in ziua lor, in liga lor. Nu le mai
    mutam nicaieri: se vad in continuare cu tot ce au (statistici, detalii,
    echipe probabile), doar ca nu se mai poate paria pe ele. Inainte le mutam
    intr-un tab separat, dar asa "Azi" ramanea seara cu zeci de ligi goale, in
    care apasai si nu se deschidea nimic.                                     */
 function marcheazaMeciurileIncepute(){
  var carduri=document.querySelectorAll('.mc');
  for(var i=0;i<carduri.length;i++){
   var card=carduri[i];
   var stare=stareMeci(card);
   if(!stare)continue;
   // Marcam din nou daca s-a schimbat starea: un meci pe care l-ai vazut la
   // 19:05 ca "se joaca" trebuie sa scrie "terminat" cand te intorci la 21:30,
   // fara sa reincarci pagina.
   if(card.__stareMarcata===stare)continue;
   card.__stareMarcata=stare;
   var cap=card.querySelector('.mc-head');
   if(!cap)continue;
   var et=cap.querySelector('.mrf-inceput');
   if(!et){
    et=document.createElement('span');
    et.className='badge mrf-inceput';
    var ora=cap.querySelector('.mc-time');
    if(ora)cap.insertBefore(et,ora); else cap.appendChild(et);
   }
   if(stare===2){
    et.textContent='Terminat';
    et.style.cssText='background:rgba(255,255,255,.06);color:#7c7f89';
   }else{
    et.textContent='Se joaca acum';
    et.style.cssText='background:rgba(34,197,94,.15);color:#22C55E';
   }
  }
 }
 // Starea se schimba singura in timp, deci o recitim din cand in cand cat sta
 // pagina deschisa. Un minut e destul de des cat sa nu ratezi trecerea si destul
 // de rar cat sa nu conteze pentru baterie.
 setInterval(function(){try{marcheazaMeciurileIncepute()}catch(e){}},60000);

 /* ── Steluta de pe card si vederea "Favorite" ─────────────────────────────
    Apesi steluta pe un meci si ramane insemnat pana o apesi din nou. Tab-ul
    "Favorite" din aplicatie ne trimite un mesaj, iar noi ascundem cardurile
    neinsemnate. Ascunderea o face CSS-ul, nu mutam nimic din pagina: asa,
    cand iesi din vedere, totul e la locul lui, cu butoanele si detaliile
    care mergeau si inainte.
    Insemnele stau pe telefon, nu pe cont: e o comoditate de aparat, ca
    "deschis/inchis" la ligi.                                                */
 var FAV={};
 try{FAV=JSON.parse(localStorage.getItem('mrfMeciuriFav')||'{}')||{}}catch(e){FAV={}}
 (function curataFav(){
  // dupa o saptamana un meci oricum nu mai e in pagina; nu tinem gunoi la
  // nesfarsit in memoria telefonului
  var limita=Date.now()-7*86400000, schimbat=false;
  Object.keys(FAV).forEach(function(k){ if(!FAV[k]||FAV[k]<limita){delete FAV[k];schimbat=true} });
  if(schimbat)salveazaFav();
 })();
 function salveazaFav(){
  try{localStorage.setItem('mrfMeciuriFav',JSON.stringify(FAV))}catch(e){}
 }
 function cheiaMeciului(card){
  var n=card.querySelectorAll('.mc-teams .tn');
  if(!n||n.length<2)return '';
  return SPORT_LABEL+'|'+(n[0].textContent||'').trim()+'|'+(n[1].textContent||'').trim();
 }
 function puneStelutele(){
  var carduri=document.querySelectorAll('.mc');
  for(var i=0;i<carduri.length;i++){
   var card=carduri[i], cap=card.querySelector('.mc-head');
   if(!cap)continue;
   var cheie=cheiaMeciului(card);
   if(!cheie)continue;
   card.__cheieFav=cheie;
   var fav=!!FAV[cheie];
   card.classList.toggle('mrf-fav',fav);
   var st=cap.querySelector('.mrf-stea');
   if(!st){
    st=document.createElement('button');
    st.className='mrf-stea';
    st.type='button';
    cap.insertBefore(st,cap.firstChild);
    st.addEventListener('click',function(ev){
     ev.preventDefault(); ev.stopPropagation();
     var c=ev.target.closest('.mc'); if(!c||!c.__cheieFav)return;
     if(FAV[c.__cheieFav]){delete FAV[c.__cheieFav]} else {FAV[c.__cheieFav]=Date.now()}
     salveazaFav();
     puneStelutele();
    },true);
   }
   st.textContent=fav?'★':'☆';
   st.title=fav?'Scoate de la favorite':'Pune la favorite';
   st.style.color=fav?'#E4B363':'';

   /* Butonul de trimis pe chat. Nu trimite el mesajul: deschide chatul cu
      textul deja scris, ca sa alegi tu cui il dai - toata lumea sau unul
      anume. Trimitem doar un rand de text, nu o poza sau alt document, deci
      nu costa nimic in plus la Firebase: e acelasi fel de mesaj ca oricare. */
   var sh=cap.querySelector('.mrf-share');
   if(!sh){
    sh=document.createElement('button');
    sh.className='mrf-share';
    sh.type='button';
    sh.textContent='➦';
    sh.title='Trimite meciul pe chat';
    cap.appendChild(sh);
    sh.addEventListener('click',function(ev){
     ev.preventDefault(); ev.stopPropagation();
     var c=ev.target.closest('.mc'); if(!c)return;
     var n=c.querySelectorAll('.mc-teams .tn');
     if(!n||n.length<2)return;
     var ora=c.querySelector('.mc-time');
     try{window.parent.postMessage({type:'trimite-meci',
       sport:SPORT_LABEL, emoji:SPORT_EMOJI,
       gazda:(n[0].textContent||'').trim(), oaspete:(n[1].textContent||'').trim(),
       ora:(ora?(ora.textContent||'').trim():'')},'*')}catch(e){}
    },true);
   }
  }
 }
 var stilFav=document.createElement('style');
 stilFav.textContent=
  '.mrf-stea{background:none;border:0;color:var(--muted);font-size:15px;line-height:1;'+
  'padding:0 2px;margin-right:2px;cursor:pointer;flex:0 0 auto}'+
  '.mrf-share{background:none;border:0;color:var(--muted);font-size:14px;line-height:1;'+
  'padding:0 4px;margin-left:auto;cursor:pointer;flex:0 0 auto;transform:rotate(0deg)}'+
  '.mrf-share:hover{color:var(--red)}'+
  /* in vederea Favorite aratam toate zilele deodata, doar cu meciurile
     insemnate, si deschidem ligile ca sa nu apesi de doua ori */
  'body.mrf-doar-fav .tc{display:block !important}'+
  'body.mrf-doar-fav .mc:not(.mrf-fav){display:none !important}'+
  'body.mrf-doar-fav .liga-grup:not(:has(.mrf-fav)){display:none !important}'+
  'body.mrf-doar-fav .liga-corp{display:block !important}'+
  'body.mrf-doar-fav .nf-rand,body.mrf-doar-fav .tabs{display:none !important}'+
  'body.mrf-doar-fav .mrf-fav-gol{display:block}'+
  '.mrf-fav-gol{display:none;text-align:center;color:var(--muted);padding:34px 16px;font-size:13px}';
 document.head.appendChild(stilFav);
 var golFav=document.createElement('div');
 golFav.className='mrf-fav-gol';
 golFav.innerHTML='☆ Niciun meci la favorite.<br><span style="font-size:11px">'+
   'Apasa steluta de pe un meci si ramane aici pana o apesi din nou.</span>';
 (function pune(){
  if(document.body)document.body.appendChild(golFav);
  else setTimeout(pune,200);

 /* ── Aceeasi oprire, dar in fereastra de "Detalii" ────────────────────────
    Aici era o gaura prin care se putea paria pe un meci deja inceput sau
    terminat: verificarea de mai jos cauta cardul (.mc) in care sta butonul,
    dar in fereastra de detalii butoanele NU sunt intr-un card - sunt in
    #mbody. Deci closest('.mc') dadea null, starea iesea "n-a inceput" si
    clicul trecea. Pe card era oprit, la detalii nu.
    Toate paginile de sport tin meciul deschis in window.__currentModalMatch,
    de acolo luam ora: "start_time" la majoritatea, "data_meci"+"ora_meci" la
    fotbal.                                                                  */
 function oraMeciDinObiect(m){
  if(!m)return null;
  if(m.start_time){
   var t=Date.parse(m.start_time);
   if(!isNaN(t))return t;
  }
  if(m.data_meci){
   var ora=String(m.ora_meci||'00:00').substring(0,5);
   var t2=Date.parse(String(m.data_meci)+'T'+ora+':00');
   if(!isNaN(t2))return t2;
  }
  return null;
 }
 function stareMeciDinFereastra(el){
  if(!el||!el.closest||!el.closest('#mbody'))return 0;
  var start=oraMeciDinObiect(window.__currentModalMatch);
  if(start===null)return 0;
  var acum=Date.now();
  if(acum<start)return 0;
  return (acum-start>=MINUTE_PANA_SE_TERMINA*60000)?2:1;
 }

 /* ── Butonul "inapoi" de pe telefon ───────────────────────────────────────
    In aplicatie, cand esti in fereastra de detalii si apesi inapoi, ieseai
    direct din aplicatie - fiindca detaliile sunt doar un strat desenat peste
    pagina, nu o pagina noua, deci n-avea unde sa se intoarca. Acum anuntam
    pagina principala cand se deschide ceva, ea tine minte un pas in istoric,
    iar la "inapoi" ne cere sa inchidem stratul de deasupra. */
 function esteVizibil(id){
  var e=document.getElementById(id);
  if(!e)return false;
  // NU folosim offsetParent: la elementele fixate pe ecran (position:fixed) e
  // mereu null, deci fisa jucatorului parea inchisa chiar cand era pe ecran,
  // iar butonul inapoi inchidea detaliile in locul ei.
  try{
   if(getComputedStyle(e).display==='none')return false;
   return e.getClientRects().length>0;
  }catch(err){return false}
 }
 // cate straturi sunt deschise peste pagina: detaliile meciului, si peste ele
 // eventual fisa unui jucator
 function adancimeStraturi(){
  var n=0;
  if(esteVizibil('modal'))n++;
  if(esteVizibil('juc-panel'))n++;
  return n;
 }
 function inchideFereastraDetalii(){
  try{
   // intai fisa jucatorului, daca e deschisa - abia apoi detaliile
   if(esteVizibil('juc-panel')){
    if(typeof window.inchideJucator==='function'){window.inchideJucator();return true}
    document.getElementById('juc-panel').style.display='none';
    return true;
   }
   if(typeof window.clom==='function'){window.clom();return true}
   var b=document.querySelector('#modal .m-close');
   if(b){b.click();return true}
   if(esteVizibil('modal')){document.getElementById('modal').style.display='none';return true}
  }catch(e){}
  return false;
 }
 (function urmaresteFereastra(){

   if(acum===inainte)return;
   var tip=acum>inainte?'strat-deschis':'strat-inchis';
   var cate=Math.abs(acum-inainte);
   inainte=acum;
   for(var i=0;i<cate;i++){
    try{window.parent.postMessage({type:tip,sport:SPORT_LABEL},'*')}catch(e){}
   }
  },250);
 })();

 /* ── Cand deschizi un sport, vezi ZIUA DE AZI ─────────────────────────────
    Paginile de sport porneau pe "Maine", fiindca de acolo a inceput totul:

    incarcare - si doar daca tab-ul "Azi" chiar are meciuri, ca sa nu ajungi
    pe o lista goala. Daca apesi tu pe altceva dupa, nu ne mai bagam.          */
 (function deschideZiuaDeAzi(){
  var facut=false;
  function incearca(){
    if(facut)return;
    var tabs=document.querySelectorAll('.tabs .tab');
    if(!tabs.length)return;
    // fara prescurtari cu backslash in regex: sablonul asta e un string Python
    // obisnuit, unde backslash-ul inseamna altceva
    var azi=null;
    for(var i=0;i<tabs.length;i++){
      var t=(tabs[i].textContent||'').trim().toLowerCase();
      if(t.indexOf('azi')===0){azi=tabs[i];break}
    }
    if(!azi)return;
    // "Azi (0)" inseamna ca azi nu se joaca nimic - atunci lasam cum era
    var txt=azi.textContent||'', p1=txt.indexOf('('), p2=txt.indexOf(')');
    if(p1>=0&&p2>p1){
      var cate=parseInt(txt.substring(p1+1,p2).replace(/[^0-9]/g,''),10);
      if(cate===0){facut=true;return}
    }
    facut=true;
    if(!azi.classList.contains('active')){
      try{azi.click()}catch(e){}
    }
  }
  var t=setInterval(function(){
    incearca();
    if(facut)clearInterval(t);
  },200);
  setTimeout(function(){clearInterval(t)},15000);
 })();

  var cap=container.querySelector(':scope > .mrf-cap-cautare');
  if(cap)return cap;
  cap=document.createElement('div');
  cap.className='mrf-cap-cautare';
  cap.style.cssText='font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;'+
    'color:var(--gold);padding:10px 4px 4px';
  container.insertBefore(cap,container.firstChild);
  return cap;
 }
 function aplicaCautarePesteTot(q){
  q=String(q||'').trim().toLowerCase();
  var toate=document.querySelectorAll('.tc');
  var i,k;

  if(!q){
   if(tabDinainteDeCautare===null)return;
   for(i=0;i<toate.length;i++){
    toate[i].classList.toggle('active',toate[i].id===tabDinainteDeCautare);
    var vechiCap=toate[i].querySelector('.mrf-cap-cautare');
    if(vechiCap)vechiCap.remove();
   }
   var ascunse=document.querySelectorAll('.mc[data-mrf-cautare]');
   for(k=0;k<ascunse.length;k++){
    ascunse[k].style.display='';
    ascunse[k].removeAttribute('data-mrf-cautare');
   }
   tabDinainteDeCautare=null;
   return;
  }

  if(tabDinainteDeCautare===null){
   tabDinainteDeCautare='tc-pred';
   for(i=0;i<toate.length;i++)if(toate[i].classList.contains('active'))tabDinainteDeCautare=toate[i].id;
  }

  for(i=0;i<toate.length;i++){
   var c=toate[i];
   var titlu=TITLU_TAB[c.id]||null;
   if(!titlu){c.classList.remove('active');continue}
   var carduri=c.querySelectorAll('.mc'), gasite=0;
   for(k=0;k<carduri.length;k++){
    var card=carduri[k];
    if(potriveste(card,q)){
     if(card.getAttribute('data-mrf-cautare')){card.style.display='';card.removeAttribute('data-mrf-cautare')}
     gasite++;
    }else{
     card.setAttribute('data-mrf-cautare','ascuns');
     card.style.display='none';
    }
   }
   c.classList.toggle('active',gasite>0);
   if(gasite>0)capDeLista(c).textContent=titlu+' - '+gasite+(gasite===1?' meci':' meciuri');
   else{var cc=c.querySelector('.mrf-cap-cautare');if(cc)cc.remove()}
  }
 }

 window.addEventListener('message',function(e){
  if(!e.data||e.data.type!=='remove-pick'||e.data.sport!==SPORT_LABEL)return;
  var idx=(window.myBilet||[]).findIndex(function(it){
   var m=it.m||{};
   var home=m.home||m.echipa_gazda||'';
   var away=m.away||m.echipa_oaspete||'';
   return (home+'|'+away+'|'+it.tip)===e.data.key;
  });
  if(idx>=0){
   window.myBilet.splice(idx,1);
   try{if(typeof saveBilet==='function')saveBilet()}catch(e){}
   try{if(typeof salveazaBilet==='function')salveazaBilet()}catch(e){}
   try{if(typeof renderTab==='function')renderTab('bilet')}catch(e){}
   try{if(typeof renderMyBilet==='function')renderMyBilet()}catch(e){}
   try{if(typeof applyF==='function')applyF()}catch(e){}
   checkSync();
  }
 });
 setInterval(checkSync,700);
 setTimeout(checkSync,300);
})();
